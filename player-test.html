
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>R.M.B. – YouTube Player Test</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Michroma&display=swap"
    rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      background: #121820;
      color: #ffffff;
      font-family: 'Michroma', sans-serif;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      color: #dce6f2;
      margin-bottom: 15px;
    }

    h2 {
      font-size: 15px;
      margin: 30px 0 15px;
    }

    p {
      font-size: 11px;
      line-height: 2;
      color: #a4b5c9;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-top: 25px;
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    a {
      color: #b6d5f5;
      font-size: 11px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>R.M.B.</h1>

    <p>YOUTUBE PLAYER TEST</p>

    <h2>
      The Pulse of the Earth<br>
      (Tribal Flute Mix)
    </h2>

    <div class="player">

      <iframe
        src="https://www.youtube.com/embed/kg21wBqmves"
        title="R.M.B. - The Pulse of the Earth"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>

    </div>

    <p>
      Wenn du den Song hier starten kannst,
      funktioniert die YouTube-Einbettung.
    </p>

    <p>
      <a
        href="https://youtu.be/kg21wBqmves"
        target="_blank"
        rel="noopener noreferrer">
        Alternativ auf YouTube öffnen
      </a>
    </p>

  </div>

</body>
</html>
