
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R.M.B. | Electronic Music</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Michroma', sans-serif;
  background: #121820;
  color: white;
}

/* WEISSER LOGO-BANNER */
header {
  width: 100%;
  background: white;
}

header img {
  display: block;
  width: 100%;
  height: auto;
}

/* MENÜ MITTIG */
nav {
  display: flex;
  justify-content: center;
  gap: 28px;
  flex-wrap: wrap;
  background: #262b35;
  padding: 22px 12px;
  border-bottom: 1px solid #48515f;
}

nav a {
  color: #cbd2dd;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
}

nav a:hover {
  color: white;
}

/* AKTIVE SEITE - SILBERWEISSES LEUCHTEN */
nav a.active {
  color: #ffffff;
  text-shadow:
    0 0 5px rgba(255,255,255,0.95),
    0 0 10px rgba(220,235,255,0.80),
    0 0 18px rgba(190,215,245,0.55);
}

/* SEITENINHALT */
main {
  max-width: 1150px;
  margin: auto;
  padding: 35px 22px;
}

.hero {
  background: #1c2530;
  padding: 35px 28px;
  border-radius: 8px;
}

.wave {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 95px;
  overflow: hidden;
  margin-bottom: 25px;
}

.wave span {
  display: block;
  width: 3px;
  flex-shrink: 0;
  background: #a4b5c9;
  border-radius: 3px;
  animation: pulse 2s ease-in-out infinite alternate;
}

@keyframes pulse {
  from { transform: scaleY(.65); }
  to { transform: scaleY(1); }
}

.origin {
  color: #a9b6c8;
  font-size: 11px;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(28px, 5vw, 46px);
  margin: 14px 0;
}

.subtitle {
  color: #c5cdd8;
}

/* LATEST RELEASES */
.releases {
  margin-top: 45px;
}

.cover-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.cover {
  background: #313a47;
  aspect-ratio: 1;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a6b2c1;
  font-size: 12px;
  overflow: hidden;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.song {
  margin-top: 12px;
  font-weight: bold;
  font-size: 12px;
  line-height: 1.8;
}

.artist {
  color: #a7b0bf;
  font-size: 13px;
  margin-top: 5px;
}

.release-date {
  color: #a7b0bf;
  font-size: 10px;
  margin-top: 7px;
}

.release-link {
  display: block;
  text-decoration: none;
  color: inherit;
}

.release-link:hover .song {
  color: #ffffff;
  text-shadow: 0 0 8px rgba(220,235,255,0.65);
}

/* FUSSZEILE */
footer {
  text-align: center;
  background: #252a34;
  color: #b9c2cf;
  padding: 25px;
  margin-top: 65px;
}

@media(max-width:600px) {
  nav { gap: 15px; }
  nav a { font-size: 11px; }
  main { padding: 22px 15px; }
  .cover-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <img src="rmb-banner.png" alt="R.M.B. Diamond Logo">
</header>

<nav>
  <a class="active" href="index.html">HOME</a>
  <a href="music.html">MUSIC</a>
  <a href="upcoming.html">UPCOMING</a>
  <a href="about.html">ABOUT</a>
  <a href="contact.html">CONTACT</a>
</nav>

<main>

<section class="hero">
  <div class="wave" id="wave" aria-hidden="true"></div>

  <div class="origin">
    FRANKFURT · ELECTRONIC ROOTS
  </div>

  <h1>The Sound of R.M.B.</h1>

  <p class="subtitle">
    90s Eurodance · Techno · Trance · EDM
  </p>
</section>

<section class="releases">
  <h2>Latest Releases</h2>

  <div class="cover-grid" id="latest-releases">
  </div>

</section>

</main>

<footer>
  R.M.B. · Independent Electronic Music
</footer>

<script>

/* ANIMIERTE SOUNDWELLE */
const wave = document.getElementById("wave");

for (let i = 0; i < 64; i++) {
  const bar = document.createElement("span");
  bar.style.height =
    (8 + Math.abs(Math.sin(i * 1.71) * 65)) + "px";
  bar.style.animationDelay = (i * .035) + "s";
  wave.appendChild(bar);
}


/* AKTUELL BEKANNTE VERÖFFENTLICHUNGEN */
/* Diese dienen als Ausgangsdaten, bis die
   MUSIC-Seite ihre Daten bereitstellt. */

const initialReleases = [
  {
    title: "The Pulse of the Earth (Tribal Flute Mix)",
    date: "2026-08-18",
    youtube: "https://youtu.be/kg21wBqmves"
  },
  {
    title: "LaPalma (Astral Flow)",
    date: "2026-10-05",
    youtube: "https://youtu.be/xJInRUzUBcg"
  },
  {
    title: "LaPalma (Celestial Drift)",
    date: "2026-10-14",
    youtube: "https://youtu.be/E_onL29z7n0"
  }
];


/* DATUM FORMATIEREN */
function formatDate(dateString) {
  const parts = dateString.split("-");

  if (parts.length !== 3) {
    return dateString;
  }

  return parts[2] + "." + parts[1] + "." + parts[0];
}


/* YOUTUBE-VIDEO-ID ERMITTELN */
function getYouTubeId(url) {
  try {
    const parsed = new URL(url);

    if (
      parsed.hostname === "youtu.be" ||
      parsed.hostname === "www.youtu.be"
    ) {
      return parsed.pathname.split("/")[1];
    }

    if (
      parsed.hostname === "youtube.com" ||
      parsed.hostname === "www.youtube.com"
    ) {
      if (parsed.pathname === "/watch") {
        return parsed.searchParams.get("v");
      }
    }
  } catch (error) {
    return null;
  }

  return null;
}


/* DIE DREI NEUESTEN VERÖFFENTLICHUNGEN */
function renderLatestReleases(releases) {

  const container =
    document.getElementById("latest-releases");

  container.replaceChildren();

  const latest = [...releases]
    .filter(item => item.title && item.date)
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 3);

  latest.forEach(item => {

    const wrapper = document.createElement("div");

    const link = document.createElement("a");
    link.className = "release-link";

    const videoId = getYouTubeId(item.youtube || "");

    if (videoId) {
      link.href = "https://www.youtube.com/watch?v=" +
                  encodeURIComponent(videoId);
      link.target = "_blank";
      link.rel = "noopener noreferrer";
    } else {
      link.href = "music.html";
    }

    const cover = document.createElement("div");
    cover.className = "cover";

    if (videoId) {
      const img = document.createElement("img");
      img.src =
        "https://img.youtube.com/vi/" +
        encodeURIComponent(videoId) +
        "/hqdefault.jpg";
      img.alt = item.title;
      img.loading = "lazy";

      img.onerror = function() {
        cover.textContent = "R.M.B.";
      };

      cover.appendChild(img);
    } else {
      cover.textContent = "R.M.B.";
    }

    const song = document.createElement("div");
    song.className = "song";
    song.textContent = item.title;

    const artist = document.createElement("div");
    artist.className = "artist";
    artist.textContent = "R.M.B.";

    const releaseDate = document.createElement("div");
    releaseDate.className = "release-date";
    releaseDate.textContent = formatDate(item.date);

    link.appendChild(cover);
    link.appendChild(song);
    link.appendChild(artist);
    link.appendChild(releaseDate);

    wrapper.appendChild(link);
    container.appendChild(wrapper);

  });
}


/* VERÖFFENTLICHUNGEN VON MUSIC.HTML LADEN */
/*
  Voraussetzung für die automatische Übernahme:

  Die MUSIC-Seite stellt für jeden Song
  folgende Datenattribute bereit:

  data-release-title
  data-release-date
  data-release-youtube

  Sobald diese vorhanden sind, übernimmt
  HOME die Veröffentlichungen automatisch.
*/

async function loadMusicReleases() {

  try {

    const response = await fetch("music.html", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("MUSIC-Seite nicht erreichbar");
    }

    const html = await response.text();

    const parser = new DOMParser();
    const doc = parser.parseFromString(
      html,
      "text/html"
    );

    const elements = doc.querySelectorAll(
      "[data-release-title][data-release-date]"
    );

    const releases = [];

    elements.forEach(element => {

      const title =
        element.getAttribute("data-release-title");

      const date =
        element.getAttribute("data-release-date");

      const youtube =
        element.getAttribute("data-release-youtube") || "";

      if (
        title &&
        /^\d{4}-\d{2}-\d{2}$/.test(date)
      ) {
        releases.push({
          title: title,
          date: date,
          youtube: youtube
        });
      }

    });

    if (releases.length > 0) {
      renderLatestReleases(releases);
    }

  } catch (error) {
    console.warn(
      "Latest Releases: Ausgangsdaten werden verwendet.",
      error
    );
  }

}


/* START */
renderLatestReleases(initialReleases);
loadMusicReleases();

</script>

</body>
</html>
