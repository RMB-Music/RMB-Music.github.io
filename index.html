
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R.M.B. | Electronic Music</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Michroma', sans-serif;
  background: #121820;
  color: white;
}

/* WEISSER LOGO-BANNER */
header {
  width: 100%;
  background: white;
}

header img {
  display: block;
  width: 100%;
  height: auto;
}

/* MENÜ MITTIG */
nav {
  display: flex;
  justify-content: center;
  gap: 28px;
  flex-wrap: wrap;
  background: #262b35;
  padding: 22px 12px;
  border-bottom: 1px solid #48515f;
}

nav a {
  color: #cbd2dd;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
}

nav a:hover {
  color: white;
}

/* AKTIVE SEITE - SILBERWEISSES LEUCHTEN */
nav a.active {
  color: #ffffff;
  text-shadow:
    0 0 5px rgba(255,255,255,0.95),
    0 0 10px rgba(220,235,255,0.80),
    0 0 18px rgba(190,215,245,0.55);
}

/* SEITENINHALT */
main {
  max-width: 1150px;
  margin: auto;
  padding: 35px 22px;
}

.hero {
  background: #1c2530;
  padding: 35px 28px;
  border-radius: 8px;
}

.wave {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 95px;
  overflow: hidden;
  margin-bottom: 25px;
}

.wave span {
  display: block;
  width: 3px;
  flex-shrink: 0;
  background: #a4b5c9;
  border-radius: 3px;
  animation: pulse 2s ease-in-out infinite alternate;
}

@keyframes pulse {
  from { transform: scaleY(.65); }
  to { transform: scaleY(1); }
}

.origin {
  color: #a9b6c8;
  font-size: 11px;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(28px, 5vw, 46px);
  margin: 14px 0;
}

.subtitle {
  color: #c5cdd8;
}

/* LATEST RELEASES */
.releases {
  margin-top: 45px;
}

.cover-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.cover {
  background: #313a47;
  aspect-ratio: 1;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a6b2c1;
  font-size: 12px;
  overflow: hidden;
}

.cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.song {
  margin-top: 12px;
  font-weight: bold;
  font-size: 12px;
  line-height: 1.8;
}

.artist {
  color: #a7b0bf;
  font-size: 13px;
  margin-top: 5px;
}

.release-date {
  color: #a7b0bf;
  font-size: 10px;
  margin-top: 7px;
}

.release-link {
  display: block;
  color: inherit;
  text-decoration: none;
}

.release-link:hover .song {
  color: #ffffff;
  text-shadow: 0 0 8px rgba(220,235,255,0.65);
}

.release-link:focus-visible {
  outline: 2px solid #d4e4ff;
  outline-offset: 4px;
}

.release-status {
  grid-column: 1 / -1;
  color: #a7b0bf;
  font-size: 12px;
  line-height: 1.8;
}

/* FUSSZEILE */
footer {
  text-align: center;
  background: #252a34;
  color: #b9c2cf;
  padding: 25px;
  margin-top: 65px;
}

@media(max-width:600px) {
  nav { gap: 15px; }
  nav a { font-size: 11px; }
  main { padding: 22px 15px; }

  .cover-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <img src="rmb-banner.png" alt="R.M.B. Diamond Logo">
</header>

<nav>
  <a class="active" aria-current="page" href="index.html">HOME</a>
  <a href="music.html">MUSIC</a>
  <a href="upcoming.html">UPCOMING</a>
  <a href="about.html">ABOUT</a>
  <a href="contact.html">CONTACT</a>
</nav>

<main>

<section class="hero">

  <div class="wave" id="wave" aria-hidden="true"></div>

  <div class="origin">
    FRANKFURT · ELECTRONIC ROOTS
  </div>

  <h1>The Sound of R.M.B.</h1>

  <p class="subtitle">
    90s Eurodance · Techno · Trance · EDM
  </p>

</section>

<section class="releases">

  <h2>Latest Releases</h2>

  <div class="cover-grid" id="latest-releases">

    <div class="release-status">
      Veröffentlichungen werden geladen ...
    </div>

  </div>

</section>

</main>

<footer>
  R.M.B. · Independent Electronic Music
</footer>

<script>

/* ====================================
   ANIMIERTE SOUNDWELLE
==================================== */

const wave = document.getElementById("wave");

for (let i = 0; i < 64; i++) {

  const bar = document.createElement("span");

  bar.style.height =
    (8 + Math.abs(Math.sin(i * 1.71) * 65)) + "px";

  bar.style.animationDelay = (i * .035) + "s";

  wave.appendChild(bar);
}


/* ====================================
   LATEST RELEASES
   AUTOMATISCH AUS SONGS.JSON
==================================== */

const releasesContainer =
  document.getElementById("latest-releases");


/* ====================================
   DATUM FORMATIEREN
==================================== */

function formatReleaseDate(value) {

  const date = String(value || "").slice(0, 10);

  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
    return "";
  }

  const parts = date.split("-");

  return parts[2] + "." + parts[1] + "." + parts[0];
}


/* ====================================
   YOUTUBE-ID ERMITTELN
==================================== */

function getYouTubeId(value) {

  const input = String(value || "").trim();

  if (/^[A-Za-z0-9_-]{11}$/.test(input)) {
    return input;
  }

  try {

    const url = new URL(input);

    const host = url.hostname.toLowerCase();

    if (
      host === "youtu.be" ||
      host === "www.youtu.be"
    ) {
      return url.pathname.split("/")[1] || "";
    }

    if (
      host === "youtube.com" ||
      host === "www.youtube.com" ||
      host === "m.youtube.com"
    ) {

      if (url.pathname === "/watch") {
        return url.searchParams.get("v") || "";
      }

      const parts = url.pathname.split("/");

      if (
        ["shorts", "embed", "live"].includes(parts[1])
      ) {
        return parts[2] || "";
      }
    }

  } catch (error) {}

  return "";
}


/* ====================================
   LINK PRÜFEN
==================================== */

function safeURL(value) {

  try {

    const url = new URL(value, location.href);

    return ["https:", "http:"].includes(url.protocol)
      ? url.href
      : "";

  } catch (error) {
    return "";
  }
}


/* ====================================
   YOUTUBE-ODER-ALBUM-LINK
==================================== */

function getReleaseLink(item) {

  const original = String(item.youtube || "").trim();

  const videoId = getYouTubeId(original);

  if (/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
    return "https://www.youtube.com/watch?v=" + videoId;
  }

  return safeURL(original) || "music.html";
}


/* ====================================
   COVER ERMITTELN
==================================== */

function getReleaseCover(item) {

  const providedCover = safeURL(item.cover);

  if (providedCover) {
    return providedCover;
  }

  const videoId = getYouTubeId(item.youtube);

  if (/^[A-Za-z0-9_-]{11}$/.test(videoId)) {

    return (
      "https://img.youtube.com/vi/" +
      videoId +
      "/hqdefault.jpg"
    );
  }

  return "";
}


/* ====================================
   DIE DREI NEUESTEN ANZEIGEN
==================================== */

function renderLatestReleases(data) {

  releasesContainer.replaceChildren();

  const today = new Date();
  const localToday =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") + "-" +
    String(today.getDate()).padStart(2, "0");

  const latest = data

    .filter(item => {

      if (!item || !item.title || !item.releaseDate) {
        return false;
      }

      const date = String(item.releaseDate).slice(0, 10);

      return (
        /^\d{4}-\d{2}-\d{2}$/.test(date) &&
        date <= localToday
      );

    })

    .sort((a, b) => {

      return String(b.releaseDate)
        .localeCompare(String(a.releaseDate));

    })

    .slice(0, 3);


  if (!latest.length) {

    const message = document.createElement("div");
    message.className = "release-status";

    message.textContent =
      "Zurzeit sind keine Veröffentlichungen verfügbar.";

    releasesContainer.appendChild(message);

    return;
  }


  latest.forEach(item => {

    const wrapper = document.createElement("div");

    const link = document.createElement("a");
    link.className = "release-link";

    link.href = getReleaseLink(item);

    if (link.href !== new URL("music.html", location.href).href) {
      link.target = "_blank";
      link.rel = "noopener noreferrer";
    }

    const cover = document.createElement("div");
    cover.className = "cover";

    const coverURL = getReleaseCover(item);

    if (coverURL) {

      const image = document.createElement("img");

      image.src = coverURL;
      image.alt = item.title;
      image.loading = "lazy";

      image.onerror = function() {
        cover.textContent = "R.M.B.";
        image.remove();
      };

      cover.appendChild(image);

    } else {

      cover.textContent = "R.M.B.";

    }


    const song = document.createElement("div");
    song.className = "song";

    song.textContent = item.title;


    if (item.version) {

      const version = document.createElement("span");

      version.textContent = " (" + item.version + ")";

      song.appendChild(version);

    }


    const artist = document.createElement("div");
    artist.className = "artist";
    artist.textContent = "R.M.B.";


    const releaseDate = document.createElement("div");
    releaseDate.className = "release-date";

    releaseDate.textContent =
      formatReleaseDate(item.releaseDate);


    link.appendChild(cover);
    link.appendChild(song);
    link.appendChild(artist);
    link.appendChild(releaseDate);

    wrapper.appendChild(link);

    releasesContainer.appendChild(wrapper);

  });
}


/* ====================================
   SONGS.JSON AUTOMATISCH LADEN
==================================== */

async function loadLatestReleases() {

  try {

    const response = await fetch("songs.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("songs.json konnte nicht geladen werden");
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("Ungültiges Format der songs.json");
    }

    renderLatestReleases(data);

  } catch (error) {

    console.error("Latest Releases:", error);

    releasesContainer.replaceChildren();

    const message = document.createElement("div");

    message.className = "release-status";

    message.textContent =
      "Die neuesten Veröffentlichungen konnten nicht geladen werden.";

    releasesContainer.appendChild(message);
  }
}


/* ====================================
   INITIALISIERUNG
==================================== */

loadLatestReleases();

</script>

</body>
</html>
