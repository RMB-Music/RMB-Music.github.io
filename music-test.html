
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R.M.B. | MUSIC TEST</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>
/* =========================
   GRUNDEINSTELLUNGEN
========================= */

:root {
  --background: #101720;
  --card: #1c2530;
  --silver: #b8c8db;
  --line: #304052;
  --blue: #7ec8ff;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--background);
}

body {
  color: #e6edf7;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

button,
input {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid #89d1ff;
  outline-offset: 4px;
}

/* =========================
   MUSIC MIT SKYLINE
========================= */

.music-hero {
  position: relative;
  overflow: hidden;
  padding: 0 0 24px;
  background: var(--background);
  text-align: center;
}

.music-hero::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 100%;
  height: 520px;
  pointer-events: none;

  background: radial-gradient(
    ellipse,
    rgba(56,94,135,0.16) 0%,
    rgba(30,52,75,0.07) 45%,
    transparent 75%
  );
}

.music-composition {
  position: relative;
  width: 100%;
  height: clamp(190px, 21vw, 280px);
  isolation: isolate;
}

/* Skyline über volle Breite.
   Etwas tiefer als vorher. */

.skyline {
  position: absolute;
  left: 0;
  bottom: -58px;
  z-index: 0;

  display: block;
  width: 100%;
  height: auto;

  opacity: 0.28;
  filter: brightness(0) invert(1);

  pointer-events: none;
}

/* MUSIC bleibt groß und dominant */

.music-heading {
  position: absolute;
  left: 50%;
  top: clamp(14px, 1.8vw, 28px);
  transform: translateX(-50%);
  z-index: 2;

  display: block;
  width: min(720px, 92%);
  max-width: 720px;
  height: auto;

  mix-blend-mode: screen;
  filter: drop-shadow(
    0 0 10px rgba(95,165,255,0.18)
  );

  pointer-events: none;
}

/* =========================
   DJ GESAMTAUFBAU
========================= */

.dj-setup {
  position: relative;
  z-index: 5;

  width: min(1180px, 96%);
  margin: 6px auto 0;

  display: grid;
  grid-template-columns:
    minmax(0, 1.08fr)
    minmax(0, 1.7fr)
    minmax(0, 1.08fr);

  gap: 10px;
  align-items: stretch;
}

/* =========================
   ECHTE BAUSYS-TEM TURNTABLES
========================= */

.turntable {
  position: relative;
  width: 100%;
  min-width: 0;
  aspect-ratio: 1.29;
  overflow: hidden;

  border: 1px solid #66707c;
  border-radius: 6px;

  background: #d8d9db;

  box-shadow:
    0 8px 20px rgba(0,0,0,0.48),
    0 0 12px rgba(155,183,213,0.09);
}

/* Originalbild nutzt den gesamten
   Turntable-Bereich. */

.turntable-image {
  display: block;
  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  transform: scale(1.035);
}

/* Die Bilder sind dekorativ,
   die Tonarme nicht anklickbar. */

.turntable::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.08),
    transparent 38%,
    rgba(0,0,0,0.05)
  );
}

/* =========================
   REALISTISCHES MISCHPULT
========================= */

.mixer {
  position: relative;
  min-width: 0;
  width: 100%;
  aspect-ratio: 2.02;

  padding: 10px 12px 9px;

  border: 1px solid #708299;
  border-radius: 7px;
  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.12),
      transparent 30%
    ),
    linear-gradient(
      170deg,
      #35485a,
      #222f3f 38%,
      #111923 100%
    );

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.25),
    inset 0 -3px 6px rgba(0,0,0,0.5),
    0 8px 20px rgba(0,0,0,0.48),
    0 0 12px rgba(80,142,199,0.12);
}

.mixer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;

  height: 17px;
  padding-bottom: 4px;

  color: #bfcedd;
  font-family: "Michroma", Arial, sans-serif;
  font-size: clamp(5px, 0.6vw, 8px);
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.power-indicator {
  display: flex;
  align-items: center;
  gap: 5px;
}

.power-led {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;

  background: #82d2ff;
  box-shadow: 0 0 7px #6bc5ff;
}

/* Bedienfeld */

.mixer-panel {
  display: grid;
  grid-template-columns:
    minmax(0, 0.78fr)
    minmax(0, 3.3fr)
    minmax(0, 0.78fr);

  gap: 8px;

  height: calc(100% - 65px);
  margin-top: 4px;
}

/* EQ links und rechts */

.eq-panel {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  min-width: 0;

  padding: 5px;

  border: 1px solid #405265;
  border-radius: 4px;

  background: rgba(6,13,20,0.23);
}

.eq-title {
  color: #abc1d5;
  font-family: "Michroma", sans-serif;
  font-size: 7px;
}

.eq-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.eq-knob {
  display: block;
  flex-shrink: 0;
  width: 19px;
  height: 19px;
  border-radius: 50%;

  border: 2px solid #8d9fb0;

  background: conic-gradient(
    #263c51,
    #e2eaf1,
    #687f94,
    #c0ccd8,
    #263c51
  );

  box-shadow:
    0 2px 3px rgba(0,0,0,0.5),
    inset 0 1px 2px #ffffffaa;

  position: relative;
}

.eq-knob::after {
  content: "";
  position: absolute;
  left: calc(50% - 1px);
  top: 1px;

  width: 2px;
  height: 6px;

  background: #172432;
  border-radius: 2px;
}

.eq-name {
  color: #acbed0;
  font-family: "Michroma", sans-serif;
  font-size: clamp(5px, 0.56vw, 7px);
}

/* Mittelbereich mit 5 Fadern */

.mixer-center {
  display: grid;
  grid-template-columns:
    10px
    minmax(0, 1fr)
    10px;

  gap: 4px;
  min-width: 0;
}

.vu-meter {
  display: flex;
  flex-direction: column-reverse;
  gap: 2px;

  padding: 4px 1px;

  background: #080e14;
  border: 1px solid #405063;
  border-radius: 3px;
}

.vu-led {
  display: block;
  width: 100%;
  flex: 1;
  min-height: 2px;

  border-radius: 1px;
  background: #14241f;
  opacity: 0.28;
}

.vu-led.green {
  --lit: #3dec83;
}

.vu-led.yellow {
  --lit: #efdb54;
}

.vu-led.red {
  --lit: #ff6a60;
}

.vu-led.on {
  background: var(--lit);
  opacity: 1;
  box-shadow: 0 0 4px var(--lit);
}

.mixer-channels {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;

  min-width: 0;
}

.mixer-channel {
  position: relative;
  min-width: 0;

  border: 1px solid #3c4e61;
  border-radius: 3px;

  background: linear-gradient(
    90deg,
    #192532,
    #304356 50%,
    #182532
  );
}

.fader-track {
  position: absolute;
  inset: 5px 2px;
}

.fader-track::before {
  content: "";
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);

  width: 6px;
  border-radius: 4px;

  background: #060b11;

  box-shadow:
    inset 1px 0 2px #000,
    1px 0 1px #8192a522;
}

/* Die Fader sind echte Navigation */

.fader-handle {
  position: absolute;
  top: 57%;
  left: 50%;

  transform:
    translate(-50%, calc(-1 * var(--drag, 0px)));

  width: calc(100% - 1px);
  min-width: 0;
  height: 35px;

  padding: 0 1px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;

  border: 1px solid #ecf3fa;
  border-bottom-color: #71869a;
  border-radius: 3px;

  background: linear-gradient(
    180deg,
    #f2f6fa,
    #b5c3d1 22%,
    #dce6ef 46%,
    #7c93a8 54%,
    #a9bbcd 82%,
    #71879b
  );

  color: #152433;
  font-family: "Michroma", Arial, sans-serif;

  font-size: clamp(4.5px, 0.55vw, 7px);
  font-weight: bold;
  letter-spacing: -0.3px;

  cursor: grab;
  touch-action: none;

  user-select: none;
  -webkit-user-select: none;

  box-shadow:
    0 3px 5px rgba(0,0,0,0.65),
    inset 0 1px 1px #fff;
}

.fader-handle::after {
  content: "";
  display: block;
  width: 70%;
  height: 3px;

  border-top: 1px solid #3c5265;
  border-bottom: 1px solid #f0f5fa;
  background: #7890a5;
}

.fader-handle.dragging {
  cursor: grabbing;
}

.fader-handle.returning {
  transition: transform 0.2s ease-out;
}

.fader-handle[aria-current="page"] {
  border-color: #85c4ff;
  box-shadow:
    0 3px 5px #000,
    0 0 8px rgba(105,177,255,0.45);
}

/* =========================
   CROSSFADER / SINGLE - LP
========================= */

.crossfader-section {
  position: relative;
  width: min(80%, 410px);
  margin: 7px auto 0;
}

.crossfader-labels {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 5px;

  font-family: "Michroma", sans-serif;
  font-size: 8px;
  letter-spacing: 1px;

  color: #9cb2c7;
}

.crossfader-labels .active {
  color: #a8dcff;
  text-shadow: 0 0 8px #559cd9;
}

.crossfader-slider {
  position: relative;
  display: block;

  width: 100%;
  height: 20px;
  margin: 0;

  appearance: none;
  -webkit-appearance: none;

  background: transparent;
  cursor: ew-resize;
  touch-action: pan-y;
}

/* Crossfader-Schiene */

.crossfader-slider::-webkit-slider-runnable-track {
  height: 7px;
  border-radius: 5px;
  border: 1px solid #51677b;

  background: linear-gradient(
    #05080d,
    #111923
  );

  box-shadow:
    inset 0 1px 3px #000,
    0 1px 1px #7a8ca0;
}

.crossfader-slider::-moz-range-track {
  height: 7px;
  border-radius: 5px;
  border: 1px solid #51677b;
  background: #090f17;
}

/* Crossfader-Schieber */

.crossfader-slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;

  width: 38px;
  height: 18px;
  margin-top: -7px;

  border: 1px solid #e5edf4;
  border-radius: 3px;

  background: linear-gradient(
    #eff4f8,
    #aebfd0 48%,
    #71879d
  );

  box-shadow:
    0 3px 5px #000,
    inset 0 1px 1px #fff;
}

.crossfader-slider::-moz-range-thumb {
  width: 38px;
  height: 18px;
  border: 1px solid #e5edf4;
  border-radius: 3px;
  background: linear-gradient(#eff4f8, #71879d);
  box-shadow: 0 3px 5px #000;
}

.crossfader-title {
  display: block;
  margin-top: 0;

  color: #7f9ab1;
  font-family: "Michroma", sans-serif;
  font-size: 7px;
  letter-spacing: 1px;
  text-align: center;
}

/* =========================
   MUSIKRICHTUNGEN
========================= */

.music-style {
  position: relative;
  z-index: 4;

  margin: 16px auto 0;

  color: #adc0d6;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* =========================
   CONTENT / SONGS
========================= */

.content {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;

  padding: 38px 24px 90px;

  background: var(--background);
  text-align: center;
}

.section-heading {
  margin: 0 0 14px;

  font-family: "Michroma", Arial, sans-serif;
  font-size: clamp(19px, 2.4vw, 27px);
  font-weight: normal;
  letter-spacing: 2px;
}

.section-subtitle {
  margin: 0 0 35px;
  color: #91a7be;
  font-size: 13px;
  letter-spacing: 1px;
}

.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;

  gap: 24px;
  text-align: center;
}

.music-card {
  width: min(220px, 100%);
  min-width: 180px;
  padding: 12px;

  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;

  transition: transform 0.2s;
}

.music-card:hover {
  transform: translateY(-4px);
}

.cover-button {
  display: block;
  width: 100%;
  padding: 0;
  background: transparent;
  border: 0;
  cursor: pointer;
}

.cover-button:disabled {
  cursor: default;
}

.cover {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;

  background: #090d13;
  border-radius: 7px;
}

.track-title {
  margin: 14px 0 5px;
  font-size: 14px;
  font-weight: bold;
  line-height: 1.5;
}

.track-version {
  margin-bottom: 8px;
  color: #9bafc5;
  font-size: 12px;
}

.track-date {
  margin-bottom: 10px;
  color: #8197ae;
  font-size: 11px;
}

.music-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;

  gap: 7px;
  margin-top: 12px;
}

.music-links a {
  padding: 8px 10px;
  background: #293d53;
  border-radius: 6px;

  color: #d6e9fc;
  text-decoration: none;
  font-size: 11px;
}

.music-links a:hover {
  background: #405c78;
}

.empty-message {
  width: min(420px, 100%);
  padding: 38px 18px;

  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;

  color: #aebfd2;
}

.more-button {
  margin-top: 35px;
  padding: 13px 22px;

  background: #263c52;
  border: 1px solid #6587aa;
  border-radius: 7px;

  color: white;
  font-family: "Michroma", Arial, sans-serif;
  font-size: 10px;
  cursor: pointer;
}

.more-button[hidden] {
  display: none;
}

/* =========================
   YOUTUBE-VIDEO
========================= */

.video-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;

  padding: 25px;
  background: rgba(0,0,0,0.94);

  align-items: center;
  justify-content: center;
}

.video-modal.open {
  display: flex;
}

.video-window {
  position: relative;
  width: min(900px, 100%);
}

.video-frame {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  background: black;
}

.close-video {
  position: absolute;
  right: 0;
  top: -48px;

  background: none;
  border: 0;

  color: white;
  font-size: 34px;
  cursor: pointer;
}

/* =========================
   FOOTER
========================= */

footer {
  padding: 30px 15px 35px;

  background: var(--background);
  color: #7d91a7;

  text-align: center;
  font-size: 12px;
}

/* =========================
   TABLET
========================= */

@media (max-width: 1080px) {

  .dj-setup {
    width: 98%;
    gap: 7px;
  }

  .mixer {
    padding: 7px 8px 6px;
  }

  .mixer-panel {
    gap: 5px;
    height: calc(100% - 59px);
  }

  .eq-knob {
    width: 16px;
    height: 16px;
  }

  .mixer-channels {
    gap: 3px;
  }

  .fader-handle {
    height: 30px;
    font-size: 5px;
  }

  .crossfader-section {
    margin-top: 5px;
  }

}

/* =========================
   SMARTPHONE
========================= */

@media (max-width: 700px) {

  .music-composition {
    height: 178px;
  }

  .music-heading {
    top: 18px;
    width: 94%;
  }

  .skyline {
    bottom: -30px;
    opacity: 0.24;
  }

  /* Auf Handys:
     Mixer oben, beide Decks darunter */

  .dj-setup {
    width: min(470px, 96%);

    margin-top: 5px;

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 10px;
    align-items: start;
  }

  .mixer {
    grid-column: 1 / -1;
    grid-row: 1;

    aspect-ratio: 2.02;
    padding: 10px;
  }

  .turntable.single {
    grid-column: 1;
    grid-row: 2;
  }

  .turntable.album {
    grid-column: 2;
    grid-row: 2;
  }

  .mixer-panel {
    height: calc(100% - 62px);
  }

  .mixer-header {
    font-size: 8px;
  }

  .eq-knob {
    width: 18px;
    height: 18px;
  }

  .eq-name {
    font-size: 7px;
  }

  .fader-handle {
    font-size: clamp(6px, 1.5vw, 8px);
    height: 35px;
  }

  .crossfader-labels {
    font-size: 9px;
  }

  .music-style {
    margin-top: 15px;
    font-size: 9px;
    letter-spacing: 1px;
  }

  .content {
    padding: 35px 12px 65px;
  }

  .gallery {
    gap: 12px;
  }

  .music-card {
    width: calc(50% - 6px);
    min-width: 150px;
    padding: 9px;
  }

  .track-title {
    font-size: 12px;
  }

}

@media (max-width: 420px) {

  .mixer-header {
    font-size: 6px;
  }

  .mixer-panel {
    gap: 4px;
  }

  .eq-row {
    gap: 3px;
  }

  .eq-knob {
    width: 14px;
    height: 14px;
  }

  .eq-name {
    font-size: 5px;
  }

  .fader-handle {
    height: 27px;
    font-size: 5px;
  }

  .crossfader-section {
    width: 85%;
  }

  .music-card {
    width: 100%;
  }

}

@media (prefers-reduced-motion: reduce) {

  .fader-handle {
    transition: none !important;
  }

}
</style>
</head>

<body>

<!-- =========================
     MUSIC + FRANKFURT
========================= -->

<section class="music-hero">

  <div class="music-composition">

    <img
      class="skyline"
      src="images/frankfurt-skyline.png"
      alt=""
    >

    <img
      class="music-heading"
      src="images/music-schriftzug.png"
      alt="MUSIC – THE SOUND OF R.M.B."
    >

  </div>

  <!-- =========================
       DJ SETUP
  ========================= -->

  <div class="dj-setup">

    <!-- LINKER BAUSYS-TEM -->

    <div class="turntable single">

      <img
        class="turntable-image"
        src="images/turntable-bausys-tem.png"
        alt="Bausys-tem Turntable links"
      >

    </div>

    <!-- MISCHPULT -->

    <div class="mixer">

      <div class="mixer-header">

        <span>R.M.B. · 5 CHANNEL DJ MIXER</span>

        <span class="power-indicator">
          <span class="power-led"></span>
          POWER
        </span>

      </div>

      <div class="mixer-panel">

        <!-- EQ LINKS -->

        <div class="eq-panel">

          <span class="eq-title">CH A</span>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">GAIN</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">HIGH</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">MID</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">BASS</span>
          </div>

        </div>

        <!-- FADER + VU METER -->

        <div class="mixer-center">

          <div
            class="vu-meter"
            id="vuLeft"
            aria-hidden="true"
          ></div>

          <nav
            class="mixer-channels"
            aria-label="DJ-Mischpult Navigation"
          >

            <div class="mixer-channel">
              <div class="fader-track">
                <button
                  type="button"
                  class="fader-handle"
                  data-url="index.html"
                  aria-label="HOME nach oben schieben"
                >HOME</button>
              </div>
            </div>

            <div class="mixer-channel">
              <div class="fader-track">
                <button
                  type="button"
                  class="fader-handle"
                  data-url="music-test.html"
                  aria-current="page"
                  aria-label="MUSIC nach oben schieben"
                >MUSIC</button>
              </div>
            </div>

            <div class="mixer-channel">
              <div class="fader-track">
                <button
                  type="button"
                  class="fader-handle"
                  data-url="music.html"
                  aria-label="RELEASES nach oben schieben"
                >RELEASES</button>
              </div>
            </div>

            <div class="mixer-channel">
              <div class="fader-track">
                <button
                  type="button"
                  class="fader-handle"
                  data-url="about.html"
                  aria-label="ABOUT nach oben schieben"
                >ABOUT</button>
              </div>
            </div>

            <div class="mixer-channel">
              <div class="fader-track">
                <button
                  type="button"
                  class="fader-handle"
                  data-url="contact.html"
                  aria-label="CONTACT nach oben schieben"
                >CONTACT</button>
              </div>
            </div>

          </nav>

          <div
            class="vu-meter"
            id="vuRight"
            aria-hidden="true"
          ></div>

        </div>

        <!-- EQ RECHTS -->

        <div class="eq-panel">

          <span class="eq-title">CH B</span>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">GAIN</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">HIGH</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">MID</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">BASS</span>
          </div>

        </div>

      </div>

      <!-- CROSSFADER -->

      <div class="crossfader-section">

        <div class="crossfader-labels">

          <span id="singleLabel" class="active">
            SINGLE
          </span>

          <span id="albumLabel">
            LP
          </span>

        </div>

        <input
          type="range"
          class="crossfader-slider"
          id="crossfader"
          min="0"
          max="100"
          step="1"
          value="0"
          aria-label="Crossfader: links Singles, rechts Alben"
        >

        <span class="crossfader-title">
          CROSSFADER
        </span>

      </div>

    </div>

    <!-- RECHTER BAUSYS-TEM -->

    <div class="turntable album">

      <img
        class="turntable-image"
        src="images/turntable-bausys-tem.png"
        alt="Bausys-tem Turntable rechts"
      >

    </div>

  </div>

  <p class="music-style">
    90s Eurodance · EDM · Trance
  </p>

</section>

<!-- =========================
     SINGLES / ALBUMS
========================= -->

<main class="content">

  <h1
    class="section-heading"
    id="sectionTitle"
  >
    SINGLES
  </h1>

  <p
    class="section-subtitle"
    id="sectionSubtitle"
  >
    The Singles Collection
  </p>

  <div class="gallery" id="gallery">

    <div class="empty-message">
      Musik wird geladen ...
    </div>

  </div>

  <button
    type="button"
    id="moreButton"
    class="more-button"
    hidden
  >
    WEITERE SONGS ANZEIGEN
  </button>

</main>

<footer>
  © R.M.B. MUSIC · FRANKFURT AM MAIN
</footer>

<!-- =========================
     VIDEOFENSTER
========================= -->

<div class="video-modal" id="videoModal">

  <div class="video-window">

    <button
      type="button"
      class="close-video"
      id="closeVideo"
      aria-label="Video schließen"
    >&times;</button>

    <iframe
      id="videoFrame"
      class="video-frame"
      title="R.M.B. Musikvideo"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen
    ></iframe>

  </div>

</div>

<script>

/* =========================
   MISCHPULT NAVIGATION
========================= */

document
  .querySelectorAll(".fader-handle")
  .forEach(handle => {

    let startY = null;
    let pointerId = null;
    let distance = 0;

    function getTravel() {

      const track = handle.parentElement;

      const availableAbove =
        handle.offsetTop - 8;

      return Math.max(
        10,
        Math.min(
          availableAbove,
          track.clientHeight * 0.65
        )
      );
    }

    function reset() {

      startY = null;
      pointerId = null;
      distance = 0;

      handle.classList.remove("dragging");
      handle.classList.add("returning");

      handle.style.setProperty(
        "--drag",
        "0px"
      );
    }

    handle.addEventListener(
      "pointerdown",
      event => {

        if (
          event.pointerType === "mouse" &&
          event.button !== 0
        ) {
          return;
        }

        event.preventDefault();

        startY = event.clientY;
        pointerId = event.pointerId;
        distance = 0;

        handle.classList.remove("returning");
        handle.classList.add("dragging");

        handle.setPointerCapture(
          event.pointerId
        );
      }
    );

    handle.addEventListener(
      "pointermove",
      event => {

        if (
          startY === null ||
          pointerId !== event.pointerId
        ) {
          return;
        }

        const travel = getTravel();

        distance = Math.min(
          travel,
          Math.max(
            0,
            startY - event.clientY
          )
        );

        handle.style.setProperty(
          "--drag",
          distance + "px"
        );
      }
    );

    handle.addEventListener(
      "pointerup",
      event => {

        if (
          startY === null ||
          pointerId !== event.pointerId
        ) {
          return;
        }

        const reached =
          distance >= getTravel() * 0.85;

        reset();

        if (reached) {
          window.location.assign(
            handle.dataset.url
          );
        }
      }
    );

    handle.addEventListener(
      "pointercancel",
      reset
    );

    handle.addEventListener(
      "lostpointercapture",
      () => {

        if (startY !== null) {
          reset();
        }
      }
    );

    handle.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "ArrowUp" ||
          event.key === "Enter"
        ) {
          event.preventDefault();

          window.location.assign(
            handle.dataset.url
          );
        }
      }
    );

  });

/* =========================
   VU-METER
========================= */

function createMeter(id) {

  const meter =
    document.getElementById(id);

  for (let i = 0; i < 14; i++) {

    const led =
      document.createElement("span");

    led.className = "vu-led";

    if (i < 8) {
      led.classList.add("green");
    } else if (i < 11) {
      led.classList.add("yellow");
    } else {
      led.classList.add("red");
    }

    meter.appendChild(led);
  }

  return Array.from(meter.children);
}

const leftLEDs =
  createMeter("vuLeft");

const rightLEDs =
  createMeter("vuRight");

function updateMeter(leds, level) {

  leds.forEach((led, index) => {
    led.classList.toggle(
      "on",
      index < level
    );
  });
}

let leftLevel = 6;
let rightLevel = 7;

function animateMeters() {

  if (document.hidden) {
    return;
  }

  leftLevel = Math.max(
    2,
    Math.min(
      14,
      leftLevel +
      Math.floor(Math.random() * 7) - 3
    )
  );

  rightLevel = Math.max(
    2,
    Math.min(
      14,
      rightLevel +
      Math.floor(Math.random() * 7) - 3
    )
  );

  updateMeter(leftLEDs, leftLevel);
  updateMeter(rightLEDs, rightLevel);
}

animateMeters();

if (
  !window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches
) {
  setInterval(animateMeters, 170);
}

/* =========================
   CROSSFADER
========================= */

const crossfader =
  document.getElementById("crossfader");

const singleLabel =
  document.getElementById("singleLabel");

const albumLabel =
  document.getElementById("albumLabel");

let activeCategory = "single";
let allMusic = [];
let visibleCount = 10;

function chooseCategory(category) {

  if (category === activeCategory) {
    return;
  }

  activeCategory = category;
  visibleCount = 10;

  const isSingle =
    category === "single";

  singleLabel.classList.toggle(
    "active",
    isSingle
  );

  albumLabel.classList.toggle(
    "active",
    !isSingle
  );

  renderMusic();
}

/* Links SINGLE, rechts LP */

crossfader.addEventListener(
  "input",
  () => {

    const position =
      Number(crossfader.value);

    if (position < 50) {
      chooseCategory("single");
    } else {
      chooseCategory("album");
    }
  }
);

/* Beim Loslassen an einem
   Ende einrasten. */

crossfader.addEventListener(
  "change",
  () => {

    const position =
      Number(crossfader.value);

    const isSingle =
      position < 50;

    crossfader.value =
      isSingle ? "0" : "100";

    chooseCategory(
      isSingle ? "single" : "album"
    );
  }
);

/* =========================
   GALERIE / DATEN
========================= */

const gallery =
  document.getElementById("gallery");

const sectionTitle =
  document.getElementById("sectionTitle");

const sectionSubtitle =
  document.getElementById("sectionSubtitle");

const moreButton =
  document.getElementById("moreButton");

const videoModal =
  document.getElementById("videoModal");

const videoFrame =
  document.getElementById("videoFrame");

const closeVideo =
  document.getElementById("closeVideo");

/* TEXT ABSICHERN */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* LINKS PRÜFEN */

function safeURL(value) {

  try {

    const url = new URL(
      value,
      window.location.href
    );

    if (
      url.protocol === "https:" ||
      url.protocol === "http:"
    ) {
      return url.href;
    }

  } catch {}

  return "";
}

/* DATUM */

function formatDate(value) {

  if (!value) {
    return "";
  }

  const date = new Date(
    String(value).slice(0,10) +
    "T12:00:00"
  );

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleDateString(
    "de-DE",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );
}

/* SINGLE ODER ALBUM */

function categoryOf(item) {

  const category = String(
    item.type ||
    item.category ||
    "single"
  ).toLowerCase();

  return [
    "album",
    "albums",
    "lp"
  ].includes(category)
    ? "album"
    : "single";
}

/* YOUTUBE ID */

function getYoutubeId(item) {

  const value =
    String(item.youtube || "").trim();

  if (
    /^[A-Za-z0-9_-]{11}$/.test(value)
  ) {
    return value;
  }

  try {

    const url = new URL(value);

    const hostname =
      url.hostname.toLowerCase();

    if (
      hostname === "youtu.be" ||
      hostname === "www.youtu.be"
    ) {
      return url.pathname.split("/")[1] || "";
    }

    if (
      hostname === "youtube.com" ||
      hostname === "www.youtube.com" ||
      hostname === "m.youtube.com"
    ) {

      if (url.pathname === "/watch") {
        return url.searchParams.get("v") || "";
      }

      const parts =
        url.pathname.split("/");

      if (
        ["shorts", "embed", "live"]
          .includes(parts[1])
      ) {
        return parts[2] || "";
      }

    }

  } catch {}

  return "";
}

/* VIDEO ÖFFNEN */

function openVideo(videoId) {

  if (
    !/^[A-Za-z0-9_-]{11}$/.test(videoId)
  ) {
    return;
  }

  videoFrame.src =
    "https://www.youtube-nocookie.com/embed/" +
    videoId +
    "?autoplay=1";

  videoModal.classList.add("open");
}

/* VIDEO SCHLIESSEN */

function closeVideoPlayer() {

  videoModal.classList.remove("open");
  videoFrame.src = "";
}

closeVideo.addEventListener(
  "click",
  closeVideoPlayer
);

videoModal.addEventListener(
  "click",
  event => {

    if (event.target === videoModal) {
      closeVideoPlayer();
    }
  }
);

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "Escape") {
      closeVideoPlayer();
    }
  }
);

/* GALERIE ANZEIGEN */

function renderMusic() {

  const isSingle =
    activeCategory === "single";

  sectionTitle.textContent =
    isSingle ? "SINGLES" : "ALBUMS";

  sectionSubtitle.textContent =
    isSingle
      ? "The Singles Collection"
      : "The Album Collection";

  const items = allMusic
    .filter(item =>
      categoryOf(item) === activeCategory
    )
    .sort((a,b) =>
      String(b.releaseDate || "")
        .localeCompare(
          String(a.releaseDate || "")
        )
    );

  gallery.innerHTML = "";

  if (items.length === 0) {

    gallery.innerHTML = `
      <div class="empty-message">
        ${
          isSingle
            ? "Hier erscheinen deine R.M.B.-Singles."
            : "Hier erscheinen deine R.M.B.-Alben."
        }
      </div>
    `;

    moreButton.hidden = true;
    return;
  }

  items
    .slice(0, visibleCount)
    .forEach(item => {

      const videoId =
        getYoutubeId(item);

      const validVideoId =
        /^[A-Za-z0-9_-]{11}$/.test(videoId)
          ? videoId
          : "";

      const cover =
        safeURL(item.cover) ||
        (
          validVideoId
            ? "https://img.youtube.com/vi/" +
              validVideoId +
              "/hqdefault.jpg"
            : ""
        );

      const spotify =
        safeURL(item.spotify);

      const amazon =
        safeURL(item.amazon);

      const date =
        formatDate(item.releaseDate);

      const card =
        document.createElement("article");

      card.className = "music-card";

      card.innerHTML = `

        <button
          type="button"
          class="cover-button"
          ${validVideoId ? "" : "disabled"}
          aria-label="Video öffnen"
        >
          <img
            class="cover"
            src="${escapeHTML(cover)}"
            alt="${escapeHTML(item.title || "R.M.B.")}"
            loading="lazy"
          >
        </button>

        <div class="track-title">
          ${escapeHTML(item.title || "R.M.B.")}
        </div>

        <div class="track-version">
          ${escapeHTML(item.version || "")}
        </div>

        ${
          date
            ? `<div class="track-date">
                 ${escapeHTML(date)}
               </div>`
            : ""
        }

        <div class="music-links">

          ${
            validVideoId
              ? `<a
                   href="https://www.youtube.com/watch?v=${validVideoId}"
                   target="_blank"
                   rel="noopener noreferrer"
                 >YouTube</a>`
              : ""
          }

          ${
            spotify
              ? `<a
                   href="${escapeHTML(spotify)}"
                   target="_blank"
                   rel="noopener noreferrer"
                 >Spotify</a>`
              : ""
          }

          ${
            amazon
              ? `<a
                   href="${escapeHTML(amazon)}"
                   target="_blank"
                   rel="noopener noreferrer"
                 >Amazon</a>`
              : ""
          }

        </div>
      `;

      if (validVideoId) {

        card
          .querySelector(".cover-button")
          .addEventListener(
            "click",
            () => openVideo(validVideoId)
          );
      }

      gallery.appendChild(card);
    });

  moreButton.hidden =
    items.length <= visibleCount;

  moreButton.textContent =
    isSingle
      ? "WEITERE SONGS ANZEIGEN"
      : "WEITERE ALBEN ANZEIGEN";
}

/* WEITERE TITEL */

moreButton.addEventListener(
  "click",
  () => {

    visibleCount += 10;
    renderMusic();
  }
);

/* SONGS.JSON LADEN */

fetch("songs.json")

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "songs.json nicht gefunden"
      );
    }

    return response.json();
  })

  .then(data => {

    allMusic =
      Array.isArray(data)
        ? data
        : [];

    renderMusic();
  })

  .catch(error => {

    gallery.innerHTML = `
      <div class="empty-message">
        Die Musikdaten konnten
        nicht geladen werden.
      </div>
    `;

    console.error(error);
  });

</script>

</body>
</html>
