
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R.M.B. | MUSIC TEST</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#101720;
  --blue:#8ad2ff;
  --silver:#cbd7e3;
  --line:#465e76;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:#e7edf5;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button:focus-visible,
input:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:3px;
}

/* ==============================
   MUSIC / FRANKFURTER SKYLINE
============================== */

.music-hero{
  position:relative;
  text-align:center;
  background:var(--bg);
  overflow:hidden;
}

.music-composition{
  position:relative;
  height:clamp(190px,21vw,280px);
  isolation:isolate;
}

.skyline{
  position:absolute;
  left:0;
  bottom:-68px;
  z-index:0;
  display:block;
  width:100%;
  height:auto;
  opacity:.28;
  filter:brightness(0) invert(1);
  pointer-events:none;
}

.music-heading{
  position:absolute;
  top:clamp(14px,1.8vw,28px);
  left:50%;
  z-index:2;
  width:min(720px,92%);
  height:auto;
  transform:translateX(-50%);
  mix-blend-mode:screen;
  filter:drop-shadow(
    0 0 10px rgba(95,165,255,.18)
  );
  pointer-events:none;
}

/* ==============================
   KOMPLETTE DJ-ANLAGE
============================== */

.dj-setup{
  --device-height:260px;

  position:relative;
  z-index:5;

  width:min(1360px,98%);
  margin:6px auto 0;

  display:grid;
  grid-template-columns:
    minmax(0,330px)
    minmax(0,1fr)
    minmax(0,330px);

  gap:10px;
  align-items:stretch;
}

.genre-line{
  position:absolute;
  top:-32px;
  left:50%;
  z-index:8;

  width:max-content;
  max-width:100%;
  margin:0;

  transform:translateX(-50%);
  white-space:nowrap;

  color:#b9d3ee;

  font-family:Michroma,Arial,sans-serif;
  font-size:clamp(7px,.8vw,11px);
  letter-spacing:1.4px;

  text-shadow:
    0 0 8px rgba(126,200,255,.24);

  pointer-events:none;
}

.turntable,
.mixer{
  position:relative;
  width:100%;
  min-width:0;
  height:var(--device-height);
  overflow:hidden;

  border-radius:6px;
  box-shadow:
    0 8px 20px rgba(0,0,0,.45);
}

/* ==============================
   PLATTENSPIELER
============================== */

.turntable{
  border:1px solid #667b91;
  background:#cbd5df;
  isolation:isolate;
}

.turntable-image{
  display:block;
  width:100%;
  height:100%;
  object-fit:fill;
}

/*
  Die Vinylplatte liegt innerhalb
  des jeweiligen Plattenspielers.

  Position und Größe sind relativ
  zum Plattenspielerbild definiert.

  Dadurch wandert die Platte
  bei Größenänderungen mit.
*/

.vinyl-position{
  position:absolute;

  left:38.4%;
  top:46.4%;

  width:61%;
  height:77%;

  transform:translate(-50%,-50%);

  z-index:2;
  pointer-events:none;

  opacity:0;
  visibility:hidden;

  transition:
    opacity .35s ease,
    visibility .35s ease;
}

.turntable.playing .vinyl-position{
  opacity:1;
  visibility:visible;
}

.vinyl-record{
  display:block;

  width:100%;
  height:100%;

  object-fit:fill;
  border-radius:50%;

  transform-origin:50% 50%;

  filter:drop-shadow(
    1px 2px 3px rgba(0,0,0,.6)
  );

  animation:
    vinylRotation 2.4s linear infinite;

  animation-play-state:paused;
}

.turntable.playing .vinyl-record{
  animation-play-state:running;
}

@keyframes vinylRotation{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}

/* ==============================
   MISCHPULT-GEHÄUSE
============================== */

.mixer{
  padding:9px 12px 7px;
  border:1px solid #708299;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.12),
      transparent 30%
    ),
    linear-gradient(
      170deg,
      #35485a,
      #222f3f 38%,
      #111923
    );

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.25),
    inset 0 -3px 6px rgba(0,0,0,.5),
    0 8px 20px rgba(0,0,0,.45);
}

.mixer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;

  height:19px;
  margin-bottom:5px;

  color:#bfcedd;

  font-family:Michroma,Arial,sans-serif;
  font-size:8px;
  white-space:nowrap;
}

.power-indicator{
  display:inline-flex;
  align-items:center;
  gap:5px;
}

.power-led{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;

  background:#82d2ff;
  box-shadow:0 0 8px #6bc5ff;
}

/* ==============================
   MISCHPULT-INNENBEREICH
============================== */

.mixer-panel{
  display:grid;

  grid-template-columns:
    minmax(0,112px)
    minmax(0,1fr)
    minmax(0,112px);

  gap:9px;

  min-width:0;
  height:calc(100% - 88px);
}

/* ==============================
   ZWEI VERSETZTE DREHREGLER-
   REIHEN PRO SEITE
============================== */

.eq-panel{
  min-width:0;

  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);

  gap:4px;

  padding:5px 4px;

  border:1px solid #405265;
  border-radius:4px;

  background:rgba(6,13,20,.23);
}

.eq-column{
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  align-items:center;
  gap:2px;
  min-width:0;
}

.eq-column.offset{
  padding-top:19px;
  padding-bottom:4px;
}

.eq-unit{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;

  min-height:35px;
  width:100%;
}

.eq-knob{
  position:relative;
  display:block;
  flex-shrink:0;

  width:18px;
  height:18px;

  border:2px solid #8d9fb0;
  border-radius:50%;

  background:conic-gradient(
    #263c51,
    #e2eaf1,
    #687f94,
    #c0ccd8,
    #263c51
  );

  box-shadow:
    0 2px 3px rgba(0,0,0,.5),
    inset 0 1px 2px rgba(255,255,255,.7);
}

.eq-knob::after{
  content:"";

  position:absolute;
  left:calc(50% - 1px);
  top:0;

  width:2px;
  height:6px;

  background:#172432;
}

.eq-label{
  display:block;
  color:#b8cadd;

  font-family:Michroma,Arial,sans-serif;
  font-size:6px;
  line-height:1.2;

  text-align:center;
  white-space:nowrap;
}

/* ==============================
   MITTELTEIL / VU-METER
============================== */

.mixer-center{
  display:grid;

  grid-template-columns:
    11px minmax(0,1fr) 11px;

  gap:5px;
  min-width:0;
  min-height:0;
}

.vu-meter{
  display:flex;
  flex-direction:column-reverse;
  gap:2px;

  padding:4px 1px;

  border:1px solid #405063;
  border-radius:3px;
  background:#080e14;
}

.vu-led{
  flex:1;
  min-height:2px;
  border-radius:1px;

  background:#14241f;
  opacity:.28;
}

.vu-led.green{
  --lit:#3dec83;
}

.vu-led.yellow{
  --lit:#efdb54;
}

.vu-led.red{
  --lit:#ff6a60;
}

.vu-led.on{
  background:var(--lit);
  opacity:1;
  box-shadow:0 0 4px var(--lit);
}

/* ==============================
   FÜNF SCHMALE FADER
============================== */

.mixer-channels{
  display:grid;

  grid-template-columns:
    repeat(5,minmax(0,1fr));

  gap:6px;
  min-width:0;
  min-height:0;

  padding:0 4px;
}

.mixer-channel{
  position:relative;

  min-width:0;
  min-height:0;

  border:1px solid #3c4e61;
  border-radius:3px;

  background:linear-gradient(
    90deg,
    #192532,
    #304356 50%,
    #182532
  );
}

.fader-track{
  position:absolute;

  top:4px;
  right:2px;
  bottom:4px;
  left:2px;

  min-height:0;
}

.fader-track::before{
  content:"";

  position:absolute;
  top:0;
  bottom:0;
  left:50%;

  width:5px;

  transform:translateX(-50%);

  border-radius:4px;
  background:#060b11;

  box-shadow:
    inset 0 0 2px #000,
    0 0 1px #93a7b8;
}

/*
  Schmaler Griff:
  26px breit,
  48px hoch.

  Bei 174px Schienenhöhe bleiben
  126px Weg = 2,625 Griffhöhen.
*/

.fader-handle{
  position:absolute;

  top:0;
  left:50%;

  width:min(26px,calc(100% - 2px));
  height:48px;

  transform:translateX(-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:2px 0;

  border:1px solid #e9f3fc;
  border-radius:4px;

  background:linear-gradient(
    90deg,
    #8199ad 0%,
    #e6f1f8 18%,
    #c7d8e6 48%,
    #8fa6b9 85%,
    #dce8f2 100%
  );

  box-shadow:
    0 4px 6px rgba(0,0,0,.65),
    inset 0 1px 1px #fff;

  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;

  z-index:2;
}

.fader-handle.dragging{
  cursor:grabbing;
  z-index:5;
}

.fader-handle.returning{
  transition:top .23s ease-out;
}

/* Senkrecht, Buchstabe für Buchstabe */

.fader-name{
  position:relative;
  z-index:3;

  display:block;

  writing-mode:vertical-rl;
  text-orientation:upright;

  font-family:Michroma,Arial,sans-serif;
  font-size:5px;
  font-weight:bold;

  letter-spacing:-1.5px;
  line-height:1;

  white-space:nowrap;
  color:#21384b;

  pointer-events:none;
}

/* Metallrillen im Hintergrund */

.fader-handle::before{
  content:"";

  position:absolute;
  inset:4px 3px;

  border-radius:2px;

  background:repeating-linear-gradient(
    to bottom,
    transparent 0 5px,
    rgba(61,89,112,.28) 5px 6px,
    rgba(255,255,255,.28) 6px 8px
  );

  pointer-events:none;
}

.fader-handle[aria-current="page"]{
  border-color:#a2dbff;

  box-shadow:
    0 4px 6px rgba(0,0,0,.7),
    0 0 7px rgba(100,180,255,.4),
    inset 0 1px 1px #fff;
}

/* ==============================
   SINGLE / SLIDE ME / ALBUM
   EXAKT EINE HORIZONTALE ZEILE
============================== */

.crossfader-section{
  position:absolute;

  left:50%;
  bottom:6px;

  width:min(80%,460px);

  transform:translateX(-50%);
}

.crossfader-labels{
  display:grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items:center;

  min-height:17px;
  margin-bottom:4px;

  font-family:Michroma,Arial,sans-serif;
  font-size:8px;
  letter-spacing:1px;
  line-height:1;

  color:#9cb2c7;
}

#singleLabel{
  justify-self:start;
}

#albumLabel{
  justify-self:end;
}

.crossfader-labels .active{
  color:#e2f6ff;

  text-shadow:
    0 0 3px #fff,
    0 0 7px #82d2ff,
    0 0 14px #6bc5ff;
}

.slide-me{
  justify-self:center;

  color:#c9eaff;

  font-family:Michroma,Arial,sans-serif;
  font-size:7px;

  letter-spacing:1px;
  white-space:nowrap;

  text-shadow:
    0 0 4px #fff,
    0 0 8px #82d2ff;

  animation:
    slidePulse 2s ease-in-out infinite;
}

@keyframes slidePulse{
  0%,100%{
    opacity:.5;
    text-shadow:0 0 3px #82d2ff;
  }

  50%{
    opacity:1;

    text-shadow:
      0 0 3px #fff,
      0 0 9px #82d2ff,
      0 0 18px #6bc5ff;
  }
}

/* ==============================
   CROSSFADER
============================== */

.crossfader-slider{
  display:block;
  width:100%;
  height:20px;
  margin:0;

  appearance:none;
  -webkit-appearance:none;

  background:transparent;
  cursor:ew-resize;
  touch-action:pan-y;
}

.crossfader-slider::-webkit-slider-runnable-track{
  height:7px;

  border:1px solid #51677b;
  border-radius:5px;

  background:#090f17;

  box-shadow:
    inset 0 1px 3px #000,
    0 1px 1px #7a8ca0;
}

.crossfader-slider::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:38px;
  height:18px;
  margin-top:-7px;

  border:1px solid #e5edf4;
  border-radius:3px;

  background:linear-gradient(
    #eff4f8,
    #aebfd0 48%,
    #71879d
  );

  box-shadow:
    0 3px 5px #000,
    inset 0 1px 1px #fff;
}

.crossfader-slider::-moz-range-track{
  height:7px;
  border-radius:5px;
  background:#090f17;
}

.crossfader-slider::-moz-range-thumb{
  width:38px;
  height:18px;

  border:1px solid #e5edf4;
  border-radius:3px;

  background:#aebfd0;
}

.crossfader-title{
  display:block;

  font-family:Michroma,Arial,sans-serif;
  font-size:7px;
  letter-spacing:1px;

  color:#7f9ab1;
  text-align:center;
}

/* ==============================
   LED-LAUFLEISTE
============================== */

.led-display-wrap{
  position:relative;
  z-index:6;

  width:min(1360px,98%);
  margin:12px auto 0;
}

.led-display{
  width:100%;
  padding:8px 12px;

  overflow:hidden;

  border:1px solid rgba(170,210,250,.55);
  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      rgba(215,235,255,.12),
      rgba(40,65,95,.1)
    ),
    #142231;

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.24),
    inset 0 -1px 2px rgba(0,0,0,.45),
    0 0 15px rgba(110,185,255,.14);
}

.led-canvas{
  display:block;

  width:100%;
  height:80px;

  border:1px solid #344e69;
  border-radius:7px;

  background:#07111b;
}

/* ==============================
   MUSIKCOVER
============================== */

.content{
  max-width:1400px;
  margin:0 auto;

  padding:14px 24px 75px;

  background:var(--bg);
  text-align:center;
}

.gallery{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:24px;
}

.music-card{
  width:min(220px,100%);
  min-width:180px;

  padding:12px;

  background:#1c2530;
  border:1px solid #304052;
  border-radius:12px;

  transition:transform .2s;
}

.music-card:hover{
  transform:translateY(-4px);
}

.cover-button{
  display:block;
  width:100%;
  padding:0;

  border:0;
  background:none;

  cursor:pointer;
}

.cover-button:disabled{
  cursor:default;
}

.cover{
  display:block;

  width:100%;
  aspect-ratio:1;

  object-fit:cover;

  background:#090d13;
  border-radius:7px;
}

.track-title{
  margin:14px 0 5px;

  font-size:14px;
  font-weight:bold;
  line-height:1.5;
}

.track-version{
  margin-bottom:8px;

  color:#9bafc5;
  font-size:12px;
}

.track-date{
  margin-bottom:10px;

  color:#8197ae;
  font-size:11px;
}

.music-links{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;

  margin-top:12px;
}

.music-links a{
  padding:8px 10px;

  background:#293d53;
  border-radius:6px;

  color:#d6e9fc;
  text-decoration:none;
  font-size:11px;
}

.music-links a:hover{
  background:#405c78;
}

.empty-message{
  width:min(420px,100%);

  padding:38px 18px;

  background:#1c2530;
  border:1px solid #304052;
  border-radius:12px;

  color:#aebfd2;
}

.more-button{
  margin-top:35px;
  padding:13px 22px;

  background:#263c52;
  border:1px solid #6587aa;
  border-radius:7px;

  color:#fff;

  font-family:Michroma,Arial,sans-serif;
  font-size:10px;

  cursor:pointer;
}

.more-button[hidden]{
  display:none;
}

/* ==============================
   YOUTUBE-VIDEOFENSTER
============================== */

.video-modal{
  display:none;

  position:fixed;
  inset:0;
  z-index:1000;

  padding:25px;

  background:rgba(0,0,0,.94);

  align-items:center;
  justify-content:center;
}

.video-modal.open{
  display:flex;
}

.video-window{
  position:relative;
  width:min(900px,100%);
}

.video-frame{
  width:100%;
  aspect-ratio:16/9;

  border:0;
  background:black;
}

.close-video{
  position:absolute;
  top:-48px;
  right:0;

  border:0;
  background:none;

  color:white;
  font-size:34px;
  cursor:pointer;
}

footer{
  padding:30px 15px 35px;

  background:var(--bg);
  color:#7d91a7;

  text-align:center;
  font-size:12px;
}

/* ==============================
   RESPONSIVES TABLET-LAYOUT
============================== */

@media(max-width:1120px){

  .dj-setup{
    --device-height:
      clamp(195px,23.2vw,260px);

    grid-template-columns:
      minmax(0,25%)
      minmax(0,1fr)
      minmax(0,25%);

    gap:7px;
  }

  .mixer{
    padding:7px 8px;
  }

  .mixer-panel{
    grid-template-columns:
      minmax(0,82px)
      minmax(0,1fr)
      minmax(0,82px);

    gap:5px;
    height:calc(100% - 82px);
  }

  .eq-panel{
    gap:1px;
    padding:3px 2px;
  }

  .eq-knob{
    width:15px;
    height:15px;
  }

  .eq-label{
    font-size:5px;
  }

  .eq-unit{
    min-height:30px;
    gap:2px;
  }

  .mixer-channels{
    gap:3px;
    padding:0 2px;
  }

  .fader-handle{
    width:min(22px,calc(100% - 1px));
    height:42px;
  }

  .fader-name{
    font-size:4.7px;
    letter-spacing:-1.5px;
  }

  .crossfader-labels{
    font-size:7px;
  }

  .slide-me{
    font-size:6px;
  }
}

/* ==============================
   SMARTPHONE
============================== */

@media(max-width:700px){

  .music-composition{
    height:178px;
  }

  .music-heading{
    top:18px;
    width:94%;
  }

  .skyline{
    bottom:-30px;
    opacity:.24;
  }

  .dj-setup{
    --device-height:170px;

    width:min(470px,96%);

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:10px;
  }

  .genre-line{
    top:-27px;
    font-size:clamp(5px,1.3vw,8px);
    letter-spacing:.45px;
  }

  .mixer{
    grid-column:1/-1;
    grid-row:1;

    height:270px;
    padding:9px;
  }

  .turntable.single{
    grid-column:1;
    grid-row:2;
  }

  .turntable.album{
    grid-column:2;
    grid-row:2;
  }

  .mixer-panel{
    grid-template-columns:
      minmax(0,90px)
      minmax(0,1fr)
      minmax(0,90px);

    gap:5px;
    height:calc(100% - 88px);
  }

  .eq-knob{
    width:17px;
    height:17px;
  }

  .eq-label{
    font-size:5.5px;
  }

  .eq-unit{
    min-height:33px;
  }

  .mixer-channels{
    gap:4px;
  }

  .fader-handle{
    width:min(25px,calc(100% - 2px));
    height:47px;
  }

  .fader-name{
    font-size:5px;
  }

  .led-display-wrap{
    width:min(470px,96%);
  }

  .led-canvas{
    height:65px;
  }

  .content{
    padding:12px 12px 65px;
  }

  .gallery{
    gap:12px;
  }

  .music-card{
    width:calc(50% - 6px);
    min-width:150px;
    padding:9px;
  }
}

@media(max-width:420px){

  .mixer-header{
    font-size:6px;
  }

  .mixer-panel{
    grid-template-columns:
      64px minmax(0,1fr) 64px;
    gap:3px;
  }

  .eq-knob{
    width:14px;
    height:14px;
  }

<script>

/* ===========================
   EINSTELLUNGEN
=========================== */

const reduceMotion =
  window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

/* ===========================
   FÜNF NAVIGATIONSFADER
=========================== */

const faders = Array.from(
  document.querySelectorAll(
    '.fader-handle'
  )
);

const activeFader =
  document.querySelector(
    '.fader-handle[aria-current="page"]'
  );

let dragging = null;
let navigationStarted = false;

/* Begrenzung */

function clamp(value,min,max){
  return Math.min(
    max,
    Math.max(min,value)
  );
}

/* Tatsächlicher Schiebeweg */

function maxTravel(handle){

  const track =
    handle.parentElement;

  return Math.max(
    0,
    track.clientHeight -
    handle.offsetHeight
  );
}

/*
  progress = 0:
  Regler vollständig unten.

  progress = 1:
  Regler vollständig oben.
*/

function setFaderPosition(
  handle,
  progress
){

  const distance =
    maxTravel(handle);

  handle.style.top =
    (
      distance *
      (
        1-clamp(progress,0,1)
      )
    )+'px';
}

/* Startpositionen */

function initializeFaders(){

  if(dragging){
    return;
  }

  faders.forEach(handle=>{

    handle.classList.remove(
      'returning'
    );

    setFaderPosition(
      handle,
      handle===activeFader
        ? 1
        : 0
    );

  });
}

/* Rückfahrt bei frühem Loslassen */

function restoreFaders(){

  faders.forEach(handle=>{
    handle.classList.add(
      'returning'
    );
  });

  faders.forEach(handle=>{

    setFaderPosition(
      handle,
      handle===activeFader
        ? 1
        : 0
    );

  });
}

/* Navigation erst am Anschlag */

function finishNavigation(handle){

  if(
    navigationStarted ||
    handle===activeFader
  ){
    return;
  }

  navigationStarted=true;

  setFaderPosition(handle,1);

  setFaderPosition(
    activeFader,
    0
  );

  window.location.assign(
    handle.dataset.url
  );
}

/* Synchronisierte Bewegung */

function moveFader(event){

  if(
    !dragging ||
    dragging.pointerId!==
      event.pointerId
  ){
    return;
  }

  const handle =
    dragging.handle;

  const travel =
    maxTravel(handle);

  if(travel<=0){
    return;
  }

  const delta =
    event.clientY -
    dragging.startY;

  let progress;

  if(handle===activeFader){

    progress=clamp(
      1-delta/travel,
      0,
      1
    );

  }else{

    progress=clamp(
      -delta/travel,
      0,
      1
    );
  }

  setFaderPosition(
    handle,
    progress
  );

  /*
    Wenn ein anderer Regler
    hochgeschoben wird,
    fährt MUSIC synchron runter.
  */

  if(handle!==activeFader){

    setFaderPosition(
      activeFader,
      1-progress
    );

    /*
      Nur bei 100 Prozent,
      nie bei 85 oder 90.
    */

    if(progress>=1){
      finishNavigation(handle);
    }
  }
}

/* Loslassen */

function releaseFader(event){

  if(
    !dragging ||
    dragging.pointerId!==
      event.pointerId
  ){
    return;
  }

  const handle =
    dragging.handle;

  dragging=null;

  handle.classList.remove(
    'dragging'
  );

  if(!navigationStarted){
    restoreFaders();
  }
}

/* Bedienung anbringen */

faders.forEach(handle=>{

  handle.addEventListener(
    'pointerdown',
    event=>{

      if(
        navigationStarted ||
        dragging
      ){
        return;
      }

      if(
        event.pointerType==='mouse' &&
        event.button!==0
      ){
        return;
      }

      event.preventDefault();

      faders.forEach(h=>{
        h.classList.remove(
          'returning'
        );
      });

      dragging={
        handle,
        pointerId:event.pointerId,
        startY:event.clientY
      };

      handle.classList.add(
        'dragging'
      );

      handle.setPointerCapture(
        event.pointerId
      );
    }
  );

  handle.addEventListener(
    'pointermove',
    moveFader
  );

  handle.addEventListener(
    'pointerup',
    releaseFader
  );

  handle.addEventListener(
    'pointercancel',
    releaseFader
  );

  handle.addEventListener(
    'lostpointercapture',
    ()=>{
      if(
        dragging &&
        dragging.handle===handle
      ){

        dragging=null;

        handle.classList.remove(
          'dragging'
        );

        if(!navigationStarted){
          restoreFaders();
        }
      }
    }
  );

  /* Tastaturbedienung */

  handle.addEventListener(
    'keydown',
    event=>{

      if(
        handle!==activeFader &&
        (
          event.key==='Enter' ||
          event.key==='ArrowUp'
        )
      ){

        event.preventDefault();

        finishNavigation(handle);
      }
    }
  );

});

requestAnimationFrame(
  initializeFaders
);

window.addEventListener(
  'load',
  initializeFaders
);

window.addEventListener(
  'resize',
  initializeFaders
);

/* ===========================
   ANIMIERTE VU-METER
=========================== */

function createMeter(id){

  const meter =
    document.getElementById(id);

  return Array.from(
    {length:14},
    (_,i)=>{

      const led =
        document.createElement('span');

      led.className =
        'vu-led '+
        (
          i<8
            ? 'green'
            : i<11
              ? 'yellow'
              : 'red'
        );

      meter.appendChild(led);

      return led;
    }
  );
}

const leftLeds =
  createMeter('vuLeft');

const rightLeds =
  createMeter('vuRight');

let leftLevel=6;
let rightLevel=7;

function animateMeters(){

  if(document.hidden){
    return;
  }

  leftLevel=clamp(
    leftLevel+
    Math.floor(Math.random()*7)-3,
    2,
    14
  );

  rightLevel=clamp(
    rightLevel+
    Math.floor(Math.random()*7)-3,
    2,
    14
  );

  leftLeds.forEach((led,i)=>{
    led.classList.toggle(
      'on',
      i<leftLevel
    );
  });

  rightLeds.forEach((led,i)=>{
    led.classList.toggle(
      'on',
      i<rightLevel
    );
  });
}

animateMeters();

if(!reduceMotion){
  setInterval(
    animateMeters,
    170
  );
}

/* ===========================
   SINGLE / ALBUM
   UND DREHENDE VINYLS
=========================== */

const crossfader =
  document.getElementById(
    'crossfader'
  );

const singleLabel =
  document.getElementById(
    'singleLabel'
  );

const albumLabel =
  document.getElementById(
    'albumLabel'
  );

const singleTurntable =
  document.getElementById(
    'singleTurntable'
  );

const albumTurntable =
  document.getElementById(
    'albumTurntable'
  );

let activeCategory='single';

let allMusic=[];

let visibleCount=10;

/*
  Hier werden Kategorie,
  Vinyl und LED-Anzeige
  gemeinsam geschaltet.
*/

function chooseCategory(category){

  if(category===activeCategory){
    return;
  }

  activeCategory=category;

  visibleCount=10;

  /* Leuchtende Beschriftung */

  singleLabel.classList.toggle(
    'active',
    category==='single'
  );

  albumLabel.classList.toggle(
    'active',
    category==='album'
  );

  /* Drehende Schallplatten */

  singleTurntable.classList.toggle(
    'playing',
    category==='single'
  );

  albumTurntable.classList.toggle(
    'playing',
    category==='album'
  );

  /* LED-Laufschrift */

  updateLEDMessage(category);

  /* Passende Musikkategorie */

  renderMusic();
}

/* Beim Schieben umschalten */

crossfader.addEventListener(
  'input',
  ()=>{

    chooseCategory(
      Number(crossfader.value)<50
        ? 'single'
        : 'album'
    );

  }
);

/* Beim Loslassen einrasten */

crossfader.addEventListener(
  'change',
  ()=>{

    const isSingle =
      Number(crossfader.value)<50;

    crossfader.value =
      isSingle
        ? '0'
        : '100';

    chooseCategory(
      isSingle
        ? 'single'
        : 'album'
    );

  }
);

/* ===========================
   LED-PUNKTMATRIX
=========================== */

const ledCanvas =
  document.getElementById(
    'ledCanvas'
  );

const ctx =
  ledCanvas.getContext('2d');

/*
  Eigene Buchstaben aus
  echten LED-Punkten.
*/

const FONT={

  A:[
    '01110','10001','10001',
    '11111','10001','10001','10001'
  ],

  B:[
    '11110','10001','10001',
    '11110','10001','10001','11110'
  ],

  C:[
    '01111','10000','10000',
    '10000','10000','10000','01111'
  ],

  D:[
    '11110','10001','10001',
    '10001','10001','10001','11110'
  ],

  E:[
    '11111','10000','10000',
    '11110','10000','10000','11111'
  ],

  G:[
    '01111','10000','10000',
    '10111','10001','10001','01111'
  ],

  H:[
    '10001','10001','10001',
    '11111','10001','10001','10001'
  ],

  I:[
    '11111','00100','00100',
    '00100','00100','00100','11111'
  ],

  L:[
    '10000','10000','10000',
    '10000','10000','10000','11111'
  ],

  M:[
    '10001','11011','10101',
    '10101','10001','10001','10001'
  ],

  N:[
    '10001','11001','10101',
    '10011','10001','10001','10001'
  ],

  O:[
    '01110','10001','10001',
    '10001','10001','10001','01110'
  ],

  P:[
    '11110','10001','10001',
    '11110','10000','10000','10000'
  ],

  R:[
    '11110','10001','10001',
    '11110','10100','10010','10001'
  ],

  S:[
    '01111','10000','10000',
    '01110','00001','00001','11110'
  ],

  T:[
    '11111','00100','00100',
    '00100','00100','00100','00100'
  ],

  U:[
    '10001','10001','10001',
    '10001','10001','10001','01110'
  ],

  Y:[
    '10001','10001','01010',
    '00100','00100','00100','00100'
  ],

  ' ':Array(7).fill('00000'),

  '·':[
    '00000','00000','00100',
    '00000','00100','00000','00000'
  ]
};

let ledColumns=[];

let ledPosition=0;

let ledDirection=1;

let ledLastTime=0;

let ledPitch=8;

let ledTextWidth=0;

let ledStartColumn=0;

const LED_SPEED=80;

/* Text in einzelne LED-Spalten */

function buildLEDText(text){

  const cols=[];

  for(
    const ch of text.toUpperCase()
  ){

    const pattern =
      FONT[ch]||FONT[' '];

    for(let c=0;c<5;c++){

      cols.push(
        Array.from(
          {length:7},
          (_,row)=>
            pattern[row][c]==='1'
        )
      );
    }

    /* Abstand zwischen Zeichen */

    cols.push(
      Array(7).fill(false)
    );
  }

  return cols;
}

/* Automatische LED-Größe */

function calculateLEDLayout(){

  const width =
    ledCanvas.clientWidth;

  const height =
    ledCanvas.clientHeight;

  ledPitch=Math.min(
    9.4,
    (height-16)/7,
    Math.max(1,(width-24)*.75)/
      Math.max(1,ledColumns.length)
  );

  ledTextWidth =
    ledPitch*ledColumns.length;

  ledPosition=clamp(
    ledPosition,
    0,
    Math.max(
      0,
      width-24-ledTextWidth
    )
  );
}

/* SINGLE-/ALBUM-Laufschrift */

function updateLEDMessage(category){

  const message =
    category==='single'
      ? 'SINGLE · THE SINGLE COLLECTION'
      : 'ALBUM · THE ALBUM COLLECTION';

  ledCanvas.setAttribute(
    'aria-label',
    message
  );

  ledColumns =
    buildLEDText(message);

  ledPosition=0;
  ledDirection=1;

  calculateLEDLayout();
}

/* Canvas an Pixelgröße anpassen */

function resizeLEDCanvas(){

  const rect =
    ledCanvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio||1;

  ledCanvas.width =
    Math.round(rect.width*dpr);

  ledCanvas.height =
    Math.round(rect.height*dpr);

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  calculateLEDLayout();
}

/* Eine einzelne LED */

function drawDot(
  x,y,r,color,glow=false
){

  ctx.beginPath();

  ctx.arc(
    x,y,r,
    0,
    Math.PI*2
  );

  ctx.fillStyle=color;

  if(glow){

    ctx.shadowBlur =
      Math.max(3,ledPitch*1.1);

    ctx.shadowColor='#65bdff';
  }

  ctx.fill();

  ctx.shadowBlur=0;
}

/* Vollständige Anzeige */

function drawLED(time){

  const width =
    ledCanvas.clientWidth;

  const height =
    ledCanvas.clientHeight;

  ctx.clearRect(
    0,0,width,height
  );

  ctx.fillStyle='#07111b';

  ctx.fillRect(
    0,0,width,height
  );

  const padding=12;

  const startY =
    (height-7*ledPitch)/2;

  const radius =
    Math.max(.35,ledPitch*.29);

  const columnsVisible =
    Math.floor(
      (width-2*padding)/ledPitch
    );

  /*
    Alle nicht leuchtenden
    LED-Punkte darstellen.
  */

  for(
    let c=0;
    c<=columnsVisible;
    c++
  ){

    const x =
      padding+(c+.5)*ledPitch;

    if(x>width-padding){
      break;
    }

    for(let row=0;row<7;row++){

      drawDot(
        x,
        startY+
          (row+.5)*ledPitch,
        radius,
        'rgba(125,165,205,.15)'
      );
    }
  }

  /*
    Aktivierte LED-Punkte:
    Text wird durch Umschalten
    der vorhandenen Punkte
    sichtbar.
  */

  ledStartColumn=Math.round(
    ledPosition/ledPitch
  );

  for(
    let c=0;
    c<ledColumns.length;
    c++
  ){

    const displayColumn =
      ledStartColumn+c;

    if(
      displayColumn<0 ||
      displayColumn>columnsVisible
    ){
      continue;
    }

    const x =
      padding+
      (displayColumn+.5)*ledPitch;

    if(x>width-padding){
      continue;
    }

    for(let row=0;row<7;row++){

      if(ledColumns[c][row]){

        drawDot(
          x,
          startY+
            (row+.5)*ledPitch,
          radius,
          '#d9f2ff',
          true
        );
      }
    }
  }

  /*
    Pendelbewegung von links
    nach rechts und zurück.
  */

  if(
    !reduceMotion &&
    !document.hidden &&
    ledLastTime
  ){

    const delta=Math.min(
      .05,
      (time-ledLastTime)/1000
    );

    const maxPosition =
      Math.max(
        0,
        width-24-ledTextWidth
      );

    ledPosition+=
      LED_SPEED*
      delta*
      ledDirection;

    if(ledPosition>=maxPosition){

      ledPosition=maxPosition;
      ledDirection=-1;
    }

    if(ledPosition<=0){

      ledPosition=0;
      ledDirection=1;
    }
  }

  ledLastTime=time;

  requestAnimationFrame(
    drawLED
  );
}

/* LED starten */

updateLEDMessage('single');

resizeLEDCanvas();

requestAnimationFrame(
  drawLED
);

window.addEventListener(
  'resize',
  resizeLEDCanvas
);

/* ===========================
   SONGS.JSON
=========================== */

const gallery =
  document.getElementById(
    'gallery'
  );

const moreButton =
  document.getElementById(
    'moreButton'
  );

const videoModal =
  document.getElementById(
    'videoModal'
  );

const videoFrame =
  document.getElementById(
    'videoFrame'
  );

const closeVideo =
  document.getElementById(
    'closeVideo'
  );

/* HTML sicher darstellen */

function escapeHTML(value){

  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

/* Gültige Links */

function safeURL(value){

  try{

    const url=new URL(
      value,
      location.href
    );

    return [
      'https:',
      'http:'
    ].includes(url.protocol)
      ? url.href
      : '';

  }catch{

    return '';
  }
}

/* Veröffentlichungsdatum */

function formatDate(value){

  if(!value){
    return '';
  }

  const date=new Date(
    String(value).slice(0,10)+
    'T12:00:00'
  );

  return isNaN(date.getTime())
    ? ''
    : date.toLocaleDateString(
        'de-DE',
        {
          day:'2-digit',
          month:'2-digit',
          year:'numeric'
        }
      );
}

/* Single oder Album */

function categoryOf(item){

  const value=String(
    item.type||
    item.category||
    'single'
  ).toLowerCase();

  return [
    'album',
    'albums',
    'lp'
  ].includes(value)
    ? 'album'
    : 'single';
}

/* YouTube-ID erkennen */

function getYoutubeId(item){

  const value=String(
    item.youtube||''
  ).trim();

  if(
    /^[A-Za-z0-9_-]{11}$/.test(value)
  ){
    return value;
  }

  try{

    const url=new URL(value);

    const host=
      url.hostname.toLowerCase();

    if(
      [
        'youtu.be',
        'www.youtu.be'
      ].includes(host)
    ){

      return (
        url.pathname.split('/')[1]||
        ''
      );
    }

    if(
      [
        'youtube.com',
        'www.youtube.com',
        'm.youtube.com'
      ].includes(host)
    ){

      if(url.pathname==='/watch'){

        return (
          url.searchParams.get('v')||
          ''
        );
      }

      const parts=
        url.pathname.split('/');

      if(
        [
          'shorts',
          'embed',
          'live'
        ].includes(parts[1])
      ){

        return parts[2]||'';
      }
    }

  }catch{}

  return '';
}

/* ===========================
   YOUTUBE-FENSTER
=========================== */

function openVideo(id){

  if(
    !/^[A-Za-z0-9_-]{11}$/.test(id)
  ){
    return;
  }

  videoFrame.src =
    'https://www.youtube-nocookie.com/embed/'+
    id+
    '?autoplay=1';

  videoModal.classList.add(
    'open'
  );
}

function closeVideoPlayer(){

  videoModal.classList.remove(
    'open'
  );

  videoFrame.src='';
}

closeVideo.addEventListener(
  'click',
  closeVideoPlayer
);

videoModal.addEventListener(
  'click',
  event=>{

    if(event.target===videoModal){
      closeVideoPlayer();
    }
  }
);

document.addEventListener(
  'keydown',
  event=>{

    if(event.key==='Escape'){
      closeVideoPlayer();
    }
  }
);

/* ===========================
   MUSIKKARTEN DARSTELLEN
=========================== */

function renderMusic(){

  const isSingle =
    activeCategory==='single';

  const items=allMusic

    .filter(item=>
      categoryOf(item)===
        activeCategory
    )

    .sort((a,b)=>
      String(b.releaseDate||'')
        .localeCompare(
          String(a.releaseDate||'')
        )
    );

  gallery.innerHTML='';

  /* Noch keine Veröffentlichungen */

  if(!items.length){

    gallery.innerHTML=
      '<div class="empty-message">'+
      (
        isSingle
          ? 'Hier erscheinen deine R.M.B.-Singles.'
          : 'Hier erscheinen deine R.M.B.-Alben.'
      )+
      '</div>';

    moreButton.hidden=true;

    return;
  }

  items
    .slice(0,visibleCount)
    .forEach(item=>{

      const id=
        getYoutubeId(item);

      const valid=
        /^[A-Za-z0-9_-]{11}$/.test(id)
          ? id
          : '';

      const cover=
        safeURL(item.cover)||
        (
          valid
            ? 'https://img.youtube.com/vi/'+
              valid+
              '/hqdefault.jpg'
            : ''
        );

      const spotify=
        safeURL(item.spotify);

      const amazon=
        safeURL(item.amazon);

      const date=
        formatDate(item.releaseDate);

      const card=
        document.createElement(
          'article'
        );

      card.className='music-card';

      card.innerHTML=`

        <button
          type="button"
          class="cover-button"
          ${valid?'':'disabled'}
          aria-label="Video öffnen"
        >

          <img
            class="cover"
            src="${escapeHTML(cover)}"
            alt="${escapeHTML(
              item.title||'R.M.B.'
            )}"
            loading="lazy"
          >

        </button>

        <div class="track-title">

          ${escapeHTML(
            item.title||'R.M.B.'
          )}

        </div>

        <div class="track-version">

          ${escapeHTML(
            item.version||''
          )}

        </div>

        ${
          date
            ? `
              <div class="track-date">
                ${escapeHTML(date)}
              </div>
              `
            : ''
        }

        <div class="music-links">

          ${
            valid
              ? `
                <a
                  href="https://www.youtube.com/watch?v=${valid}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  YouTube
                </a>
                `
              : ''
          }

          ${
            spotify
              ? `
                <a
                  href="${escapeHTML(spotify)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Spotify
                </a>
                `
              : ''
          }

          ${
            amazon
              ? `
                <a
                  href="${escapeHTML(amazon)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Amazon
                </a>
                `
              : ''
          }

        </div>
      `;

      if(valid){

        card.querySelector(
          '.cover-button'
        ).addEventListener(
          'click',
          ()=>openVideo(valid)
        );
      }

      gallery.appendChild(card);
    });

  moreButton.hidden=
    items.length<=visibleCount;

  moreButton.textContent=
    isSingle
      ? 'WEITERE SONGS ANZEIGEN'
      : 'WEITERE ALBEN ANZEIGEN';
}

/* Weitere Veröffentlichungen */

moreButton.addEventListener(
  'click',
  ()=>{

    visibleCount+=10;

    renderMusic();
  }
);

/* ===========================
   MUSIKDATEN LADEN
=========================== */

fetch('songs.json')

  .then(response=>{

    if(!response.ok){

      throw new Error(
        'songs.json nicht gefunden'
      );
    }

    return response.json();
  })

  .then(data=>{

    allMusic=
      Array.isArray(data)
        ? data
        : [];

    renderMusic();
  })

  .catch(error=>{

    gallery.innerHTML=
      '<div class="empty-message">'+
      'Die Musikdaten konnten nicht geladen werden.'+
      '</div>';

    console.error(error);
  });

/* ===========================
   ENDE
=========================== */

</script>

</body>
</html>
