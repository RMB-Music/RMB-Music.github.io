
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R.M.B. | MUSIC TEST</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>

/* =========================
   GRUNDEINSTELLUNGEN
========================= */

:root {
  --background: #101720;
  --card: #1c2530;
  --silver: #b8c8db;
  --line: #304052;
  --blue: #7ec8ff;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--background);
}

body {
  color: #e6edf7;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid #89d1ff;
  outline-offset: 3px;
}

/* =========================
   MUSIC UND FRANKFURT
========================= */

.music-hero {
  position: relative;
  overflow: hidden;
  text-align: center;
  padding: 0 0 0;
  background: var(--background);
}

.music-hero::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 100%;
  height: 520px;
  pointer-events: none;

  background: radial-gradient(
    ellipse,
    rgba(56,94,135,0.16),
    rgba(30,52,75,0.07) 45%,
    transparent 75%
  );
}

.music-composition {
  position: relative;
  width: 100%;
  height: clamp(190px,21vw,280px);
  isolation: isolate;
}

/* Skyline bleibt bündig */

.skyline {
  position: absolute;
  left: 0;
  bottom: -68px;
  z-index: 0;

  display: block;
  width: 100%;
  max-width: none;
  height: auto;

  opacity: 0.28;
  filter: brightness(0) invert(1);

  pointer-events: none;
}

/* Großer MUSIC-Schriftzug */

.music-heading {
  position: absolute;
  left: 50%;
  top: clamp(14px,1.8vw,28px);
  transform: translateX(-50%);
  z-index: 2;

  display: block;
  width: min(720px,92%);
  max-width: 720px;
  height: auto;

  mix-blend-mode: screen;

  filter: drop-shadow(
    0 0 10px rgba(95,165,255,0.18)
  );

  pointer-events: none;
}

/* =========================
   DJ-AUFBAU
========================= */

.dj-setup {
  position: relative;
  z-index: 5;

  width: min(1180px,96%);
  margin: 6px auto 0;

  display: grid;

  grid-template-columns:
    minmax(0,1.08fr)
    minmax(0,1.7fr)
    minmax(0,1.08fr);

  gap: 10px;
  align-items: stretch;

  --device-height: 260px;
}

/* Genretext in vorhandener Lücke */

.music-style-top {
  position: absolute;
  z-index: 8;

  left: 50%;
  top: -31px;
  transform: translateX(-50%);

  width: max-content;
  max-width: 96%;

  margin: 0;
  padding: 0;

  color: #b9d3ee;

  font-family: "Michroma",Arial,sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;

  white-space: nowrap;

  text-shadow:
    0 0 8px rgba(126,200,255,0.24);

  pointer-events: none;
}

/* =========================
   BAUSYS-TEM TURNTABLES
========================= */

.turntable {
  position: relative;
  min-width: 0;

  width: 100%;
  height: var(--device-height);

  overflow: hidden;

  border: 1px solid #667b91;
  border-radius: 6px;

  background: #cbd5df;

  box-shadow:
    0 8px 20px rgba(0,0,0,0.45),
    0 0 12px rgba(120,180,255,0.08);
}

.turntable-image {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: fill;
}

/* =========================
   MISCHPULT
========================= */

.mixer {
  position: relative;
  min-width: 0;

  width: 100%;
  height: var(--device-height);

  padding: 10px 12px 9px;

  border: 1px solid #708299;
  border-radius: 7px;

  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.12),
      transparent 30%
    ),
    linear-gradient(
      170deg,
      #35485a,
      #222f3f 38%,
      #111923
    );

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.25),
    inset 0 -3px 6px rgba(0,0,0,0.5),
    0 8px 20px rgba(0,0,0,0.45);
}

/* Mixer-Überschrift */

.mixer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 6px;

  height: 19px;
  margin-bottom: 5px;

  color: #bfcedd;

  font-family: "Michroma",Arial,sans-serif;
  font-size: 8px;
  letter-spacing: 0.3px;

  white-space: nowrap;
}

.power-indicator {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.power-led {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #82d2ff;
  box-shadow: 0 0 7px #6bc5ff;
}

/* Bedienfeld */

.mixer-panel {
  display: grid;

  grid-template-columns:
    minmax(0,0.78fr)
    minmax(0,3.3fr)
    minmax(0,0.78fr);

  gap: 8px;

  height: calc(100% - 77px);
}

/* EQ links und rechts */

.eq-panel {
  display: flex;
  flex-direction: column;
  justify-content: space-around;

  min-width: 0;
  padding: 5px;

  border: 1px solid #405265;
  border-radius: 4px;

  background: rgba(6,13,20,0.23);
}

.eq-title {
  color: #abc1d5;

  font-family: "Michroma",sans-serif;
  font-size: 7px;
}

.eq-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.eq-knob {
  position: relative;
  flex-shrink: 0;

  width: 19px;
  height: 19px;

  border-radius: 50%;
  border: 2px solid #8d9fb0;

  background: conic-gradient(
    #263c51,
    #e2eaf1,
    #687f94,
    #c0ccd8,
    #263c51
  );

  box-shadow:
    0 2px 3px rgba(0,0,0,0.5),
    inset 0 1px 2px #ffffffaa;
}

.eq-knob::after {
  content: "";
  position: absolute;

  left: calc(50% - 1px);
  top: 1px;

  width: 2px;
  height: 6px;

  background: #172432;
  border-radius: 2px;
}

.eq-name {
  color: #acbed0;

  font-family: "Michroma",sans-serif;
  font-size: clamp(5px,0.56vw,7px);
}

/* =========================
   VU-METER UND FADER
========================= */

.mixer-center {
  display: grid;

  grid-template-columns:
    10px
    minmax(0,1fr)
    10px;

  gap: 4px;
  min-width: 0;
}

.vu-meter {
  display: flex;
  flex-direction: column-reverse;
  gap: 2px;

  padding: 4px 1px;

  background: #080e14;

  border: 1px solid #405063;
  border-radius: 3px;
}

.vu-led {
  width: 100%;
  flex: 1;
  min-height: 2px;

  border-radius: 1px;

  background: #14241f;
  opacity: 0.28;
}

.vu-led.green {
  --lit: #3dec83;
}

.vu-led.yellow {
  --lit: #efdb54;
}

.vu-led.red {
  --lit: #ff6a60;
}

.vu-led.on {
  background: var(--lit);
  opacity: 1;

  box-shadow: 0 0 4px var(--lit);
}

/* Fünf Menükanäle */

.mixer-channels {
  display: grid;

  grid-template-columns:
    repeat(5,minmax(0,1fr));

  gap: 5px;
  min-width: 0;
}

.mixer-channel {
  position: relative;
  min-width: 0;

  border: 1px solid #3c4e61;
  border-radius: 3px;

  background: linear-gradient(
    90deg,
    #192532,
    #304356 50%,
    #182532
  );
}

.fader-track {
  position: absolute;
  inset: 5px 2px;
}

.fader-track::before {
  content: "";
  position: absolute;

  top: 4px;
  bottom: 4px;
  left: 50%;

  transform: translateX(-50%);

  width: 6px;

  border-radius: 4px;
  background: #060b11;
}

/* Echte Menüfader */

.fader-handle {
  position: absolute;

  top: 57%;
  left: 50%;

  transform:
    translate(-50%,calc(-1 * var(--drag,0px)));

  width: calc(100% - 1px);
  min-width: 0;
  height: 35px;

  padding: 0 1px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 3px;

  border: 1px solid #ecf3fa;
  border-radius: 3px;

  background: linear-gradient(
    180deg,
    #f2f6fa,
    #b5c3d1 22%,
    #dce6ef 46%,
    #7c93a8 54%,
    #a9bbcd 82%,
    #71879b
  );

  color: #152433;

  font-family: "Michroma",Arial,sans-serif;
  font-size: clamp(4.5px,0.55vw,7px);
  font-weight: bold;
  letter-spacing: -0.3px;

  cursor: grab;
  touch-action: none;

  user-select: none;
  -webkit-user-select: none;

  box-shadow:
    0 3px 5px rgba(0,0,0,0.65),
    inset 0 1px 1px #fff;
}

.fader-handle::after {
  content: "";

  display: block;
  width: 70%;
  height: 3px;

  background: #7890a5;
}

.fader-handle.dragging {
  cursor: grabbing;
}

.fader-handle.returning {
  transition: transform 0.2s ease-out;
}

.fader-handle[aria-current="page"] {
  border-color: #85c4ff;

  box-shadow:
    0 3px 5px #000,
    0 0 8px rgba(105,177,255,0.45);
}

/* =========================
   CROSSFADER
========================= */

.crossfader-section {
  position: relative;

  width: min(80%,410px);
  margin: 6px auto 0;
}

.crossfader-labels {
  display: flex;
  justify-content: space-between;

  margin-bottom: 5px;

  color: #9cb2c7;

  font-family: "Michroma",sans-serif;
  font-size: 8px;
  letter-spacing: 1px;
}

.crossfader-labels .active {
  color: #a8dcff;
  text-shadow: 0 0 8px #559cd9;
}

.crossfader-slider {
  display: block;

  width: 100%;
  height: 20px;
  margin: 0;

  appearance: none;
  -webkit-appearance: none;

  background: transparent;

  cursor: ew-resize;
  touch-action: pan-y;
}

/* Crossfader-Schiene */

.crossfader-slider::-webkit-slider-runnable-track {
  height: 7px;

  border-radius: 5px;
  border: 1px solid #51677b;

  background: #090f17;

  box-shadow:
    inset 0 1px 3px #000,
    0 1px 1px #7a8ca0;
}

/* Crossfader-Schieber */

.crossfader-slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;

  width: 38px;
  height: 18px;
  margin-top: -7px;

  border: 1px solid #e5edf4;
  border-radius: 3px;

  background: linear-gradient(
    #eff4f8,
    #aebfd0 48%,
    #71879d
  );

  box-shadow:
    0 3px 5px #000,
    inset 0 1px 1px #fff;
}

.crossfader-slider::-moz-range-track {
  height: 7px;
  border-radius: 5px;
  background: #090f17;
}

.crossfader-slider::-moz-range-thumb {
  width: 38px;
  height: 18px;

  border-radius: 3px;
  border: 1px solid #e5edf4;

  background: #aebfd0;
}

.crossfader-title {
  display: block;
  margin-top: 0;

  color: #7f9ab1;

  font-family: "Michroma",sans-serif;
  font-size: 7px;
  letter-spacing: 1px;

  text-align: center;
}

/* =========================
   SILBER-BLAUE LED-LEISTE
========================= */

.led-display-wrap {
  position: relative;
  z-index: 6;

  width: min(1180px,96%);
  margin: 12px auto 0;
}

.led-display {
  position: relative;

  width: 100%;
  padding: 8px 12px;

  overflow: hidden;

  border: 1px solid rgba(170,210,250,0.55);
  border-radius: 10px;

  background:
    linear-gradient(
      180deg,
      rgba(215,235,255,0.12),
      rgba(40,65,95,0.10)
    ),
    #142231;

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.24),
    inset 0 -1px 2px rgba(0,0,0,0.45),
    0 0 15px rgba(110,185,255,0.14);
}

.led-display::before {
  content: "";
  position: absolute;
  inset: 0;

  pointer-events: none;
  border-radius: inherit;

  background: linear-gradient(
    90deg,
    rgba(170,210,255,0.06),
    transparent 28%,
    rgba(180,220,255,0.08) 50%,
    transparent 72%,
    rgba(170,210,255,0.06)
  );
}

.led-canvas {
  position: relative;
  display: block;

  width: 100%;
  height: 80px;

  border: 1px solid #344e69;
  border-radius: 7px;

  background: #07111b;
}

/* =========================
   MUSIKCOVER DIREKT UNTER LED
========================= */

/* Nur ein kleiner Abstand:
   keine Überschrift,
   kein zusätzlicher Untertitel */

.content {
  width: 100%;
  max-width: 1400px;

  margin: 0 auto;

  padding: 14px 24px 75px;

  background: var(--background);
  text-align: center;
}

/* Cover-Galerie */

.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;

  gap: 24px;
  text-align: center;
}

.music-card {
  width: min(220px,100%);
  min-width: 180px;

  padding: 12px;

  background: var(--card);

  border: 1px solid var(--line);
  border-radius: 12px;

  transition: transform 0.2s;
}

.music-card:hover {
  transform: translateY(-4px);
}

.cover-button {
  display: block;

  width: 100%;
  padding: 0;

  background: transparent;
  border: 0;

  cursor: pointer;
}

.cover-button:disabled {
  cursor: default;
}

.cover {
  display: block;

  width: 100%;
  aspect-ratio: 1;

  object-fit: cover;

  background: #090d13;
  border-radius: 7px;
}

.track-title {
  margin: 14px 0 5px;

  font-size: 14px;
  font-weight: bold;
  line-height: 1.5;
}

.track-version {
  margin-bottom: 8px;

  color: #9bafc5;
  font-size: 12px;
}

.track-date {
  margin-bottom: 10px;

  color: #8197ae;
  font-size: 11px;
}

.music-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;

  gap: 7px;
  margin-top: 12px;
}

.music-links a {
  padding: 8px 10px;

  background: #293d53;
  border-radius: 6px;

  color: #d6e9fc;
  text-decoration: none;
  font-size: 11px;
}

.music-links a:hover {
  background: #405c78;
}

.empty-message {
  width: min(420px,100%);

  padding: 38px 18px;

  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;

  color: #aebfd2;
}

.more-button {
  margin-top: 35px;

  padding: 13px 22px;

  background: #263c52;
  border: 1px solid #6587aa;
  border-radius: 7px;

  color: white;

  font-family: "Michroma",Arial,sans-serif;
  font-size: 10px;

  cursor: pointer;
}

.more-button[hidden] {
  display: none;
}

/* =========================
   YOUTUBE-VIDEO
========================= */

.video-modal {
  display: none;

  position: fixed;
  inset: 0;
  z-index: 1000;

  padding: 25px;

  background: rgba(0,0,0,0.94);

  align-items: center;
  justify-content: center;
}

.video-modal.open {
  display: flex;
}

.video-window {
  position: relative;
  width: min(900px,100%);
}

.video-frame {
  width: 100%;
  aspect-ratio: 16 / 9;

  border: 0;
  background: black;
}

.close-video {
  position: absolute;
  right: 0;
  top: -48px;

  background: none;
  border: 0;

  color: white;
  font-size: 34px;

  cursor: pointer;
}

/* =========================
   FUSSZEILE
========================= */

footer {
  padding: 30px 15px 35px;

  background: var(--background);
  color: #7d91a7;

  text-align: center;
  font-size: 12px;
}

/* =========================
   TABLET
========================= */

@media (max-width:1080px) {

  .dj-setup {
    width: 98%;
    gap: 7px;

    --device-height:
      clamp(180px,21.5vw,250px);
  }

  .mixer {
    padding: 7px 8px 6px;
  }

  .mixer-panel {
    gap: 5px;
    height: calc(100% - 65px);
  }

  .eq-knob {
    width: 16px;
    height: 16px;
  }

  .mixer-channels {
    gap: 3px;
  }

  .fader-handle {
    height: 30px;
    font-size: 5px;
  }

  .led-display-wrap {
    width: 98%;
  }

}

/* =========================
   SMARTPHONE
========================= */

@media (max-width:700px) {

  .music-composition {
    height: 178px;
  }

  .music-heading {
    top: 18px;
    width: 94%;
  }

  .skyline {
    bottom: -30px;
    opacity: 0.24;
  }

  .dj-setup {
    width: min(470px,96%);

    margin-top: 5px;

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap: 10px;
    align-items: stretch;

    --device-height: 170px;
  }

  .music-style-top {
    top: -24px;

    font-size: 8px;
    letter-spacing: 1px;
  }

  .mixer {
    grid-column: 1 / -1;
    grid-row: 1;

    height: 230px;
    padding: 10px;
  }

  .turntable.single {
    grid-column: 1;
    grid-row: 2;
  }

  .turntable.album {
    grid-column: 2;
    grid-row: 2;
  }

  .mixer-panel {
    height: calc(100% - 65px);
  }

  .mixer-header {
    font-size: 8px;
  }

  .eq-knob {
    width: 18px;
    height: 18px;
  }

  .eq-name {
    font-size: 7px;
  }

  .fader-handle {
    font-size: clamp(6px,1.5vw,8px);
    height: 35px;
  }

  .crossfader-labels {
    font-size: 9px;
  }

  .led-display-wrap {
    width: min(470px,96%);
  }

  .led-canvas {
    height: 65px;
  }

  .content {
    padding: 12px 12px 65px;
  }

  .gallery {
    gap: 12px;
  }

  .music-card {
    width: calc(50% - 6px);
    min-width: 150px;

    padding: 9px;
  }

  .track-title {
    font-size: 12px;
  }

}

@media (max-width:420px) {

  .mixer-header {
    font-size: 6px;
  }

  .eq-row {
    gap: 3px;
  }

  .eq-knob {
    width: 14px;
    height: 14px;
  }

  .eq-name {
    font-size: 5px;
  }

  .fader-handle {
    height: 27px;
    font-size: 5px;
  }

  .crossfader-section {
    width: 85%;
  }

  .music-card {
    width: 100%;
  }

}

@media (prefers-reduced-motion:reduce) {

  .fader-handle {
    transition: none !important;
  }

}
</style>
</head>

<body>

<!-- =========================
     MUSIC UND SKYLINE
========================= -->

<section class="music-hero">

  <div class="music-composition">

    <img
      class="skyline"
      src="images/frankfurt-skyline.png"
      alt=""
    >

    <img
      class="music-heading"
      src="images/music-schriftzug.png"
      alt="MUSIC – THE SOUND OF R.M.B."
    >

  </div>

  <!-- =========================
       DJ-AUFBAU
  ========================= -->

  <div class="dj-setup">

    <p class="music-style-top">
      90s Eurodance · EDM · Trance
    </p>

    <!-- LINKER BAUSYS-TEM -->

    <div class="turntable single">

      <img
        class="turntable-image"
        src="images/2DC1E1DB-FFB5-42D1-88F9-EE3AD793EF8D.png"
        alt="Bausys-tem Turntable links"
      >

    </div>

    <!-- =========================
         MISCHPULT
    ========================= -->

    <div class="mixer">

      <div class="mixer-header">

        <span>
          R.M.B. · 5 CHANNEL DJ MIXER
        </span>

        <span class="power-indicator">
          <span class="power-led"></span>
          POWER
        </span>

      </div>

      <div class="mixer-panel">

        <!-- EQ LINKS -->

        <div class="eq-panel">

          <span class="eq-title">
            CH A
          </span>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">GAIN</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">HIGH</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">MID</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">BASS</span>
          </div>

        </div>

        <!-- FADER + VU-METER -->

        <div class="mixer-center">

          <div
            class="vu-meter"
            id="vuLeft"
            aria-hidden="true"
          ></div>

          <nav
            class="mixer-channels"
            aria-label="DJ-Mischpult Navigation"
          >

            <!-- HOME -->

            <div class="mixer-channel">
              <div class="fader-track">

                <button
                  type="button"
                  class="fader-handle"

<script>

/* =========================
   FADER-NAVIGATION
========================= */

document
  .querySelectorAll(".fader-handle")
  .forEach(handle => {

    let startY = null;
    let pointerId = null;
    let distance = 0;

    function getTravel() {

      const track = handle.parentElement;

      return Math.max(
        10,
        Math.min(
          handle.offsetTop - 8,
          track.clientHeight * 0.65
        )
      );
    }

    function reset() {

      startY = null;
      pointerId = null;
      distance = 0;

      handle.classList.remove("dragging");
      handle.classList.add("returning");

      handle.style.setProperty(
        "--drag",
        "0px"
      );
    }

    handle.addEventListener(
      "pointerdown",
      event => {

        if (
          event.pointerType === "mouse" &&
          event.button !== 0
        ) {
          return;
        }

        event.preventDefault();

        startY = event.clientY;
        pointerId = event.pointerId;
        distance = 0;

        handle.classList.remove("returning");
        handle.classList.add("dragging");

        handle.setPointerCapture(
          event.pointerId
        );
      }
    );

    handle.addEventListener(
      "pointermove",
      event => {

        if (
          startY === null ||
          pointerId !== event.pointerId
        ) {
          return;
        }

        distance = Math.min(
          getTravel(),
          Math.max(
            0,
            startY - event.clientY
          )
        );

        handle.style.setProperty(
          "--drag",
          distance + "px"
        );
      }
    );

    handle.addEventListener(
      "pointerup",
      event => {

        if (
          startY === null ||
          pointerId !== event.pointerId
        ) {
          return;
        }

        const reached =
          distance >= getTravel() * 0.85;

        const destination =
          handle.dataset.url;

        reset();

        if (reached && destination) {
          window.location.assign(
            destination
          );
        }
      }
    );

    handle.addEventListener(
      "pointercancel",
      reset
    );

    handle.addEventListener(
      "lostpointercapture",
      () => {

        if (startY !== null) {
          reset();
        }
      }
    );

    handle.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "ArrowUp" ||
          event.key === "Enter"
        ) {

          event.preventDefault();

          const destination =
            handle.dataset.url;

          if (destination) {
            window.location.assign(
              destination
            );
          }
        }
      }
    );

  });

    meter.appendChild(led);
    leds.push(led);
  }

/* 5x7 LED-Punktmatrix */

const LED_FONT = {

/* =========================
   LED-ANIMATION
   PENDLE LINKS / RECHTS
========================= */

let ledColumns = [];

/* Position der Laufschrift */

let ledPosition = 0;

/* Richtung:
   1 nach rechts
  -1 nach links */

let ledDirection = 1;

/* Geschwindigkeit in Pixel/Sekunde */

const LED_SPEED = 85;

let ledLastTime = 0;

/* Maße werden automatisch
   an die Fensterbreite angepasst */

let ledPitch = 7;
let ledTextWidth = 0;

function blankColumn() {
  return [0,0,0,0,0,0,0];
}

/* Text in LED-Spalten umwandeln */

function buildLEDText(text) {

  const result = [];

  for (
    const character of text.toUpperCase()
  ) {

    const pattern =
      LED_FONT[character] ||
      LED_FONT[" "];

    for (
      let column = 0;
      column < 5;
      column++
    ) {

      const pixels = [];

      for (
        let row = 0;
        row < 7;
        row++
      ) {

        pixels.push(
          pattern[row][column] === "1"
            ? 1
            : 0
        );
      }

      result.push(pixels);
    }

    /* Eine Leer-Spalte
       zwischen den Buchstaben */

    result.push(blankColumn());
  }

  return result;
}

/* Kategorienachricht wechseln */

function updateLEDMessage(category) {

  const text =
    category === "single"
      ? "SINGLE · THE SINGLE COLLECTION"
      : "ALBUM · THE ALBUM COLLECTION";

  ledCanvas.setAttribute(
    "aria-label",
    text
  );

  ledColumns =
    buildLEDText(text);

  /* Bei jedem Wechsel startet
     der Text wieder links */

  ledPosition = 0;
  ledDirection = 1;

  calculateLEDLayout();
}

/* =========================
   LED-BREITE BERECHNEN
========================= */

function calculateLEDLayout() {

  const width =
    ledCanvas.clientWidth;

  const height =
    ledCanvas.clientHeight;

  const columns =
    Math.max(1,ledColumns.length);

  /* Seitliche Sicherheitsabstände */

  const padding = 12;

  /* Gesamter Schriftzug soll
     höchstens 75 % der
     Leistenbreite einnehmen.

     Dadurch bleibt links und
     rechts genug Weg zum Pendeln. */

  const maxTextWidth =
    Math.max(
      1,
      (width - padding*2)*0.75
    );

  /* LED-Punktabstand anpassen */

  ledPitch = Math.min(
    9.4,
    (height - 16)/7,
    maxTextWidth/columns
  );

  ledTextWidth =
    columns*ledPitch;

  const maxPosition = Math.max(
    0,
    width - padding*2 - ledTextWidth
  );

  ledPosition = Math.min(
    ledPosition,
    maxPosition
  );
}

/* =========================
   CANVAS AUFLÖSUNG
========================= */

function resizeLEDCanvas() {

  const rect =
    ledCanvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  ledCanvas.width =
    Math.round(rect.width*dpr);

  ledCanvas.height =
    Math.round(rect.height*dpr);

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  calculateLEDLayout();
}

/* =========================
   LED-ZEICHNUNG
========================= */

function drawLED(time) {

  const width =
    ledCanvas.clientWidth;

  const height =
    ledCanvas.clientHeight;

  ctx.clearRect(
    0,0,width,height
  );

  ctx.fillStyle = "#07111b";
  ctx.fillRect(
    0,0,width,height
  );

  const padding = 12;

  const usedHeight =
    7*ledPitch;

  const startY =
    (height-usedHeight)/2;

  const radius =
    Math.max(0.35,ledPitch*0.29);

  /* Linke Textkante */

  const startX =
    padding+ledPosition;

  /* Alle LED-Buchstaben zeichnen */

  for (
    let columnIndex=0;
    columnIndex<ledColumns.length;
    columnIndex++
  ) {

    const column =
      ledColumns[columnIndex];

    for (
      let row=0;
      row<7;
      row++
    ) {

      const x =
        startX+
        columnIndex*ledPitch+
        ledPitch/2;

      const y =
        startY+
        row*ledPitch+
        ledPitch/2;

      /* Dunkler LED-Punkt */

      ctx.beginPath();

      ctx.arc(
        x,y,
        radius,
        0,
        Math.PI*2
      );

      ctx.fillStyle =
        "rgba(125,165,205,0.12)";

      ctx.fill();

      /* Leuchtender LED-Punkt */

      if (column[row]) {

        ctx.shadowBlur =
          Math.max(3,ledPitch*1.1);

        ctx.shadowColor =
          "#65bdff";

        ctx.beginPath();

        ctx.arc(
          x,y,
          radius,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
          "#d9f2ff";

        ctx.fill();

        ctx.shadowBlur = 0;
      }
    }
  }

  /* =========================
     PENDELBEWEGUNG
  ========================= */

  if (
    !reduceMotion &&
    !document.hidden
  ) {

    if (ledLastTime) {

      const delta = Math.min(
        0.05,
        (time-ledLastTime)/1000
      );

      const maxPosition =
        Math.max(
          0,
          width-padding*2-ledTextWidth
        );

      /* Bewegen */

      ledPosition +=
        LED_SPEED*
        delta*
        ledDirection;

      /* Rechter Anschlag:
         Richtung nach links */

      if (
        ledPosition >= maxPosition
      ) {

        ledPosition = maxPosition;
        ledDirection = -1;
      }

      /* Linker Anschlag:
         Richtung nach rechts */

      if (
        ledPosition <= 0
      ) {

        ledPosition = 0;
        ledDirection = 1;
      }
    }
  }

  ledLastTime = time;

  requestAnimationFrame(
    drawLED
  );
}

/* LED starten */

/* HTML absichern */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* Links prüfen */

function safeURL(value) {

  try {

    const url = new URL(
      value,
      window.location.href
    );

    if (
      url.protocol === "https:" ||
      url.protocol === "http:"
    ) {
      return url.href;
    }

  } catch {}

  return "";
}

/* Datum formatieren */

function formatDate(value) {

  if (!value) {
    return "";
  }

  const date = new Date(
    String(value).slice(0,10)+
    "T12:00:00"
  );

  if (
    Number.isNaN(date.getTime())
  ) {
    return "";
  }

  return date.toLocaleDateString(
    "de-DE",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );
}

/* Single oder Album */

function categoryOf(item) {

  const category = String(
    item.type ||
    item.category ||
    "single"
  ).toLowerCase();

  return [
    "album",
    "albums",
    "lp"
  ].includes(category)
    ? "album"
    : "single";
}

/* YouTube-ID */

function getYoutubeId(item) {

  const value =
    String(item.youtube || "").trim();

  if (
    /^[A-Za-z0-9_-]{11}$/.test(value)
  ) {
    return value;
  }

  try {

    const url = new URL(value);

    const hostname =
      url.hostname.toLowerCase();

    if (
      hostname === "youtu.be" ||
      hostname === "www.youtu.be"
    ) {
      return url.pathname.split("/")[1] || "";
    }

    if (
      hostname === "youtube.com" ||
      hostname === "www.youtube.com" ||
      hostname === "m.youtube.com"
    ) {

      if (url.pathname === "/watch") {
        return url.searchParams.get("v") || "";
      }

      const parts =
        url.pathname.split("/");

      if (
        ["shorts","embed","live"]
          .includes(parts[1])
      ) {
        return parts[2] || "";
      }
    }

  } catch {}

  return "";
}

/* =========================

function renderMusic() {

    return;
  }

  /* Cover erstellen */

  items
    .slice(0,visibleCount)
    .forEach(item => {

      const videoId =
        getYoutubeId(item);

      const validVideoId =
        /^[A-Za-z0-9_-]{11}$/.test(videoId)
          ? videoId
          : "";

      const cover =
        safeURL(item.cover) ||
        (
          validVideoId
            ? "https://img.youtube.com/vi/" +
              validVideoId +
              "/hqdefault.jpg"
            : ""
        );

      const spotify =
        safeURL(item.spotify);

      const amazon =
        safeURL(item.amazon);

      const date =
        formatDate(item.releaseDate);

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "music-card";

      card.innerHTML = `

        <button
          type="button"
          class="cover-button"
          ${validVideoId ? "" : "disabled"}
          aria-label="Video öffnen"
        >

          <img
            class="cover"
            src="${escapeHTML(cover)}"
            alt="${escapeHTML(item.title || "R.M.B.")}"
            loading="lazy"
          >

        </button>

        <div class="track-title">
          ${escapeHTML(item.title || "R.M.B.")}
        </div>

        <div class="track-version">
          ${escapeHTML(item.version || "")}
        </div>

        ${
          date
            ? `
              <div class="track-date">
                ${escapeHTML(date)}
              </div>
            `
            : ""
        }

        <div class="music-links">

          ${
            validVideoId
              ? `
                <a
                  href="https://www.youtube.com/watch?v=${validVideoId}"
                  target="_blank"
                  rel="noopener noreferrer"
                >YouTube</a>
              `
              : ""
          }

          ${
            spotify
              ? `
                <a
                  href="${escapeHTML(spotify)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >Spotify</a>
              `
              : ""
          }

          ${
            amazon
              ? `
                <a
                  href="${escapeHTML(amazon)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >Amazon</a>
              `
              : ""
          }

        </div>
      `;

      if (
        validVideoId
      ) {

        card
          .querySelector(".cover-button")
          .addEventListener(
            "click",
            () => openVideo(validVideoId)
          );
      }

      gallery.appendChild(card);
    });

  /* Weitere Cover anzeigen */

  moreButton.hidden =
    items.length <= visibleCount;

  moreButton.textContent =
    isSingle
      ? "WEITERE SONGS ANZEIGEN"
      : "WEITERE ALBEN ANZEIGEN";
}

/* Weitere Songs laden */

moreButton.addEventListener(
  "click",
  () => {

    visibleCount += 10;
    renderMusic();
  }
);

/* =========================
   SONGS.JSON LADEN
========================= */

fetch("songs.json")

  .then(response => {

    if (
      !response.ok
    ) {

      throw new Error(
        "songs.json nicht gefunden"
      );
    }

    return response.json();
  })

  .then(data => {

    allMusic =
      Array.isArray(data)
        ? data
        : [];

    renderMusic();
  })

  .catch(error => {

    gallery.innerHTML = `
      <div class="empty-message">
        Die Musikdaten konnten
        nicht geladen werden.
      </div>
    `;

    console.error(error);
  });

</script>

</body>
</html>
