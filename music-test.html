
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R.M.B. | MUSIC TEST</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>

/* ==============================
   GRUNDEINSTELLUNGEN
============================== */

:root {
  --background: #101720;
  --card: #1c2530;
  --silver: #b8c8db;
  --line: #304052;
  --blue: #7cbfff;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--background);
}

body {
  color: #e6edf7;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 2px solid #86c8ff;
  outline-offset: 3px;
}

/* ==============================
   MUSIC UND SKYLINE
============================== */

.music-hero {
  position: relative;
  width: 100%;
  overflow: hidden;
  padding: 0 0 32px;
  text-align: center;
}

.music-hero::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 100%;
  height: 560px;
  pointer-events: none;
  background: radial-gradient(
    ellipse,
    rgba(56,94,135,.17) 0%,
    rgba(30,52,75,.07) 45%,
    transparent 75%
  );
}

/* OBERER GRAFIKBEREICH */

.music-composition {
  position: relative;
  width: 100%;
  height: clamp(260px, 30vw, 390px);
  isolation: isolate;
}

/* SKYLINE VOLLE BREITE */

.skyline {
  position: absolute;
  z-index: 0;
  left: 0;
  bottom: 0;
  width: 100%;
  max-width: none;
  height: auto;
  display: block;
  opacity: .28;
  filter: brightness(0) invert(1);
  pointer-events: none;
}

/* MUSIC 50 % GRÖSSER ALS ZUVOR */

.music-heading {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: clamp(45px, 5vw, 80px);
  transform: translateX(-50%);
  display: block;
  width: min(720px, 92%);
  max-width: 720px;
  height: auto;
  mix-blend-mode: screen;
  filter: drop-shadow(
    0 0 10px rgba(95,165,255,.18)
  );
  pointer-events: none;
}

/* ==============================
   DJ-SETUP
============================== */

.dj-setup {
  position: relative;
  z-index: 5;

  width: min(1160px, 96%);
  margin: 12px auto 0;

  display: grid;
  grid-template-columns:
    minmax(0, 1fr)
    minmax(0, 2.15fr)
    minmax(0, 1fr);

  gap: 12px;
  align-items: stretch;
}

/* GEMEINSAME GERÄTEOPTIK */

.dj-device {
  position: relative;
  min-width: 0;
  height: 232px;
  overflow: hidden;
  border: 1px solid #64778b;
  border-radius: 9px;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.08),
      transparent 27%
    ),
    linear-gradient(
      155deg,
      #344252,
      #202c39 52%,
      #141d27
    );

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.2),
    inset 0 -3px 5px rgba(0,0,0,.3),
    0 8px 22px rgba(0,0,0,.3);
}

/* ==============================
   TURNTABLES
============================== */

.turntable {
  padding: 8px;
}

.turntable-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;

  color: #aebfd0;
  font-family: "Michroma", Arial, sans-serif;
  font-size: clamp(5px, .6vw, 8px);
  letter-spacing: .4px;
}

.turntable-led {
  width: 6px;
  height: 6px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #51718b;
}

.turntable.selected .turntable-led {
  background: #8bd3ff;
  box-shadow: 0 0 9px #60b6ff;
}

.turntable-surface {
  position: absolute;
  inset: 21px 6px 22px;
}

/* RUNDES PLATTENTELLER-GEHÄUSE */

.platter {
  position: absolute;
  top: 50%;
  left: 43%;
  transform: translate(-50%, -50%);
  width: min(82%, 190px);
  aspect-ratio: 1;
  border-radius: 50%;
  padding: 5px;

  background: repeating-conic-gradient(
    from 0deg,
    #9caab8 0deg 2deg,
    #475866 2deg 4deg
  );

  border: 3px solid #8293a4;

  box-shadow:
    0 0 0 3px #111a24,
    0 4px 12px rgba(0,0,0,.65),
    inset 0 0 8px #000;
}

/* VINYLSCHEIBE */

.record {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 50%;
  background:
    repeating-radial-gradient(
      circle,
      transparent 0px,
      transparent 3px,
      rgba(190,209,226,.13) 4px,
      transparent 5px
    ),
    conic-gradient(
      #090c10 0deg,
      #26313e 45deg,
      #090c10 100deg,
      #29394a 180deg,
      #080c12 270deg,
      #090c10 360deg
    );
  border: 2px solid #05080e;
}

.record::after {
  content: "";
  position: absolute;
  inset: 3%;
  border-radius: 50%;
  border: 1px solid rgba(200,220,235,.18);
  pointer-events: none;
}

.record-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  border: 2px solid #d5e2ef;
  border-radius: 50%;

  background: radial-gradient(
    circle at 35% 30%,
    #355979,
    #14263a 70%
  );

  color: #edf5ff;
  font-family: "Michroma", Arial, sans-serif;
  font-size: clamp(6px, .72vw, 9px);
  text-align: center;
}

.record-label::after {
  content: "";
  width: 4px;
  height: 4px;
  margin-top: 5px;
  background: silver;
  border-radius: 50%;
}

/* SINGLE MIT GRÖSSEREM LABEL */

.turntable.single .record-label {
  width: 43%;
  height: 43%;
}

/* ALBUM MIT KLEINEREM LABEL */

.turntable.album .record-label {
  width: 28%;
  height: 28%;
}

/* PLATTE BEI AUSWAHL LEICHT ROTIEREN */

.turntable.selected .record {
  animation: record-spin 5s linear infinite;
}

@keyframes record-spin {
  to {
    transform: rotate(360deg);
  }
}

/* ==============================
   S-TONARM
============================== */

.tonearm-button {
  position: absolute;
  z-index: 5;
  right: 0;
  top: 4px;

  width: 54%;
  height: 91%;

  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;

  touch-action: manipulation;
}

.tonearm-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(
    2px 3px 2px rgba(0,0,0,.65)
  );
}

.tonearm-moving {
  transform-box: view-box;
  transform-origin: 81px 18px;
  transform: rotate(0deg);
  transition: transform .55s ease-in-out;
}

.turntable.selected .tonearm-moving {
  transform: rotate(-27deg);
}

/* TONARMBASIS */

.tonearm-base {
  fill: #a8bbc9;
  stroke: #34495c;
  stroke-width: 3;
}

.tonearm-inner {
  fill: #42576b;
}

/* S-FÖRMIGER TONARM */

.tonearm-shape {
  fill: none;
  stroke: #d4e1ed;
  stroke-width: 7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tonearm-highlight {
  fill: none;
  stroke: rgba(255,255,255,.75);
  stroke-width: 2;
  stroke-linecap: round;
}

/* TONABNEHMER */

.cartridge {
  fill: #263744;
  stroke: #c4d5e2;
  stroke-width: 2;
}

/* START-STOP-DEKORATION */

.turntable-controls {
  position: absolute;
  bottom: 7px;
  left: 9px;

  display: flex;
  align-items: center;
  gap: 7px;

  color: #aabed1;
  font-size: 8px;
  letter-spacing: 1px;
}

.power-light {
  width: 7px;
  height: 7px;
  background: #84c9ff;
  border-radius: 50%;
  box-shadow: 0 0 5px #60b1ff;
}

.start-stop {
  width: 27px;
  height: 10px;
  background: linear-gradient(
    #c4d1dc,
    #74889c
  );
  border: 1px solid #e0e8f0;
  border-radius: 2px;
}

/* ==============================
   MISCHPULT
============================== */

.mixer {
  padding: 8px 10px 10px;
}

.mixer-top {
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;

  color: #b7c9dc;
  font-family: "Michroma", Arial, sans-serif;
  font-size: clamp(6px, .7vw, 9px);
  letter-spacing: .6px;
}

.mixer-indicator {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 5px;
  border-radius: 50%;
  background: #8ad0ff;
  box-shadow: 0 0 7px #60b6ff;
}

/* LINKS / FADER / RECHTS */

.mixer-main {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr)
    minmax(0, 3.25fr)
    minmax(0, 1fr);
  gap: 7px;
  height: 148px;
  align-items: stretch;
}

/* LINKER UND RECHTER EQUALIZER */

.eq-panel {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-items: center;
  padding: 2px;
  border: 1px solid #425367;
  border-radius: 4px;
  background: rgba(7,14,22,.21);
}

.eq-title {
  color: #9fb5ca;
  font-size: 7px;
  letter-spacing: .5px;
}

.knob-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  width: 100%;
}

.knob {
  position: relative;
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  border-radius: 50%;

  border: 2px solid #8ca0b2;

  background: conic-gradient(
    #526a7e,
    #d2dce6,
    #465a6e,
    #a2b4c4,
    #526a7e
  );

  box-shadow:
    0 2px 3px #060b11,
    inset 0 1px 2px #ecf4fa;
}

.knob::after {
  content: "";
  position: absolute;
  width: 2px;
  height: 7px;
  top: 1px;
  left: calc(50% - 1px);
  background: #14202d;
  border-radius: 2px;
}

.knob-label {
  color: #aec0d0;
  font-size: clamp(5px, .6vw, 7px);
  letter-spacing: .2px;
}

/* FADER- UND LED-BEREICH */

.mixer-center {
  display: grid;
  grid-template-columns:
    10px minmax(0,1fr) 10px;
  gap: 5px;
  min-width: 0;
}

/* LED-PEGELANZEIGEN */

.vu-meter {
  display: flex;
  flex-direction: column-reverse;
  justify-content: flex-start;
  gap: 3px;
  padding: 5px 1px;

  border: 1px solid #405063;
  border-radius: 3px;
  background: #080e14;
}

.vu-led {
  width: 100%;
  height: 5px;
  background: #192a26;
  border-radius: 1px;
  opacity: .3;
}

.vu-led.green {
  --lit: #41ef83;
}

.vu-led.yellow {
  --lit: #e7db50;
}

.vu-led.red {
  --lit: #f46d62;
}

.vu-led.on {
  background: var(--lit);
  opacity: 1;
  box-shadow: 0 0 4px var(--lit);
}

/* FÜNF NAVIGATIONS-FADER */

.mixer-channels {
  display: grid;
  grid-template-columns:
    repeat(5,minmax(0,1fr));
  gap: 4px;
  min-width: 0;
}

.mixer-channel {
  position: relative;
  min-width: 0;
  border: 1px solid #394c5e;
  border-radius: 3px;
  background: linear-gradient(
    90deg,
    #17212d,
    #283747 50%,
    #17212d
  );
}

.fader-track {
  position: absolute;
  inset: 5px 1px;
}

.fader-track::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 5px;
  bottom: 5px;
  transform: translateX(-50%);
  width: 6px;
  border-radius: 4px;
  background: #070c12;
  box-shadow:
    inset 1px 0 2px #000,
    1px 0 1px rgba(255,255,255,.12);
}

.fader-handle {
  position: absolute;
  left: 50%;
  top: 63px;

  transform: translate(
    -50%,
    calc(-1 * var(--drag, 0px))
  );

  width: calc(100% - 1px);
  height: 40px;

  padding: 0 1px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;

  border: 1px solid #e6eef5;
  border-bottom-color: #62778d;
  border-radius: 3px;

  background: linear-gradient(
    180deg,
    #edf4fa,
    #b0c0d0 20%,
    #d4e0eb 45%,
    #8297aa 55%,
    #bacad8 80%,
    #7f95aa
  );

  box-shadow:
    0 3px 5px rgba(0,0,0,.65),
    inset 0 1px 1px white;

  color: #142332;
  font-family: "Michroma",Arial,sans-serif;
  font-size: clamp(4.5px,.58vw,7.5px);
  font-weight: bold;
  letter-spacing: -.4px;

  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.fader-handle::after {
  content: "";
  display: block;
  width: 72%;
  height: 3px;
  border-top: 1px solid #3e5266;
  border-bottom: 1px solid #f1f6fc;
  background: #72879c;
}

.fader-handle.dragging {
  cursor: grabbing;
}

.fader-handle.returning {
  transition: transform .2s ease-out;
}

.fader-handle[aria-current="page"] {
  border-color: #82bfff;
  box-shadow:
    0 3px 5px #000,
    0 0 8px rgba(105,177,255,.4);
}

/* DEKORATIVER CROSSFADER */

.crossfader-area {
  position: relative;
  margin: 10px auto 0;
  height: 29px;
  width: 58%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.crossfader-track {
  width: 100%;
  height: 6px;
  border-radius: 5px;
  background: #060b11;
  box-shadow:
    inset 0 1px 3px #000,
    0 1px 1px #617589;
}

.crossfader-handle {
  position: absolute;
  left: 50%;
  top: 2px;
  transform: translateX(-50%);

  width: 40px;
  height: 19px;

  background: linear-gradient(
    #e0e9f1,
    #8499af
  );

  border: 1px solid #e5edf4;
  border-radius: 3px;

  box-shadow: 0 3px 4px #080d13;
}

.crossfader-label {
  position: absolute;
  top: 23px;
  font-size: 7px;
  color: #93acc3;
  letter-spacing: 1px;
}

/* ==============================
   MUSIKRICHTUNGEN
============================== */

.music-style {
  position: relative;
  z-index: 3;

  margin: 27px auto 8px;

  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #adc0d6;
}

/* ==============================
   SONG- UND ALBUMGALERIE
============================== */

.content {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 38px 24px 90px;
  background: var(--background);
  text-align: center;
}

.section-heading {
  margin: 0 0 14px;
  font-family: "Michroma",Arial,sans-serif;
  font-size: clamp(19px,2.4vw,27px);
  font-weight: normal;
  letter-spacing: 2px;
}

.section-subtitle {
  margin: 0 0 35px;
  color: #91a7be;
  font-size: 13px;
  letter-spacing: 1px;
}

.gallery {
  display: grid;
  grid-template-columns:
    repeat(5,minmax(0,1fr));
  gap: 24px;
  text-align: center;
}

.music-card {
  min-width: 0;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: transform .2s;
}

.music-card:hover {
  transform: translateY(-4px);
}

.cover-button {
  display: block;
  width: 100%;
  padding: 0;
  background: transparent;
  border: 0;
  cursor: pointer;
}

.cover-button:disabled {
  cursor: default;
}

.cover {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: #090d13;
  border-radius: 7px;
}

.track-title {
  margin: 14px 0 5px;
  font-size: 14px;
  font-weight: bold;
  line-height: 1.5;
}

.track-version {
  margin-bottom: 8px;
  color: #9bafc5;
  font-size: 12px;
}

.track-date {
  margin-bottom: 10px;
  color: #8197ae;
  font-size: 11px;
}

.music-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.music-links a {
  padding: 8px 10px;
  background: #293d53;
  border-radius: 6px;
  color: #d6e9fc;
  text-decoration: none;
  font-size: 11px;
}

.music-links a:hover {
  background: #405c78;
}

.empty-message {
  grid-column: 1 / -1;
  padding: 38px 18px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: #aebfd2;
}

.more-button {
  margin-top: 35px;
  padding: 13px 22px;
  background: #263c52;
  border: 1px solid #6587aa;
  border-radius: 7px;
  color: white;
  font-family: "Michroma",Arial,sans-serif;
  font-size: 10px;
  cursor: pointer;
}

.more-button[hidden] {
  display: none;
}

/* ==============================
   VIDEOFENSTER
============================== */

.video-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  padding: 25px;
  background: rgba(0,0,0,.94);
  align-items: center;
  justify-content: center;
}

.video-modal.open {
  display: flex;
}

.video-window {
  position: relative;
  width: min(900px,100%);
}

.video-frame {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  background: black;
}

.close-video {
  position: absolute;
  right: 0;
  top: -48px;
  background: none;
  border: 0;
  color: white;
  font-size: 34px;
  cursor: pointer;
}

/* ==============================
   FUSSZEILE
============================== */

footer {
  padding: 30px 15px 35px;
  background: var(--background);
  color: #7d91a7;
  text-align: center;
  font-size: 12px;
}

/* ==============================
   TABLET
============================== */

@media (max-width:1050px) {

  .dj-setup {
    width: 98%;
    grid-template-columns:
      minmax(0,1fr)
      minmax(0,2.2fr)
      minmax(0,1fr);
    gap: 7px;
  }

  .dj-device {
    height: 195px;
  }

  .mixer {
    padding: 7px;
  }

  .mixer-main {
    height: 119px;
    gap: 4px;
  }

  .mixer-center {
    gap: 3px;
  }

  .mixer-channels {
    gap: 2px;
  }

  .fader-handle {
    top: 54px;
    height: 32px;
  }

  .knob {
    width: 16px;
    height: 16px;
  }

  .knob-row {
    gap: 3px;
  }

  .platter {
    width: min(82%,155px);
  }

  .crossfader-area {
    margin-top: 5px;
  }

  .gallery {
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

}

/* ==============================
   SMARTPHONE
============================== */

@media (max-width:650px) {

  .music-composition {
    height: 240px;
  }

  .music-heading {
    top: 55px;
    width: 94%;
  }

  .skyline {
    opacity: .24;
  }

  .dj-setup {
    width: min(460px,96%);
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap: 9px;
  }

  .dj-device {
    height: 186px;
  }

  .mixer {
    grid-column: 1 / -1;
    grid-row: 1;
    height: 205px;
  }

  .turntable.single {
    grid-column: 1;
    grid-row: 2;
  }

  .turntable.album {
    grid-column: 2;
    grid-row: 2;
  }

  .mixer-main {
    height: 128px;
    grid-template-columns:
      minmax(0,1fr)
      minmax(0,3.5fr)
      minmax(0,1fr);
  }

  .fader-handle {
    top: 58px;
    height: 36px;
    font-size: clamp(6px,1.6vw,8px);
  }

  .knob {
    width: 19px;
    height: 19px;
  }

  .knob-label {
    font-size: 7px;
  }

  .turntable-top {
    font-size: 7px;
  }

  .platter {
    width: min(83%,145px);
  }

  .music-style {
    margin-top: 24px;
    font-size: 9px;
    letter-spacing: 1px;
  }

  .content {
    padding: 35px 12px 65px;
  }

  .gallery {
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap: 12px;
  }

  .music-card {
    padding: 9px;
  }

  .track-title {
    font-size: 12px;
  }

}

/* SEHR SCHMALE DISPLAYS */

@media (max-width:360px) {

  .mixer-center {
    grid-template-columns:
      7px minmax(0,1fr) 7px;
    gap: 2px;
  }

  .fader-handle {
    font-size: 5px;
    letter-spacing: -.6px;
  }

  .mixer-main {
    grid-template-columns:
      minmax(0,.8fr)

<script>

/* ==============================
   MISCHPULT-NAVIGATION
============================== */

document.querySelectorAll(
  ".fader-handle"
).forEach(handle => {

  let startY = null;
  let pointerId = null;
  let distance = 0;

  function getTravel() {

    const track =
      handle.parentElement;

    return Math.max(
      12,
      Math.min(
        handle.offsetHeight,
        track.clientHeight -
        handle.offsetHeight - 10
      )
    );

  }

  function reset() {

    startY = null;
    pointerId = null;
    distance = 0;

    handle.classList.remove(
      "dragging"
    );

    handle.classList.add(
      "returning"
    );

    handle.style.setProperty(
      "--drag",
      "0px"
    );

  }

  handle.addEventListener(
    "pointerdown",
    event => {

      if (
        event.pointerType === "mouse" &&
        event.button !== 0
      ) {
        return;
      }

      event.preventDefault();

      startY = event.clientY;
      pointerId = event.pointerId;
      distance = 0;

      handle.classList.remove(
        "returning"
      );

      handle.classList.add(
        "dragging"
      );

      handle.setPointerCapture(
        event.pointerId
      );

    }
  );

  handle.addEventListener(
    "pointermove",
    event => {

      if (
        startY === null ||
        pointerId !== event.pointerId
      ) {
        return;
      }

      const travel = getTravel();

      distance = Math.min(
        travel,
        Math.max(
          0,
          startY - event.clientY
        )
      );

      handle.style.setProperty(
        "--drag",
        distance + "px"
      );

    }
  );

  handle.addEventListener(
    "pointerup",
    event => {

      if (
        startY === null ||
        pointerId !== event.pointerId
      ) {
        return;
      }

      const reached =
        distance >= getTravel() * .85;

      reset();

      if (reached) {

        window.location.assign(
          handle.dataset.url
        );

      }

    }
  );

  handle.addEventListener(
    "pointercancel",
    reset
  );

  handle.addEventListener(
    "lostpointercapture",
    () => {

      if (startY !== null) {
        reset();
      }

    }
  );

  /* TASTATUR ALS ALTERNATIVE */

  handle.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "ArrowUp"
      ) {

        event.preventDefault();

        window.location.assign(
          handle.dataset.url
        );

      }

    }
  );

});

/* ==============================
   LED-PEGELANZEIGEN
============================== */

function createMeter(id) {

  const meter =
    document.getElementById(id);

  for (let i = 0; i < 15; i++) {

    const led =
      document.createElement("span");

    led.className = "vu-led";

    if (i < 9) {

      led.classList.add("green");

    } else if (i < 13) {

      led.classList.add("yellow");

    } else {

      led.classList.add("red");

    }

    meter.appendChild(led);

  }

  return Array.from(
    meter.children
  );

}

const leftLEDs =
  createMeter("vuLeft");

const rightLEDs =
  createMeter("vuRight");

function updateMeter(leds, level) {

  leds.forEach((led, i) => {

    led.classList.toggle(
      "on",
      i < level
    );

  });

}

let leftLevel = 7;
let rightLevel = 6;

function animateMeters() {

  if (document.hidden) return;

  leftLevel = Math.max(
    2,
    Math.min(
      15,
      leftLevel +
      Math.floor(Math.random() * 7) - 3
    )
  );

  rightLevel = Math.max(
    2,
    Math.min(
      15,
      rightLevel +
      Math.floor(Math.random() * 7) - 3
    )
  );

  updateMeter(
    leftLEDs,
    leftLevel
  );

  updateMeter(
    rightLEDs,
    rightLevel
  );

}

animateMeters();

if (
  !window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches
) {

  setInterval(
    animateMeters,
    170
  );

}

/* ==============================
   MUSIKGALERIE
============================== */

const gallery =
  document.getElementById("gallery");

const sectionTitle =
  document.getElementById("sectionTitle");

const sectionSubtitle =
  document.getElementById("sectionSubtitle");

const moreButton =
  document.getElementById("moreButton");

const videoModal =
  document.getElementById("videoModal");

const videoFrame =
  document.getElementById("videoFrame");

const closeVideo =
  document.getElementById("closeVideo");

const singleTurntable =
  document.getElementById(
    "singleTurntable"
  );

const albumTurntable =
  document.getElementById(
    "albumTurntable"
  );

const singleTonearm =
  document.getElementById(
    "singleTonearm"
  );

const albumTonearm =
  document.getElementById(
    "albumTonearm"
  );

let allMusic = [];
let activeCategory = "single";
let visibleCount = 10;

/* ==============================
   TONARME ALS AUSWAHL
============================== */

function chooseCategory(category) {

  activeCategory = category;
  visibleCount = 10;

  const isSingle =
    category === "single";

  singleTurntable.classList.toggle(
    "selected",
    isSingle
  );

  albumTurntable.classList.toggle(
    "selected",
    !isSingle
  );

  singleTonearm.setAttribute(
    "aria-pressed",
    String(isSingle)
  );

  albumTonearm.setAttribute(
    "aria-pressed",
    String(!isSingle)
  );

  renderMusic();

}

singleTonearm.addEventListener(
  "click",
  () => {

    chooseCategory("single");

  }
);

albumTonearm.addEventListener(
  "click",
  () => {

    chooseCategory("album");

  }
);

/* ==============================
   HTML ABSICHERN
============================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

/* ==============================
   LINKS PRÜFEN
============================== */

function safeURL(value) {

  try {

    const url = new URL(
      value,
      window.location.href
    );

    if (
      url.protocol === "https:" ||
      url.protocol === "http:"
    ) {

      return url.href;

    }

  } catch {}

  return "";

}

/* ==============================
   DATUM FORMATIEREN
============================== */

function formatDate(value) {

  if (!value) return "";

  const date = new Date(
    String(value).slice(0,10) +
    "T12:00:00"
  );

  if (
    Number.isNaN(date.getTime())
  ) {
    return "";
  }

  return date.toLocaleDateString(
    "de-DE",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );

}

/* ==============================
   KATEGORIE ERMITTELN
============================== */

function categoryOf(item) {

  const category = String(
    item.type ||
    item.category ||
    "single"
  ).toLowerCase();

  return [
    "album",
    "albums",
    "lp"
  ].includes(category)
    ? "album"
    : "single";

}

/* ==============================
   YOUTUBE-ID ERMITTELN
============================== */

function getYoutubeId(item) {

  const value = String(
    item.youtube || ""
  ).trim();

  if (
    /^[A-Za-z0-9_-]{11}$/.test(value)
  ) {
    return value;
  }

  try {

    const url = new URL(value);

    const hostname =
      url.hostname.toLowerCase();

    if (
      hostname === "youtu.be" ||
      hostname === "www.youtu.be"
    ) {

      return (
        url.pathname.split("/")[1] || ""
      );

    }

    if (
      hostname === "youtube.com" ||
      hostname === "www.youtube.com" ||
      hostname === "m.youtube.com"
    ) {

      if (
        url.pathname === "/watch"
      ) {

        return (
          url.searchParams.get("v") || ""
        );

      }

      const parts =
        url.pathname.split("/");

      if (
        [
          "shorts",
          "embed",
          "live"
        ].includes(parts[1])
      ) {

        return parts[2] || "";

      }

    }

  } catch {}

  return "";

}

/* ==============================
   VIDEO ÖFFNEN
============================== */

function openVideo(videoId) {

  if (
    !/^[A-Za-z0-9_-]{11}$/.test(videoId)
  ) {
    return;
  }

  videoFrame.src =
    "https://www.youtube-nocookie.com/embed/" +
    videoId +
    "?autoplay=1";

  videoModal.classList.add(
    "open"
  );

}

/* ==============================
   VIDEO SCHLIESSEN
============================== */

function closeVideoPlayer() {

  videoModal.classList.remove(
    "open"
  );

  videoFrame.src = "";

}

closeVideo.addEventListener(
  "click",
  closeVideoPlayer
);

videoModal.addEventListener(
  "click",
  event => {

    if (
      event.target === videoModal
    ) {
      closeVideoPlayer();
    }

  }
);

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {
      closeVideoPlayer();
    }

  }
);

/* ==============================
   GALERIE AUFBAUEN
============================== */

function renderMusic() {

  const isSingle =
    activeCategory === "single";

  sectionTitle.textContent =
    isSingle
      ? "SINGLES"
      : "ALBUMS";

  sectionSubtitle.textContent =
    isSingle
      ? "The Singles Collection"
      : "The Album Collection";

  const items = allMusic
    .filter(
      item =>
        categoryOf(item) === activeCategory
    )
    .sort(
      (a,b) =>
        String(
          b.releaseDate || ""
        ).localeCompare(
          String(
            a.releaseDate || ""
          )
        )
    );

  gallery.innerHTML = "";

  if (items.length === 0) {

    gallery.innerHTML = `
      <div class="empty-message">
        ${
          isSingle
            ? "Hier erscheinen deine R.M.B.-Singles."
            : "Hier erscheinen deine R.M.B.-Alben."
        }
      </div>
    `;

    moreButton.hidden = true;

    return;

  }

  items
    .slice(0,visibleCount)
    .forEach(item => {

      const videoId =
        getYoutubeId(item);

      const validVideoId =
        /^[A-Za-z0-9_-]{11}$/.test(videoId)
          ? videoId
          : "";

      const cover =
        safeURL(item.cover) ||
        (
          validVideoId
            ? "https://img.youtube.com/vi/" +
              validVideoId +
              "/hqdefault.jpg"
            : ""
        );

      const spotify =
        safeURL(item.spotify);

      const amazon =
        safeURL(item.amazon);

      const date =
        formatDate(
          item.releaseDate
        );

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "music-card";

      card.innerHTML = `

        <button
          type="button"
          class="cover-button"
          ${
            validVideoId
              ? ""
              : "disabled"
          }
          aria-label="Video öffnen"
        >

          <img
            class="cover"
            src="${escapeHTML(cover)}"
            alt="${escapeHTML(
              item.title || "R.M.B."
            )}"
            loading="lazy"
          >

        </button>

        <div class="track-title">
          ${escapeHTML(
            item.title || "R.M.B."
          )}
        </div>

        <div class="track-version">
          ${escapeHTML(
            item.version || ""
          )}
        </div>

        ${
          date
            ? `
              <div class="track-date">
                ${escapeHTML(date)}
              </div>
            `
            : ""
        }

        <div class="music-links">

          ${
            validVideoId
              ? `
                <a
                  href="https://www.youtube.com/watch?v=${validVideoId}"
                  target="_blank"
                  rel="noopener noreferrer"
                >YouTube</a>
              `
              : ""
          }

          ${
            spotify
              ? `
                <a
                  href="${escapeHTML(spotify)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >Spotify</a>
              `
              : ""
          }

          ${
            amazon
              ? `
                <a
                  href="${escapeHTML(amazon)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >Amazon</a>
              `
              : ""
          }

        </div>
      `;

      if (validVideoId) {

        card.querySelector(
          ".cover-button"
        ).addEventListener(
          "click",
          () => openVideo(validVideoId)
        );

      }

      gallery.appendChild(card);

    });

  moreButton.hidden =
    items.length <= visibleCount;

  moreButton.textContent =
    isSingle
      ? "WEITERE SONGS ANZEIGEN"
      : "WEITERE ALBEN ANZEIGEN";

}

/* ==============================
   WEITERE TITEL
============================== */

moreButton.addEventListener(
  "click",
  () => {

    visibleCount += 10;

    renderMusic();

  }
);

/* ==============================
   SONGS.JSON LADEN
============================== */

fetch("songs.json")

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "songs.json nicht gefunden"
      );

    }

    return response.json();

  })

  .then(data => {

    allMusic =
      Array.isArray(data)
        ? data
        : [];

    renderMusic();

  })

  .catch(error => {

    gallery.innerHTML = `
      <div class="empty-message">
        Die Musikdaten konnten
        nicht geladen werden.
      </div>
    `;

    console.error(error);

  });

</script>

</body>
</html>
