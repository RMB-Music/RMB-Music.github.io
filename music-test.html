
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R.M.B. | MUSIC TEST</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>

/* GRUNDEINSTELLUNGEN */

:root {
  --background: #101720;
  --card: #1c2530;
  --silver: #b8c8db;
  --line: #304052;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--background);
}

body {
  color: #e6edf7;
  font-family: Arial, sans-serif;
}

/* R.M.B. BANNER */
/* KORRIGIERT: VOLLE BILDSCHIRMBREITE */

header {
  width: 100%;
  background: var(--background);
  padding: 20px 0 0;
  text-align: center;
}

.rmb-banner {
  display: block;
  width: 100%;
  max-width: none;
  height: auto;
  margin: 0 auto;
}

/* NAVIGATION */

nav {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px 26px;
  padding: 24px 10px 16px;
}

nav a {
  color: var(--silver);
  font-family: "Michroma", Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
  text-decoration: none;
}

nav a:hover,
nav a.active {
  color: #ffffff;
  text-shadow: 0 0 12px #75b8ff;
}

/* MUSIC-BEREICH */

.music-hero {
  position: relative;
  overflow: hidden;
  background: var(--background);
  text-align: center;
  padding: 10px 15px 35px;
}

/* DEZENTER LICHTSCHEIN */

.music-hero::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: min(1000px, 100%);
  height: 440px;
  background: radial-gradient(
    ellipse,
    rgba(56, 94, 135, 0.15) 0%,
    rgba(30, 52, 75, 0.07) 45%,
    transparent 75%
  );
  pointer-events: none;
}

/* SKYLINE UND MUSIC ÜBEREINANDER */

.music-composition {
  position: relative;
  width: 100%;
  max-width: 1250px;
  height: 305px;
  margin: 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;
  isolation: isolate;
}

/* FRANKFURTER SKYLINE */
/* MAXIMAL 850 PIXEL BREIT */

.skyline {
  position: absolute;
  z-index: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  display: block;

  width: min(850px, 96%);
  max-width: 850px;
  min-width: 0;

  height: auto;
  opacity: 0.28;

  filter:
    brightness(0)
    invert(1);

  pointer-events: none;
}

/* MUSIC-SCHRIFTZUG VOR DER SKYLINE */

.music-heading {
  position: relative;
  z-index: 2;
  display: block;

  width: min(440px, 90%);
  height: auto;

  margin: -10px auto 0;

  mix-blend-mode: screen;

  filter: drop-shadow(
    0 0 8px rgba(95, 165, 255, 0.15)
  );
}

/* MUSIKRICHTUNGEN */

.music-style {
  position: relative;
  z-index: 3;
  margin: 8px auto 28px;

  font-size: 11px;
  letter-spacing: 2px;
  color: #adc0d6;
  text-transform: uppercase;
}

/* VINYL-AUSWAHL */

.vinyl-selector {
  position: relative;
  z-index: 3;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 65px;
  margin: 0 auto;
}

/* VINYL-BUTTONS */

.vinyl-button {
  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 12px;
  padding: 5px;

  border: 0;
  background: transparent;

  color: #dce7f3;
  cursor: pointer;

  opacity: 0.76;

  transition:
    opacity 0.25s,
    transform 0.25s;
}

.vinyl-button:hover {
  opacity: 1;
  transform: translateY(-4px);
}

.vinyl-button.active {
  opacity: 1;
}

/* SINGLE KLEINER ALS ALBUM */

.vinyl-button.single {
  width: 105px;
}

.vinyl-button.album {
  width: 130px;
}

/* VINYL-GRAFIKEN */

.disc-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
}

.disc-container img {
  position: relative;
  z-index: 2;

  display: block;
  width: 100%;
  height: 100%;

  object-fit: contain;
  border-radius: 50%;

  filter: drop-shadow(
    0 5px 10px rgba(0, 0, 0, 0.5)
  );
}

.vinyl-button.active img {
  filter:
    drop-shadow(0 0 10px rgba(91, 169, 255, 0.32))
    drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
}

/* ERSATZPLATTE BEI LADEFEHLER */

.fallback-vinyl {
  position: absolute;
  inset: 0;

  display: grid;
  place-items: center;
  overflow: hidden;

  border-radius: 50%;
  border: 1px solid #8296aa;

  background:
    repeating-radial-gradient(
      circle,
      transparent 0px,
      transparent 5px,
      rgba(175, 200, 225, 0.13) 6px,
      #090d13 8px
    ),
    conic-gradient(
      #090e14,
      #64788c,
      #090e14,
      #27394a,
      #090e14
    );
}

.fallback-vinyl span {
  display: grid;
  place-items: center;

  width: 55%;
  aspect-ratio: 1;

  border-radius: 50%;
  border: 1px solid #b2c5d8;

  background: #192736;
  color: white;

  font-family: "Michroma", sans-serif;
  font-size: 7px;
}

/* TEXT UNTER VINYL */

.vinyl-label {
  color: #b6c9df;
  font-family: "Michroma", Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 1px;
}

.vinyl-button.active .vinyl-label {
  color: #e1f0ff;
  text-shadow: 0 0 10px #518ccc;
}

/* SONG- UND ALBUM-GALERIE */

.content {
  width: 100%;
  max-width: 1400px;

  margin: 0 auto;
  padding: 45px 24px 90px;

  background: var(--background);
  text-align: center;
}

.section-heading {
  margin: 0 0 14px;

  font-family: "Michroma", Arial, sans-serif;
  font-size: clamp(19px, 2.4vw, 27px);
  font-weight: normal;
  letter-spacing: 2px;
}

.section-subtitle {
  margin: 0 0 35px;

  color: #91a7be;
  font-size: 13px;
  letter-spacing: 1px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 24px;
  text-align: center;
}

.music-card {
  min-width: 0;
  padding: 12px;

  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;

  transition: transform 0.2s;
}

.music-card:hover {
  transform: translateY(-4px);
}

.cover-button {
  display: block;
  width: 100%;
  padding: 0;

  background: transparent;
  border: 0;
  cursor: pointer;
}

.cover-button:disabled {
  cursor: default;
}

.cover {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;

  background: #090d13;
  border-radius: 7px;
}

.track-title {
  margin: 14px 0 5px;
  font-size: 14px;
  font-weight: bold;
  line-height: 1.5;
}

.track-version {
  margin-bottom: 8px;
  color: #9bafc5;
  font-size: 12px;
}

.track-date {
  margin-bottom: 10px;
  color: #8197ae;
  font-size: 11px;
}

.music-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;

  gap: 7px;
  margin-top: 12px;
}

.music-links a {
  padding: 8px 10px;

  background: #293d53;
  border-radius: 6px;

  color: #d6e9fc;
  text-decoration: none;
  font-size: 11px;
}

.music-links a:hover {
  background: #405c78;
}

.empty-message {
  grid-column: 1 / -1;

  padding: 38px 18px;

  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;

  color: #aebfd2;
}

.more-button {
  margin-top: 35px;
  padding: 13px 22px;

  background: #263c52;
  border: 1px solid #6587aa;
  border-radius: 7px;

  color: white;
  font-family: "Michroma", Arial, sans-serif;
  font-size: 10px;
  cursor: pointer;
}

.more-button[hidden] {
  display: none;
}

/* YOUTUBE-VIDEOFENSTER */

.video-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;

  padding: 25px;

  background: rgba(0, 0, 0, 0.94);

  align-items: center;
  justify-content: center;
}

.video-modal.open {
  display: flex;
}

.video-window {
  position: relative;
  width: min(900px, 100%);
}

.video-frame {
  width: 100%;
  aspect-ratio: 16 / 9;

  border: 0;
  background: black;
}

.close-video {
  position: absolute;
  right: 0;
  top: -48px;

  background: none;
  border: 0;

  color: white;
  font-size: 34px;
  cursor: pointer;
}

/* FUSSZEILE */

footer {
  padding: 30px 15px 35px;

  background: var(--background);
  color: #7d91a7;

  text-align: center;
  font-size: 12px;
}

/* TABLET */

@media (max-width: 1050px) {

  .gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .music-composition {
    height: 270px;
  }

  .music-heading {
    width: min(420px, 76%);
  }

  /* Keine Mindestbreite mehr für Skyline */

}

/* SMARTPHONE */

@media (max-width: 600px) {

  header {
    padding: 12px 0 0;
  }

  .rmb-banner {
    width: 100%;
  }

  nav {
    gap: 13px 15px;
    padding: 20px 0 10px;
  }

  nav a {
    font-size: 9px;
  }

  .music-hero {
    padding: 8px 8px 30px;
  }

  .music-composition {
    height: 190px;
  }

  .music-heading {
    width: min(330px, 85%);
    margin-top: 0;
  }

  .skyline {
    opacity: 0.24;
  }

  .music-style {
    margin: 8px auto 24px;
    font-size: 9px;
    letter-spacing: 1px;
  }

  .vinyl-selector {
    gap: 35px;
  }

  .vinyl-button.single {
    width: 80px;
  }

  .vinyl-button.album {
    width: 100px;
  }

  .vinyl-label {
    font-size: 9px;
  }

  .content {
    padding: 35px 12px 65px;
  }

  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .music-card {
    padding: 9px;
  }

  .track-title {
    font-size: 12px;
  }

}

</style>
</head>

<body>

<!-- R.M.B. BANNER -->

<header>

  <img
    class="rmb-banner"
    src="rmb-banner.png"
    alt="R.M.B. Logo"
  >

  <nav>
    <a href="index.html">HOME</a>
    <a href="music-test.html" class="active">MUSIC</a>
    <a href="music.html">RELEASES</a>
    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
  </nav>

</header>

<!-- MUSIC MIT SKYLINE -->

<section class="music-hero">

  <div class="music-composition">

    <!-- SKYLINE IM HINTERGRUND -->

    <img
      class="skyline"
      src="images/frankfurt-skyline.png"
      alt=""
    >

    <!-- MUSIC DAVOR -->

    <img
      class="music-heading"
      src="images/music-schriftzug.png"
      alt="MUSIC – THE SOUND OF R.M.B."
    >

  </div>

  <p class="music-style">
    90s Eurodance · EDM · Trance
  </p>

  <!-- VINYLPLATTEN -->

  <div class="vinyl-selector">

    <!-- SINGLE -->

    <button
      type="button"
      class="vinyl-button single active"
      id="singlesButton"
      aria-pressed="true"
    >

      <div class="disc-container">

        <div class="fallback-vinyl">
          <span>SINGLES</span>
        </div>

        <img
          src="images/vinyl-single.png"
          alt="Singles-Vinylplatte"
          onerror="this.style.display='none'"
        >

      </div>

      <span class="vinyl-label">
        SINGLES
      </span>

    </button>

    <!-- ALBUM -->

    <button
      type="button"
      class="vinyl-button album"
      id="albumsButton"
      aria-pressed="false"
    >

      <div class="disc-container">

        <div class="fallback-vinyl">
          <span>ALBUMS</span>
        </div>

        <img
          src="images/vinyl-album.png"
          alt="Albums-Vinylplatte"
          onerror="this.style.display='none'"
        >

      </div>

      <span class="vinyl-label">
        ALBUMS
      </span>

    </button>

  </div>

</section>

<!-- SONGS UND ALBEN -->

<main class="content">

  <h1
    class="section-heading"
    id="sectionTitle"
  >
    SINGLES
  </h1>

  <p
    class="section-subtitle"
    id="sectionSubtitle"
  >
    The Singles Collection
  </p>

  <div class="gallery" id="gallery">

    <div class="empty-message">
      Musik wird geladen ...
    </div>

  </div>

  <button
    type="button"
    id="moreButton"
    class="more-button"
    hidden
  >
    WEITERE SONGS ANZEIGEN
  </button>

</main>

<footer>
  © R.M.B. MUSIC · FRANKFURT AM MAIN
</footer>

<!-- VIDEOFENSTER -->

<div class="video-modal" id="videoModal">

  <div class="video-window">

    <button
      type="button"
      class="close-video"
      id="closeVideo"
      aria-label="Video schließen"
    >
      &times;
    </button>

    <iframe
      id="videoFrame"
      class="video-frame"
      title="R.M.B. Musikvideo"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen
    ></iframe>

  </div>

</div>

<script>

/* ELEMENTE */

const gallery =
  document.getElementById("gallery");

const singlesButton =
  document.getElementById("singlesButton");

const albumsButton =
  document.getElementById("albumsButton");

const sectionTitle =
  document.getElementById("sectionTitle");

const sectionSubtitle =
  document.getElementById("sectionSubtitle");

const moreButton =
  document.getElementById("moreButton");

const videoModal =
  document.getElementById("videoModal");

const videoFrame =
  document.getElementById("videoFrame");

const closeVideo =
  document.getElementById("closeVideo");

/* DATEN */

let allMusic = [];
let activeCategory = "single";
let visibleCount = 10;

/* TEXT ABSICHERN */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

/* LINKS PRÜFEN */

function safeURL(value) {

  try {

    const url = new URL(
      value,
      window.location.href
    );

    if (
      url.protocol === "https:" ||
      url.protocol === "http:"
    ) {
      return url.href;
    }

  } catch {}

  return "";

}

/* DATUM ANZEIGEN */

function formatDate(value) {

  if (!value) return "";

  const date = new Date(
    String(value).slice(0, 10) + "T12:00:00"
  );

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleDateString("de-DE", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });

}

/* SINGLE ODER ALBUM */

function categoryOf(item) {

  const category = String(
    item.type || item.category || "single"
  ).toLowerCase();

  return ["album", "albums", "lp"].includes(category)
    ? "album"
    : "single";

}

/* YOUTUBE-ID ERMITTELN */

function getYoutubeId(item) {

  const value =
    String(item.youtube || "").trim();

  if (/^[A-Za-z0-9_-]{11}$/.test(value)) {
    return value;
  }

  try {

    const url = new URL(value);
    const hostname =
      url.hostname.toLowerCase();

    if (
      hostname === "youtu.be" ||
      hostname === "www.youtu.be"
    ) {

      return url.pathname.split("/")[1] || "";

    }

    if (
      hostname === "youtube.com" ||
      hostname === "www.youtube.com" ||
      hostname === "m.youtube.com"
    ) {

      if (url.pathname === "/watch") {
        return url.searchParams.get("v") || "";
      }

      const parts = url.pathname.split("/");

      if (
        parts[1] === "shorts" ||
        parts[1] === "embed" ||
        parts[1] === "live"
      ) {
        return parts[2] || "";
      }

    }

  } catch {}

  return "";

}

/* VIDEO ÖFFNEN */

function openVideo(videoId) {

  if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
    return;
  }

  videoFrame.src =
    "https://www.youtube-nocookie.com/embed/" +
    videoId +
    "?autoplay=1";

  videoModal.classList.add("open");

}

/* VIDEO SCHLIESSEN */

function closeVideoPlayer() {

  videoModal.classList.remove("open");
  videoFrame.src = "";

}

closeVideo.addEventListener(
  "click",
  closeVideoPlayer
);

videoModal.addEventListener(
  "click",
  event => {

    if (event.target === videoModal) {
      closeVideoPlayer();
    }

  }
);

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "Escape") {
      closeVideoPlayer();
    }

  }
);

/* GALERIE AUFBAUEN */

function renderMusic() {

  const isSingle =
    activeCategory === "single";

  sectionTitle.textContent =
    isSingle ? "SINGLES" : "ALBUMS";

  sectionSubtitle.textContent =
    isSingle
      ? "The Singles Collection"
      : "The Album Collection";

  singlesButton.classList.toggle(
    "active",
    isSingle
  );

  albumsButton.classList.toggle(
    "active",
    !isSingle
  );

  singlesButton.setAttribute(
    "aria-pressed",
    String(isSingle)
  );

  albumsButton.setAttribute(
    "aria-pressed",
    String(!isSingle)
  );

  const items = allMusic
    .filter(item =>
      categoryOf(item) === activeCategory
    )
    .sort((a, b) =>
      String(b.releaseDate || "")
        .localeCompare(
          String(a.releaseDate || "")
        )
    );

  gallery.innerHTML = "";

  if (items.length === 0) {

    gallery.innerHTML = `
      <div class="empty-message">
        ${
          isSingle
            ? "Hier erscheinen deine R.M.B.-Singles."
            : "Hier erscheinen deine R.M.B.-Alben."
        }
      </div>
    `;

    moreButton.hidden = true;
    return;

  }

  items.slice(0, visibleCount).forEach(item => {

    const videoId = getYoutubeId(item);

    const validVideoId =
      /^[A-Za-z0-9_-]{11}$/.test(videoId)
        ? videoId
        : "";

    const cover =
      safeURL(item.cover) ||
      (
        validVideoId
          ? "https://img.youtube.com/vi/" +
            validVideoId +
            "/hqdefault.jpg"
          : ""
      );

    const spotify =
      safeURL(item.spotify);

    const amazon =
      safeURL(item.amazon);

    const date =
      formatDate(item.releaseDate);

    const card =
      document.createElement("article");

    card.className = "music-card";

    card.innerHTML = `

      <button
        type="button"
        class="cover-button"
        ${validVideoId ? "" : "disabled"}
        aria-label="Video öffnen"
      >

        <img
          class="cover"
          src="${escapeHTML(cover)}"
          alt="${escapeHTML(item.title || "R.M.B.")}"
          loading="lazy"
        >

      </button>

      <div class="track-title">
        ${escapeHTML(item.title || "R.M.B.")}
      </div>

      <div class="track-version">
        ${escapeHTML(item.version || "")}
      </div>

      ${
        date
          ? `<div class="track-date">
               ${escapeHTML(date)}
             </div>`
          : ""
      }

      <div class="music-links">

        ${
          validVideoId
            ? `<a
                 href="https://www.youtube.com/watch?v=${validVideoId}"
                 target="_blank"
                 rel="noopener noreferrer"
               >YouTube</a>`
            : ""
        }

        ${
          spotify
            ? `<a
                 href="${escapeHTML(spotify)}"
                 target="_blank"
                 rel="noopener noreferrer"
               >Spotify</a>`
            : ""
        }

        ${
          amazon
            ? `<a
                 href="${escapeHTML(amazon)}"
                 target="_blank"
                 rel="noopener noreferrer"
               >Amazon</a>`
            : ""
        }

      </div>
    `;

    if (validVideoId) {

      card.querySelector(
        ".cover-button"
      ).addEventListener(
        "click",
        () => openVideo(validVideoId)
      );

    }

    gallery.appendChild(card);

  });

  moreButton.hidden =
    items.length <= visibleCount;

  moreButton.textContent =
    isSingle
      ? "WEITERE SONGS ANZEIGEN"
      : "WEITERE ALBEN ANZEIGEN";

}

/* SINGLE ANKLICKEN */

singlesButton.addEventListener(
  "click",
  () => {

    activeCategory = "single";
    visibleCount = 10;
    renderMusic();

  }
);

/* ALBUM ANKLICKEN */

albumsButton.addEventListener(
  "click",
  () => {

    activeCategory = "album";
    visibleCount = 10;
    renderMusic();

  }
);

/* WEITERE TITEL LADEN */

moreButton.addEventListener(
  "click",
  () => {

    visibleCount += 10;
    renderMusic();

  }
);

/* SONGS.JSON EINLESEN */

fetch("songs.json")

  .then(response => {

    if (!response.ok) {
      throw new Error(
        "songs.json nicht gefunden"
      );
    }

    return response.json();

  })

  .then(data => {

    allMusic =
      Array.isArray(data) ? data : [];

    renderMusic();

  })

  .catch(error => {

    gallery.innerHTML = `
      <div class="empty-message">
        Die Musikdaten konnten
        nicht geladen werden.
      </div>
    `;

    console.error(error);

  });

</script>

</body>
</html>
