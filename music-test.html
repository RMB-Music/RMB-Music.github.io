<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R.M.B. | MUSIC TEST</title>

  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #08111c;
      --bg-2: #0c1826;
      --card: #172331;
      --card-2: #1e2c3c;
      --line: #31465f;
      --text: #e8f2fc;
      --soft: #97adc3;
      --blue: #7ec8ff;
      --blue-2: #4ca7ff;
      --blue-3: #bfe6ff;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at 50% 120px, rgba(42, 88, 136, 0.22), transparent 38%),
        linear-gradient(180deg, #08111b 0%, #09131f 35%, #08111c 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      font: inherit;
    }

    button:focus-visible {
      outline: 2px solid #8fd3ff;
      outline-offset: 3px;
    }

    .page-shell {
      width: 100%;
      overflow: hidden;
    }

    /* =========================
       HERO
    ========================= */

    .music-hero {
      position: relative;
      padding: 24px 0 0;
      overflow: hidden;
      background: transparent;
    }

    .music-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 110px, rgba(93, 156, 220, 0.10), transparent 36%),
        radial-gradient(circle at 50% 330px, rgba(50, 100, 165, 0.10), transparent 42%);
    }

    .music-composition {
      position: relative;
      width: min(1240px, 96%);
      height: clamp(230px, 27vw, 390px);
      margin: 0 auto;
    }

    .music-heading {
      position: absolute;
      left: 50%;
      top: 6px;
      transform: translateX(-50%);
      width: min(820px, 82%);
      z-index: 3;
      pointer-events: none;
      filter:
        drop-shadow(0 0 16px rgba(115, 180, 255, 0.20))
        drop-shadow(0 0 28px rgba(115, 180, 255, 0.08));
    }

    .skyline {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(1220px, 100%);
      z-index: 2;
      pointer-events: none;
      opacity: 0.34;
      filter: brightness(0) invert(1);
    }

    .music-style-top {
      position: relative;
      z-index: 4;
      width: min(1220px, 96%);
      margin: 4px auto 14px;
      text-align: center;
      color: #b6cae0;
      font-family: "Michroma", Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow:
        0 0 7px rgba(126, 200, 255, 0.18),
        0 0 16px rgba(126, 200, 255, 0.08);
    }

    /* =========================
       DJ SETUP
    ========================= */

    .dj-setup {
      position: relative;
      z-index: 5;
      width: min(1220px, 96%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.58fr) minmax(0, 1fr);
      gap: 12px;
      align-items: end;
    }

    .turntable-panel {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)),
        linear-gradient(180deg, #111926, #0e1622);
      border: 1px solid rgba(116, 153, 196, 0.25);
      box-shadow:
        0 10px 24px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 10px rgba(83, 146, 220, 0.08);
    }

    .turntable-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .mixer-panel {
      position: relative;
      min-width: 0;
      border-radius: 14px;
      padding: 12px 12px 11px;
      border: 1px solid rgba(116, 153, 196, 0.28);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.00) 30%),
        linear-gradient(180deg, #263649 0%, #172435 24%, #132031 100%);
      box-shadow:
        0 12px 26px rgba(0,0,0,0.34),
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 -1px 0 rgba(255,255,255,0.03),
        0 0 12px rgba(83, 146, 220, 0.08);
    }

    .mixer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: #aebfd2;
      font-family: "Michroma", Arial, sans-serif;
      font-size: 8px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .power-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .power-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8fd8ff;
      box-shadow:
        0 0 8px #69c1ff,
        0 0 16px rgba(105, 193, 255, 0.45);
    }

    .mixer-core {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 3.95fr) minmax(0, 0.92fr);
      gap: 8px;
      align-items: stretch;
    }

    .eq-strip {
      border: 1px solid #3d5065;
      border-radius: 8px;
      padding: 8px 7px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)),
        linear-gradient(180deg, rgba(8, 15, 24, 0.82), rgba(16, 27, 41, 0.68));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .eq-title {
      font-family: "Michroma", Arial, sans-serif;
      font-size: 7px;
      color: #96afc8;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .eq-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      min-width: 0;
    }

    .eq-row:last-child {
      margin-bottom: 0;
    }

    .eq-knob {
      position: relative;
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      border-radius: 50%;
      border: 1px solid #8194a7;
      background:
        radial-gradient(circle at 35% 35%, #eff5fb 0%, #c4d0dc 20%, #51667a 52%, #203244 76%, #0f1723 100%);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.65),
        0 2px 4px rgba(0,0,0,0.35);
    }

    .eq-knob::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 3px;
      transform: translateX(-50%);
      width: 2px;
      height: 7px;
      border-radius: 2px;
      background: #13202c;
    }

    .eq-label {
      min-width: 0;
      color: #b7c7d9;
      font-family: "Michroma", Arial, sans-serif;
      font-size: 7px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .mixer-center {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) 12px;
      gap: 7px;
      min-width: 0;
    }

    .vu-meter {
      border-radius: 4px;
      border: 1px solid #3d5166;
      background: #081018;
      padding: 4px 2px;
      display: flex;
      flex-direction: column-reverse;
      justify-content: flex-start;
      gap: 2px;
    }

    .vu-led {
      display: block;
      width: 100%;
      height: 7px;
      border-radius: 2px;
      opacity: 0.18;
      background: #15222f;
      transition: all 0.16s ease;
    }

    .vu-led.green { --vu-color: #41f08d; }
    .vu-led.yellow { --vu-color: #f0da58; }
    .vu-led.red { --vu-color: #ff6d67; }

    .vu-led.on {
      opacity: 1;
      background: var(--vu-color);
      box-shadow: 0 0 8px var(--vu-color);
    }

    .channels {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      min-width: 0;
    }

    .channel {
      position: relative;
      min-width: 0;
      height: 170px;
      border-radius: 7px;
      border: 1px solid #3b5166;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0) 50%, rgba(255,255,255,0.03)),
        linear-gradient(180deg, #1b2a3b 0%, #152232 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      overflow: hidden;
    }

    .channel-track {
      position: absolute;
      inset: 8px 6px 8px;
    }

    .channel-track::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 6px;
      bottom: 6px;
      transform: translateX(-50%);
      width: 8px;
      border-radius: 6px;
      background: #081018;
      box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.05),
        inset 0 -1px 2px rgba(0,0,0,0.6);
    }

    .fader-handle {
      position: absolute;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      width: calc(100% - 8px);
      height: 42px;
      border-radius: 4px;
      border: 1px solid #dbe8f3;
      background:
        linear-gradient(180deg, #f5f8fc 0%, #bfd0df 22%, #dce6ef 48%, #90a5b9 62%, #d4e0ea 100%);
      box-shadow:
        0 3px 5px rgba(0,0,0,0.5),
        inset 0 1px 1px rgba(255,255,255,0.95);
      color: #22384f;
      font-family: "Michroma", Arial, sans-serif;
      font-size: clamp(5px, 0.48vw, 7px);
      letter-spacing: -0.25px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      padding: 0 2px;
    }

    .fader-handle::after {
      content: "";
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      height: 4px;
      border-radius: 4px;
      background:
        linear-gradient(180deg, #32475d, #70869c);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.20);
    }

    .fader-handle.dragging {
      cursor: grabbing;
    }

    .fader-handle.returning {
      transition: transform 0.22s ease-out;
    }

    .fader-handle[aria-current="page"] {
      border-color: #8dccff;
      box-shadow:
        0 3px 5px rgba(0,0,0,0.5),
        inset 0 1px 1px rgba(255,255,255,0.95),
        0 0 10px rgba(126, 200, 255, 0.32);
    }

    .crossfader-section {
      margin-top: 10px;
    }

    .crossfader-labels {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
      color: #8fafcf;
      font-family: "Michroma", Arial, sans-serif;
      font-size: 8px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .crossfader-labels span.active {
      color: #d5efff;
      text-shadow:
        0 0 7px rgba(112, 195, 255, 0.52),
        0 0 14px rgba(112, 195, 255, 0.16);
    }

    .crossfader-ui {
      position: relative;
      height: 24px;
      cursor: pointer;
    }

    .crossfader-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 8px;
      height: 7px;
      border-radius: 999px;
      background:
        linear-gradient(180deg, #0a111a, #121f2d);
      box-shadow:
        inset 0 1px 2px rgba(0,0,0,0.7),
        0 1px 1px rgba(255,255,255,0.12);
      border: 1px solid rgba(120, 145, 175, 0.24);
    }

    .crossfader-handle {
      position: absolute;
      top: 1px;
      left: 0;
      width: 40px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid #dbe7f2;
      background:
        linear-gradient(180deg, #f7fbff 0%, #d2deea 20%, #a3b6c8 58%, #edf6fd 100%);
      box-shadow:
        0 3px 6px rgba(0,0,0,0.42),
        inset 0 1px 1px rgba(255,255,255,0.96),
        0 0 8px rgba(126, 200, 255, 0.10);
      cursor: grab;
      touch-action: none;
    }

    .crossfader-handle.dragging {
      cursor: grabbing;
    }

    .crossfader-handle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 68%;
      height: 5px;
      border-radius: 3px;
      background: linear-gradient(180deg, #60788f, #8ea4bb);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .crossfader-title {
      margin-top: 6px;
      text-align: center;
      color: #95a9be;
      font-family: "Michroma", Arial, sans-serif;
      font-size: 7px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* =========================
       LED DISPLAY
    ========================= */

    .led-display-wrap {
      position: relative;
      z-index: 6;
      width: min(1220px, 96%);
      margin: 12px auto 0;
    }

    .led-display {
      position: relative;
      width: 100%;
      padding: 9px 12px 10px;
      border-radius: 14px;
      border: 1px solid rgba(126, 175, 228, 0.28);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0)),
        linear-gradient(180deg, #142131 0%, #0e1825 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 8px 20px rgba(0,0,0,0.25),
        0 0 18px rgba(110, 180, 255, 0.06);
    }

    .led-display::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          transparent 0%,
          rgba(148, 210, 255, 0.08) 20%,
          transparent 45%,
          rgba(148, 210, 255, 0.08) 70%,
          transparent 100%);
    }

    .led-canvas {
      width: 100%;
      height: 84px;
      display: block;
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(8,16,24,0.8), rgba(8,16,24,0.95));
      border: 1px solid rgba(105, 142, 184, 0.20);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.03),
        inset 0 0 25px rgba(0, 0, 0, 0.35);
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px 90px;
      text-align: center;
    }

    .section-heading {
      margin: 0 0 12px;
      font-family: "Michroma", Arial, sans-serif;
      font-size: clamp(20px, 2.35vw, 30px);
      letter-spacing: 2px;
      font-weight: normal;
      text-transform: uppercase;
      color: #edf6ff;
    }

    .section-subtitle {
      margin: 0 0 36px;
      color: #95abc1;
      font-size: 13px;
      letter-spacing: 0.8px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      text-align: center;
    }

    .music-card {
      width: min(220px, 100%);
      min-width: 180px;
      padding: 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)),
        linear-gradient(180deg, #202c3b 0%, #172231 100%);
      border: 1px solid #304357;
      border-radius: 12px;
      box-shadow:
        0 6px 18px rgba(0,0,0,0.20),
        inset 0 1px 0 rgba(255,255,255,0.04);
      transition: transform 0.2s ease;
    }

    .music-card:hover {
      transform: translateY(-4px);
    }

    .cover-button {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .cover-button:disabled {
      cursor: default;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      background: #081018;
      display: block;
    }

    .track-title {
      margin: 14px 0 5px;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
      color: #f1f7fe;
    }

    .track-version {
      margin-bottom: 8px;
      color: #9db1c6;
      font-size: 12px;
    }

    .track-date {
      margin-bottom: 10px;
      color: #8299b0;
      font-size: 11px;
    }

    .music-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .music-links a {
      padding: 8px 10px;
      border-radius: 6px;
      background: #2a3f55;
      color: #d6ebff;
      text-decoration: none;
      font-size: 11px;
      transition: background 0.18s ease;
    }

    .music-links a:hover {
      background: #3d5a77;
    }

    .empty-message {
      width: min(520px, 100%);
      padding: 38px 18px;
      border-radius: 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)),
        linear-gradient(180deg, #1d2938 0%, #172130 100%);
      border: 1px solid #304357;
      color: #aebfd2;
    }

    .more-button {
      margin-top: 35px;
      padding: 13px 22px;
      background: #233a50;
      border: 1px solid #6587aa;
      border-radius: 7px;
      color: white;
      font-family: "Michroma", Arial, sans-serif;
      font-size: 10px;
      cursor: pointer;
    }

    .more-button[hidden] {
      display: none;
    }

    /* =========================
       VIDEO MODAL
    ========================= */

    .video-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      padding: 25px;
      background: rgba(0,0,0,0.94);
      align-items: center;
      justify-content: center;
    }

    .video-modal.open {
      display: flex;
    }

    .video-window {
      position: relative;
      width: min(900px, 100%);
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      background: black;
    }

    .close-video {
      position: absolute;
      right: 0;
      top: -48px;
      background: none;
      border: 0;
      color: white;
      font-size: 34px;
      cursor: pointer;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 30px 15px 35px;
      color: #7e92a8;
      text-align: center;
      font-size: 12px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1100px) {
      .dj-setup {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr) minmax(0, 1fr);
        gap: 10px;
      }

      .channel {
        height: 158px;
      }

      .fader-handle {
        height: 40px;
        top: 66px;
      }
    }

    @media (max-width: 820px) {
      .music-composition {
        height: 260px;
      }

      .music-heading {
        width: min(740px, 90%);
      }

      .skyline {
        width: 100%;
      }

      .dj-setup {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .mixer-panel {
        order: 1;
      }

      .turntable-panel.left {
        order: 2;
      }

      .turntable-panel.right {
        order: 3;
      }

      .led-canvas {
        height: 76px;
      }
    }

    @media (max-width: 700px) {
      .music-style-top {
        font-size: 10px;
        letter-spacing: 1.4px;
      }

      .content {
        padding: 28px 12px 65px;
      }

      .gallery {
        gap: 12px;
      }

      .music-card {
        min-width: 150px;
        width: calc(50% - 6px);
        padding: 9px;
      }

      .track-title {
        font-size: 12px;
      }

      .mixer-core {
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 3.8fr) minmax(0, 0.95fr);
      }

      .channel {
        height: 145px;
      }

      .fader-handle {
        top: 61px;
        height: 36px;
        font-size: 6px;
      }

      .eq-row {
        gap: 5px;
      }

      .eq-knob {
        width: 18px;
        height: 18px;
        flex-basis: 18px;
      }

      .eq-label {
        font-size: 6px;
      }

      .crossfader-handle {
        width: 36px;
      }
    }

    @media (max-width: 420px) {
      .music-card {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .vu-led,
      .fader-handle,
      .crossfader-handle {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">

    <section class="music-hero">

      <div class="music-composition">
        <img
          class="music-heading"
          src="images/music-schriftzug.png"
          alt="MUSIC – THE SOUND OF R.M.B."
        >

        <img
          class="skyline"
          src="images/frankfurt-skyline.png"
          alt=""
        >
      </div>

      <p class="music-style-top">
        90s Eurodance · EDM · Trance
      </p>

      <div class="dj-setup">

        <!-- LINKER TURNTABLE -->
        <div class="turntable-panel left">
          <img
            class="turntable-image"
            src="images/2DC1E1DB-FFB5-42D1-88F9-EE3AD793EF8D.png"
            alt="Bausys-tem Turntable links"
          >
        </div>

        <!-- MIXER -->
        <div class="mixer-panel">

          <div class="mixer-header">

  <script>
    /* =========================
       MISCHPULT-FADER NAVIGATION
    ========================= */

    document.querySelectorAll(".fader-handle").forEach(handle => {
      let startY = null;
      let pointerId = null;
      let distance = 0;

      function getTravel() {
        const track = handle.parentElement;
        return Math.max(
          14,
          Math.min(
            handle.offsetHeight,
            track.clientHeight - handle.offsetHeight - 12
          )
        );
      }

      function reset() {
        startY = null;
        pointerId = null;
        distance = 0;
        handle.classList.remove("dragging");
        handle.classList.add("returning");
        handle.style.transform = "translateX(-50%)";
      }

      handle.addEventListener("pointerdown", event => {
        if (event.pointerType === "mouse" && event.button !== 0) {
          return;
        }

        event.preventDefault();

        startY = event.clientY;
        pointerId = event.pointerId;
        distance = 0;

        handle.classList.remove("returning");
        handle.classList.add("dragging");
        handle.setPointerCapture(event.pointerId);
      });

      handle.addEventListener("pointermove", event => {
        if (startY === null || pointerId !== event.pointerId) {
          return;
        }

        const travel = getTravel();

        distance = Math.min(
          travel,
          Math.max(0, startY - event.clientY)
        );

        handle.style.transform =
          "translateX(-50%) translateY(" + (-distance) + "px)";
      });

      handle.addEventListener("pointerup", event => {
        if (startY === null || pointerId !== event.pointerId) {
          return;
        }

        const reached = distance >= getTravel() * 0.82;
        const url = handle.dataset.url;

        reset();

        if (reached && url) {
          window.location.assign(url);
        }
      });

      handle.addEventListener("pointercancel", reset);

      handle.addEventListener("lostpointercapture", () => {
        if (startY !== null) {
          reset();
        }
      });

      handle.addEventListener("keydown", event => {
        if (event.key === "ArrowUp") {
          event.preventDefault();
          const url = handle.dataset.url;
          if (url) {
            window.location.assign(url);
          }
        }
      });
    });

    /* =========================
       VU-METER
    ========================= */

    function createMeter(id) {
      const meter = document.getElementById(id);
      const leds = [];

      for (let i = 0; i < 14; i++) {
        const led = document.createElement("span");
        led.className = "vu-led";

        if (i < 8) {
          led.classList.add("green");
        } else if (i < 11) {
          led.classList.add("yellow");
        } else {
          led.classList.add("red");
        }

        meter.appendChild(led);
        leds.push(led);
      }

      return leds;
    }

    const leftLEDs = createMeter("vuLeft");
    const rightLEDs = createMeter("vuRight");

    function updateMeter(leds, level) {
      leds.forEach((led, i) => {
        led.classList.toggle("on", i < level);
      });
    }

    let leftLevel = 6;
    let rightLevel = 7;

    function animateMeters() {
      if (document.hidden) return;

      leftLevel = Math.max(
        2,
        Math.min(14, leftLevel + Math.floor(Math.random() * 7) - 3)
      );

      rightLevel = Math.max(
        2,
        Math.min(14, rightLevel + Math.floor(Math.random() * 7) - 3)
      );

      updateMeter(leftLEDs, leftLevel);
      updateMeter(rightLEDs, rightLevel);
    }

    animateMeters();

    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      setInterval(animateMeters, 170);
    }

    /* =========================
       CATEGORY / CROSSFADER
    ========================= */

    const singleLabel = document.getElementById("singleLabel");
    const albumLabel = document.getElementById("albumLabel");
    const crossfaderUI = document.getElementById("crossfaderUI");
    const crossfaderTrack = document.getElementById("crossfaderTrack");
    const crossfaderHandle = document.getElementById("crossfaderHandle");

    let activeCategory = "single";
    let allMusic = [];
    let visibleCount = 10;

    function positionCrossfader(category) {
      const trackRect = crossfaderUI.getBoundingClientRect();
      const handleWidth = crossfaderHandle.offsetWidth || 40;
      const maxX = Math.max(0, trackRect.width - handleWidth);
      const x = category === "single" ? 0 : maxX;

      crossfaderHandle.style.left = x + "px";
      singleLabel.classList.toggle("active", category === "single");
      albumLabel.classList.toggle("active", category === "album");
    }

    function chooseCategory(category) {
      activeCategory = category;
      visibleCount = 10;

      positionCrossfader(category);
      setLEDMessage(category);
      renderMusic();
    }

    function handleCrossfaderMove(clientX) {
      const uiRect = crossfaderUI.getBoundingClientRect();
      const handleWidth = crossfaderHandle.offsetWidth || 40;
      const maxX = Math.max(0, uiRect.width - handleWidth);

      let x = clientX - uiRect.left - handleWidth / 2;
      x = Math.max(0, Math.min(maxX, x));
      crossfaderHandle.style.left = x + "px";
    }

    function snapCrossfader(clientX) {
      const uiRect = crossfaderUI.getBoundingClientRect();
      const mid = uiRect.left + uiRect.width / 2;
      chooseCategory(clientX < mid ? "single" : "album");
    }

    let crossPointerId = null;
    let crossDragging = false;

    crossfaderHandle.addEventListener("pointerdown", event => {
      if (event.pointerType === "mouse" && event.button !== 0) {
        return;
      }

      event.preventDefault();
      crossPointerId = event.pointerId;
      crossDragging = true;
      crossfaderHandle.classList.add("dragging");
      crossfaderHandle.setPointerCapture(event.pointerId);
    });

    crossfaderHandle.addEventListener("pointermove", event => {
      if (!crossDragging || crossPointerId !== event.pointerId) {
        return;
      }

      handleCrossfaderMove(event.clientX);
    });

    function stopCrossDrag(event) {
      if (!crossDragging || crossPointerId !== event.pointerId) {
        return;
      }

      crossDragging = false;
      crossfaderHandle.classList.remove("dragging");
      snapCrossfader(event.clientX);
      crossPointerId = null;
    }

    crossfaderHandle.addEventListener("pointerup", stopCrossDrag);
    crossfaderHandle.addEventListener("pointercancel", () => {
      crossDragging = false;
      crossPointerId = null;
      crossfaderHandle.classList.remove("dragging");
      positionCrossfader(activeCategory);
    });

    crossfaderUI.addEventListener("click", event => {
      if (event.target === crossfaderHandle) {
        return;
      }

      snapCrossfader(event.clientX);
    });

    singleLabel.addEventListener("click", () => chooseCategory("single"));
    albumLabel.addEventListener("click", () => chooseCategory("album"));

    window.addEventListener("resize", () => {
      positionCrossfader(activeCategory);
      resizeLEDCanvas();
    });

    /* =========================
       LED DISPLAY / DOT MATRIX
    ========================= */

    const ledCanvas = document.getElementById("ledCanvas");
    const ledCtx = ledCanvas.getContext("2d");

    const LED_FONT = {
      "A": ["01110","10001","10001","11111","10001","10001","10001"],
      "B": ["11110","10001","10001","11110","10001","10001","11110"],
      "C": ["01111","10000","10000","10000","10000","10000","01111"],
      "D": ["11110","10001","10001","10001","10001","10001","11110"],
      "E": ["11111","10000","10000","11110","10000","10000","11111"],
      "G": ["01111","10000","10000","10111","10001","10001","01111"],
      "H": ["10001","10001","10001","11111","10001","10001","10001"],
      "I": ["11111","00100","00100","00100","00100","00100","11111"],
      "L": ["10000","10000","10000","10000","10000","10000","11111"],
      "M": ["10001","11011","10101","10101","10001","10001","10001"],
      "N": ["10001","11001","10101","10011","10001","10001","10001"],
      "O": ["01110","10001","10001","10001","10001","10001","01110"],
      "P": ["11110","10001","10001","11110","10000","10000","10000"],
      "R": ["11110","10001","10001","11110","10100","10010","10001"],
      "S": ["01111","10000","10000","01110","00001","00001","11110"],
      "T": ["11111","00100","00100","00100","00100","00100","00100"],
      "U": ["10001","10001","10001","10001","10001","10001","01110"],
      "Y": ["10001","10001","01010","00100","00100","00100","00100"],
      " ": ["00000","00000","00000","00000","00000","00000","00000"],
      ".": ["00000","00000","00000","00000","00000","00100","00100"],
      "·": ["00000","00000","00100","00000","00100","00000","00000"],
      "-": ["00000","00000","00000","11111","00000","00000","00000"]
    };

    let ledColumns = [];
    let ledOffset = 0;
    let ledDirection = -1;
    let ledText = " SINGLE · THE SINGLE COLLECTION · ";

    function blankColumn() {
      return [0,0,0,0,0,0,0];
    }

    function buildColumnsFromText(text) {
      const result = [];
      const pad = 18;

      for (let i = 0; i < pad; i++) {
        result.push(blankColumn().slice());
      }

      for (const char of text.toUpperCase()) {
        const pattern = LED_FONT[char] || LED_FONT[" "];

        for (let col = 0; col < 5; col++) {
          const column = [];

          for (let row = 0; row < 7; row++) {
            column.push(pattern[row][col] === "1" ? 1 : 0);
          }

          result.push(column);
        }

        result.push(blankColumn().slice());
      }

      for (let i = 0; i < pad; i++) {
        result.push(blankColumn().slice());
      }

      return result;
    }

    function setLEDMessage(category) {
      if (category === "single") {
        ledText = " SINGLE · THE SINGLE COLLECTION · ";
        ledDirection = 1;
      } else {
        ledText = " ALBUM · THE ALBUM COLLECTION · ";
        ledDirection = -1;
      }

      ledColumns = buildColumnsFromText(ledText);
      ledOffset = 0;
    }

    function resizeLEDCanvas() {
      const rect = ledCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      ledCanvas.width = Math.round(rect.width * dpr);
      ledCanvas.height = Math.round(rect.height * dpr);
      ledCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawLEDDisplay() {
      const width = ledCanvas.clientWidth;
      const height = ledCanvas.clientHeight;

      ledCtx.clearRect(0, 0, width, height);

      const paddingX = 18;
      const paddingY = 12;
      const rows = 7;
      const pitch = Math.min((height - paddingY * 2) / rows, 9.5);
      const radius = pitch * 0.28;
      const colsVisible = Math.floor((width - paddingX * 2) / pitch);

      ledCtx.fillStyle = "#08131d";
      ledCtx.fillRect(0, 0, width, height);

      for (let i = 0; i < colsVisible; i++) {
        let sourceIndex;

        if (ledDirection === 1) {
          sourceIndex = Math.floor((ledColumns.length + i - ledOffset) % ledColumns.length);
        } else {
          sourceIndex = Math.floor((ledOffset + i) % ledColumns.length);
        }

        const column = ledColumns[sourceIndex] || blankColumn();

        for (let row = 0; row < rows; row++) {
          const x = paddingX + i * pitch + pitch / 2;
          const y = paddingY + row * pitch + pitch / 2;

          /* dunkler LED-Hintergrundpunkt */
          ledCtx.beginPath();
          ledCtx.arc(x, y, radius, 0, Math.PI * 2);
          ledCtx.fillStyle = "rgba(130, 165, 200, 0.12)";
          ledCtx.fill();

          /* aktive LED */
          if (column[row]) {
            const glow = ledCtx.createRadialGradient(x, y, radius * 0.2, x, y, radius * 1.8);
            glow.addColorStop(0, "rgba(255,255,255,0.98)");
            glow.addColorStop(0.35, "rgba(190,230,255,0.95)");
            glow.addColorStop(0.72, "rgba(104,188,255,0.88)");
            glow.addColorStop(1, "rgba(104,188,255,0.08)");

            ledCtx.beginPath();
            ledCtx.arc(x, y, radius, 0, Math.PI * 2);
            ledCtx.fillStyle = glow;
            ledCtx.shadowBlur = 8;
            ledCtx.shadowColor = "rgba(100, 190, 255, 0.70)";
            ledCtx.fill();
            ledCtx.shadowBlur = 0;
          }
        }
      }

      ledOffset += 0.18;
      if (ledOffset >= ledColumns.length) {
        ledOffset = 0;
      }

      requestAnimationFrame(drawLEDDisplay);
    }

    resizeLEDCanvas();
    setLEDMessage("single");
    drawLEDDisplay();

    /* =========================
       GALLERY / DATA
    ========================= */

    const gallery = document.getElementById("gallery");
    const sectionTitle = document.getElementById("sectionTitle");
    const sectionSubtitle = document.getElementById("sectionSubtitle");
    const moreButton = document.getElementById("moreButton");
    const videoModal = document.getElementById("videoModal");
    const videoFrame = document.getElementById("videoFrame");
    const closeVideo = document.getElementById("closeVideo");

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function safeURL(value) {
      try {
        const url = new URL(value, window.location.href);

        if (url.protocol === "https:" || url.protocol === "http:") {
          return url.href;
        }
      } catch {}

      return "";
    }

    function formatDate(value) {
      if (!value) return "";

      const date = new Date(String(value).slice(0, 10) + "T12:00:00");

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleDateString("de-DE", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function categoryOf(item) {
      const category = String(item.type || item.category || "single").toLowerCase();

      return ["album", "albums", "lp"].includes(category)
        ? "album"
        : "single";
    }

    function getYoutubeId(item) {
      const value = String(item.youtube || "").trim();

      if (/^[A-Za-z0-9_-]{11}$/.test(value)) {
        return value;
      }

      try {
        const url = new URL(value);
        const hostname = url.hostname.toLowerCase();

        if (hostname === "youtu.be" || hostname === "www.youtu.be") {
          return url.pathname.split("/")[1] || "";
        }

        if (
          hostname === "youtube.com" ||
          hostname === "www.youtube.com" ||
          hostname === "m.youtube.com"
        ) {
          if (url.pathname === "/watch") {
            return url.searchParams.get("v") || "";
          }

          const parts = url.pathname.split("/");

          if (["shorts", "embed", "live"].includes(parts[1])) {
            return parts[2] || "";
          }
        }
      } catch {}

      return "";
    }

    function openVideo(videoId) {
      if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
        return;
      }

      videoFrame.src =
        "https://www.youtube-nocookie.com/embed/" +
        videoId +
        "?autoplay=1";

      videoModal.classList.add("open");
    }

    function closeVideoPlayer() {
      videoModal.classList.remove("open");
      videoFrame.src = "";
    }

    closeVideo.addEventListener("click", closeVideoPlayer);

    videoModal.addEventListener("click", event => {
      if (event.target === videoModal) {
        closeVideoPlayer();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeVideoPlayer();
      }
    });

    function renderMusic() {
      const isSingle = activeCategory === "single";

      sectionTitle.textContent = isSingle ? "SINGLES" : "ALBUMS";
      sectionSubtitle.textContent = isSingle
        ? "The Singles Collection"
        : "The Album Collection";

      const items = allMusic
        .filter(item => categoryOf(item) === activeCategory)
        .sort((a, b) =>
          String(b.releaseDate || "").localeCompare(String(a.releaseDate || ""))
        );

      gallery.innerHTML = "";

      if (items.length === 0) {
        gallery.innerHTML = `
          <div class="empty-message">
            ${
              isSingle
                ? "Hier erscheinen deine R.M.B.-Singles."
                : "Hier erscheinen deine R.M.B.-Alben."
            }
          </div>
        `;

        moreButton.hidden = true;
        return;
      }

      items.slice(0, visibleCount).forEach(item => {
        const videoId = getYoutubeId(item);

        const validVideoId =
          /^[A-Za-z0-9_-]{11}$/.test(videoId)
            ? videoId
            : "";

        const cover =
          safeURL(item.cover) ||
          (
            validVideoId
              ? "https://img.youtube.com/vi/" + validVideoId + "/hqdefault.jpg"
              : ""
          );

        const spotify = safeURL(item.spotify);
        const amazon = safeURL(item.amazon);
        const date = formatDate(item.releaseDate);

        const card = document.createElement("article");
        card.className = "music-card";

        card.innerHTML = `
          <button
            type="button"
            class="cover-button"
            ${validVideoId ? "" : "disabled"}
            aria-label="Video öffnen"
          >
            <img
              class="cover"
              src="${escapeHTML(cover)}"
              alt="${escapeHTML(item.title || "R.M.B.")}"
              loading="lazy"
            >
          </button>

          <div class="track-title">
            ${escapeHTML(item.title || "R.M.B.")}
          </div>

          <div class="track-version">
            ${escapeHTML(item.version || "")}
          </div>

          ${
            date
              ? `<div class="track-date">${escapeHTML(date)}</div>`
              : ""
          }

          <div class="music-links">
            ${
              validVideoId
                ? `
                  <a
                    href="https://www.youtube.com/watch?v=${validVideoId}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >YouTube</a>
                `
                : ""
            }

            ${
              spotify
                ? `
                  <a
                    href="${escapeHTML(spotify)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >Spotify</a>
                `
                : ""
            }

            ${
              amazon
                ? `
                  <a
                    href="${escapeHTML(amazon)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >Amazon</a>
                `
                : ""
            }
          </div>
        `;

        if (validVideoId) {
          card.querySelector(".cover-button").addEventListener("click", () => {
            openVideo(validVideoId);
          });
        }

        gallery.appendChild(card);
      });

      moreButton.hidden = items.length <= visibleCount;
      moreButton.textContent = isSingle
        ? "WEITERE SONGS ANZEIGEN"
        : "WEITERE ALBEN ANZEIGEN";
    }

    moreButton.addEventListener("click", () => {
      visibleCount += 10;
      renderMusic();
    });

    fetch("songs.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("songs.json nicht gefunden");
        }

        return response.json();
      })
      .then(data => {
        allMusic = Array.isArray(data) ? data : [];
        chooseCategory("single");
      })
      .catch(error => {
        gallery.innerHTML = `
          <div class="empty-message">
            Die Musikdaten konnten nicht geladen werden.
          </div>
        `;

        console.error(error);
      });

    /* Initiale Position */
    requestAnimationFrame(() => {
      positionCrossfader("single");
    });
  </script>
</body>
</html>
