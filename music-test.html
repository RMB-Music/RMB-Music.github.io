
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.M.B. | MUSIC TEST</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #101720;
  --card: #1c2530;
  --line: #304052;
  --blue: #82d2ff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
}

body {
  font-family: Arial, sans-serif;
  color: #e6edf7;
  overflow-x: hidden;
}

button, input { font: inherit; }

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

/* MUSIC UND FRANKFURTER SKYLINE */

.music-hero {
  position: relative;
  overflow: hidden;
  text-align: center;
  background: var(--bg);
}

.music-hero::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 530px;
  pointer-events: none;
  background: radial-gradient(
    ellipse at 50% 45%,
    rgba(56,94,135,.14),
    transparent 72%
  );
}

.music-composition {
  position: relative;
  width: 100%;
  height: clamp(190px,21vw,280px);
  isolation: isolate;
}

.skyline {
  position: absolute;
  left: 0;
  bottom: -68px;
  z-index: 0;
  width: 100%;
  height: auto;
  display: block;
  opacity: .28;
  filter: brightness(0) invert(1);
  pointer-events: none;
}

.music-heading {
  position: absolute;
  left: 50%;
  top: clamp(14px,1.8vw,28px);
  transform: translateX(-50%);
  z-index: 2;
  width: min(720px,92%);
  height: auto;
  mix-blend-mode: screen;
  filter: drop-shadow(
    0 0 10px rgba(95,165,255,.18)
  );
  pointer-events: none;
}

/* DJ-AUFBAU */

.dj-setup {
  --device-height: 260px;
  position: relative;
  z-index: 5;
  width: min(1360px,98%);
  margin: 6px auto 0;
  display: grid;
  grid-template-columns:
    minmax(0,330px)
    minmax(0,1fr)
    minmax(0,330px);
  gap: 10px;
  align-items: stretch;
}

.music-style-top {
  position: absolute;
  left: 50%;
  top: -31px;
  z-index: 8;
  transform: translateX(-50%);
  margin: 0;
  color: #b9d3ee;
  font: 11px Michroma,Arial,sans-serif;
  letter-spacing: 2px;
  white-space: nowrap;
  text-shadow:
    0 0 8px rgba(126,200,255,.24);
  pointer-events: none;
}

/* TURNTABLES */

.turntable,
.mixer {
  position: relative;
  min-width: 0;
  width: 100%;
  height: var(--device-height);
  overflow: hidden;
  border-radius: 6px;
  box-shadow:
    0 8px 20px rgba(0,0,0,.45);
}

.turntable {
  border: 1px solid #667b91;
  background: #cbd5df;
}

.turntable-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

/* MIXER */

.mixer {
  padding: 9px 12px 7px;
  border: 1px solid #708299;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.12),
      transparent 30%
    ),
    linear-gradient(
      170deg,
      #35485a,
      #222f3f 38%,
      #111923
    );

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.25),
    inset 0 -3px 6px rgba(0,0,0,.5),
    0 8px 20px rgba(0,0,0,.45);
}

.mixer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  height: 19px;
  margin-bottom: 5px;
  color: #bfcedd;
  font: 8px Michroma,Arial,sans-serif;
  white-space: nowrap;
}

.power-indicator {
  display: inline-flex;
  gap: 5px;
  align-items: center;
}

.power-led {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #82d2ff;
  box-shadow: 0 0 8px #6bc5ff;
}

.mixer-panel {
  display: grid;
  grid-template-columns:
    minmax(0,76px)
    minmax(0,1fr)
    minmax(0,76px);
  gap: 9px;
  height: calc(100% - 91px);
  min-width: 0;
}

/* EQ */

.eq-panel {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  gap: 3px;
  min-width: 0;
  padding: 5px;
  border: 1px solid #405265;
  border-radius: 4px;
  background: rgba(6,13,20,.23);
}

.eq-title {
  color: #abc1d5;
  font: 7px Michroma,Arial,sans-serif;
}

.eq-row {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}

.eq-knob {
  position: relative;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid #8d9fb0;
  background: conic-gradient(
    #263c51,
    #e2eaf1,
    #687f94,
    #c0ccd8,
    #263c51
  );
  box-shadow:
    0 2px 3px rgba(0,0,0,.5),
    inset 0 1px 2px #ffffffaa;
}

.eq-knob::after {
  content: "";
  position: absolute;
  left: calc(50% - 1px);
  top: 1px;
  width: 2px;
  height: 6px;
  background: #172432;
}

.eq-name {
  color: #acbed0;
  font: 7px Michroma,Arial,sans-serif;
}

/* VU-METER */

.mixer-center {
  display: grid;
  grid-template-columns:
    11px minmax(0,1fr) 11px;
  gap: 5px;
  min-width: 0;
}

.vu-meter {
  display: flex;
  flex-direction: column-reverse;
  gap: 2px;
  padding: 4px 1px;
  background: #080e14;
  border: 1px solid #405063;
  border-radius: 3px;
}

.vu-led {
  flex: 1;
  min-height: 2px;
  background: #14241f;
  opacity: .28;
  border-radius: 1px;
}

.vu-led.green { --lit: #3dec83; }
.vu-led.yellow { --lit: #efdb54; }
.vu-led.red { --lit: #ff6a60; }

.vu-led.on {
  background: var(--lit);
  opacity: 1;
  box-shadow: 0 0 4px var(--lit);
}

/* FÜNF FLACHBAHNREGLER */

.mixer-channels {
  display: grid;
  grid-template-columns:
    repeat(5,minmax(0,1fr));
  gap: 5px;
  min-width: 0;
}

.mixer-channel {
  position: relative;
  min-width: 0;
  border: 1px solid #3c4e61;
  border-radius: 3px;
  background: linear-gradient(
    90deg,
    #192532,
    #304356 50%,
    #182532
  );
}

.fader-track {
  position: absolute;
  inset: 4px 2px;
}

.fader-track::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  border-radius: 4px;
  background: #060b11;
}

/* Identische Fadergriffe: Höhe = doppelte Breite */

.fader-handle {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);

  width: min(60px,calc(100% - 2px));
  aspect-ratio: 1 / 2;
  height: auto;
  min-height: 0;

  display: flex;
  align-items: flex-start;
  justify-content: center;

  padding: 15px 1px 0;

  border: 1px solid #eef5fc;
  border-radius: 4px;

  background: linear-gradient(
    90deg,
    #92a9bc 0%,
    #f0f5fa 13%,
    #c5d4e2 45%,
    #839bb0 85%,
    #dfeaf3 100%
  );

  color: #1b3043;
  font: clamp(5px,.49vw,7px)
        Michroma,Arial,sans-serif;
  font-weight: bold;
  letter-spacing: -.4px;
  white-space: nowrap;

  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;

  box-shadow:
    0 4px 6px rgba(0,0,0,.65),
    inset 0 1px 1px #fff;

  will-change: top;
}

/* Rillen im metallischen Fadergriff */

.fader-handle::after {
  content: "";
  position: absolute;
  top: 44%;
  left: 15%;
  width: 70%;
  height: 27%;

  border-top: 2px solid #70889e;
  border-bottom: 2px solid #70889e;

  background: repeating-linear-gradient(
    to bottom,
    transparent 0 4px,
    #536d82 4px 6px,
    #dce6ef 6px 9px
  );

  box-shadow:
    inset 0 1px rgba(255,255,255,.65);
  border-radius: 2px;
}

.fader-handle.dragging {
  cursor: grabbing;
}

.fader-handle.returning {
  transition: top .22s ease-out;
}

.fader-handle[aria-current="page"] {
  border-color: #9dd9ff;
  box-shadow:
    0 4px 6px #000,
    0 0 9px rgba(105,177,255,.4);
}

/* SLIDE ME – PULSIEREND */

.slide-me {
  position: absolute;
  z-index: 4;
  left: 50%;
  bottom: 36px;
  transform: translateX(-50%);
  margin: 0;

  color: #c9eaff;
  font: 8px Michroma,Arial,sans-serif;
  letter-spacing: 1.3px;
  line-height: 1;
  white-space: nowrap;
  pointer-events: none;

  text-shadow:
    0 0 3px #fff,
    0 0 7px #82d2ff,
    0 0 12px rgba(107,197,255,.5);

  animation:
    slidePulse 2s ease-in-out infinite;
}

@keyframes slidePulse {
  0%,100% {
    opacity: .55;
    text-shadow: 0 0 3px #82d2ff;
  }

  50% {
    opacity: 1;
    text-shadow:
      0 0 3px #fff,
      0 0 9px #82d2ff,
      0 0 18px #6bc5ff;
  }
}

/* CROSSFADER */

.crossfader-section {
  position: absolute;
  left: 50%;
  bottom: 6px;
  transform: translateX(-50%);
  width: min(80%,460px);
  margin: 0;
}

.crossfader-labels {
  display: flex;
  justify-content: space-between;
  margin-bottom: 5px;
  color: #9cb2c7;
  font: 8px Michroma,Arial,sans-serif;
  letter-spacing: 1px;
}

.crossfader-labels .active {
  color: #e2f6ff;
  text-shadow:
    0 0 3px #fff,
    0 0 7px #82d2ff,
    0 0 14px #6bc5ff,
    0 0 22px rgba(107,197,255,.65);
}

.crossfader-slider {
  display: block;
  width: 100%;
  height: 20px;
  margin: 0;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  cursor: ew-resize;
  touch-action: pan-y;
}

.crossfader-slider::-webkit-slider-runnable-track {
  height: 7px;
  border-radius: 5px;
  border: 1px solid #51677b;
  background: #090f17;

  box-shadow:
    inset 0 1px 3px #000,
    0 1px 1px #7a8ca0;
}

.crossfader-slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 38px;
  height: 18px;
  margin-top: -7px;
  border: 1px solid #e5edf4;
  border-radius: 3px;

  background: linear-gradient(
    #eff4f8,
    #aebfd0 48%,
    #71879d
  );

  box-shadow:
    0 3px 5px #000,
    inset 0 1px 1px #fff;
}

.crossfader-slider::-moz-range-track {
  height: 7px;
  border-radius: 5px;
  background: #090f17;
}

.crossfader-slider::-moz-range-thumb {
  width: 38px;
  height: 18px;
  border-radius: 3px;
  border: 1px solid #e5edf4;
  background: #aebfd0;
}

.crossfader-title {
  display: block;
  color: #7f9ab1;
  font: 7px Michroma,Arial,sans-serif;
  letter-spacing: 1px;
  text-align: center;
}

/* LED-LICHTLEISTE */

.led-display-wrap {
  position: relative;
  z-index: 6;
  width: min(1360px,98%);
  margin: 12px auto 0;
}

.led-display {
  position: relative;
  width: 100%;
  padding: 8px 12px;
  overflow: hidden;

  border: 1px solid rgba(170,210,250,.55);
  border-radius: 10px;

  background:
    linear-gradient(
      180deg,
      rgba(215,235,255,.12),
      rgba(40,65,95,.1)
    ),
    #142231;

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.24),
    inset 0 -1px 2px rgba(0,0,0,.45),
    0 0 15px rgba(110,185,255,.14);
}

.led-canvas {
  position: relative;
  display: block;
  width: 100%;
  height: 80px;

  border: 1px solid #344e69;
  border-radius: 7px;
  background: #07111b;
}

/* MUSIKCOVER */

.content {
  max-width: 1400px;
  margin: 0 auto;
  padding: 14px 24px 75px;
  text-align: center;
  background: var(--bg);
}

.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px;
}

.music-card {
  width: min(220px,100%);
  min-width: 180px;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: transform .2s;
}

.music-card:hover {
  transform: translateY(-4px);
}

.cover-button {
  display: block;
  width: 100%;
  padding: 0;
  background: none;
  border: 0;
  cursor: pointer;
}

.cover-button:disabled {
  cursor: default;
}

.cover {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: #090d13;
  border-radius: 7px;
}

.track-title {
  margin: 14px 0 5px;
  font-size: 14px;
  font-weight: bold;
  line-height: 1.5;
}

.track-version {
  margin-bottom: 8px;
  color: #9bafc5;
  font-size: 12px;
}

.track-date {
  margin-bottom: 10px;
  color: #8197ae;
  font-size: 11px;
}

.music-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.music-links a {
  padding: 8px 10px;
  background: #293d53;
  border-radius: 6px;
  color: #d6e9fc;
  text-decoration: none;
  font-size: 11px;
}

.music-links a:hover {
  background: #405c78;
}

.empty-message {
  width: min(420px,100%);
  padding: 38px 18px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: #aebfd2;
}

.more-button {
  margin-top: 35px;
  padding: 13px 22px;
  background: #263c52;
  border: 1px solid #6587aa;
  border-radius: 7px;
  color: white;
  font: 10px Michroma,Arial,sans-serif;
  cursor: pointer;
}

.more-button[hidden] {
  display: none;
}

/* VIDEOFENSTER */

.video-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  padding: 25px;
  background: rgba(0,0,0,.94);
  align-items: center;
  justify-content: center;
}

.video-modal.open {
  display: flex;
}

.video-window {
  position: relative;
  width: min(900px,100%);
}

.video-frame {
  width: 100%;
  aspect-ratio: 16/9;
  border: 0;
  background: black;
}

.close-video {
  position: absolute;
  right: 0;
  top: -48px;
  border: 0;
  background: none;
  color: white;
  font-size: 34px;
  cursor: pointer;
}

footer {
  padding: 30px 15px 35px;
  background: var(--bg);
  color: #7d91a7;
  text-align: center;
  font-size: 12px;
}

/* TABLET */

@media(max-width:1120px) {
  .dj-setup {
    grid-template-columns:
      minmax(0,25%)
      minmax(0,1fr)
      minmax(0,25%);
    --device-height: clamp(195px,23.2vw,260px);
    gap: 7px;
  }

  .mixer {
    padding: 7px 8px;
  }

  .mixer-panel {
    grid-template-columns:
      minmax(0,57px)
      minmax(0,1fr)
      minmax(0,57px);
    gap: 5px;
    height: calc(100% - 82px);
  }

  .eq-knob {
    width: 15px;
    height: 15px;
  }

  .eq-name {
    font-size: 5px;
  }

  .mixer-channels {
    gap: 3px;
  }

  .fader-handle {
    width: min(46px,calc(100% - 2px));
    font-size: 5px;
    padding-top: 10px;
  }

  .slide-me {
    bottom: 36px;
    font-size: 7px;
  }

  .music-style-top {
    font-size: 10px;
  }
}

/* SMARTPHONE */

@media(max-width:700px) {
  .music-composition {
    height: 178px;
  }

  .music-heading {
    top: 18px;
    width: 94%;
  }

  .skyline {
    bottom: -30px;
    opacity: .24;
  }

  .dj-setup {
    width: min(470px,96%);
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap: 10px;
    --device-height: 170px;
  }

  .music-style-top {
    top: -24px;
    font-size: 8px;
    letter-spacing: 1px;
  }

  .mixer {
    grid-column: 1/-1;
    grid-row: 1;
    height: 260px;
    padding: 9px;
  }

  .turntable.single {
    grid-column: 1;
    grid-row: 2;
  }

  .turntable.album {
    grid-column: 2;
    grid-row: 2;
  }

  .mixer-panel {
    grid-template-columns:
      65px minmax(0,1fr) 65px;
    height: calc(100% - 91px);
  }

  .eq-name {
    font-size: 6px;
  }

  .mixer-channels {
    gap: 4px;
  }

  .fader-handle {
    width: min(52px,calc(100% - 2px));
    font-size: 6px;
    padding-top: 12px;
  }

  .slide-me {
    bottom: 36px;
    font-size: 7px;
  }

  .led-display-wrap {
    width: min(470px,96%);
  }

  .led-canvas {
    height: 65px;
  }

  .content {
    padding: 12px 12px 65px;
  }

  .gallery {
    gap: 12px;
  }

  .music-card {
    width: calc(50% - 6px);
    min-width: 150px;
    padding: 9px;
  }
}

@media(max-width:420px) {
  .mixer-header {
    font-size: 6px;
  }

  .mixer-panel {
    grid-template-columns:
      51px minmax(0,1fr) 51px;
    gap: 3px;
  }

  .eq-row {
    gap: 3px;
  }

  .eq-knob {
    width: 13px;
    height: 13px;
  }

  .eq-name {
    font-size: 5px;
  }

  .fader-handle {
    width: min(38px,calc(100% - 1px));
    font-size: 4.7px;
    padding-top: 9px;
    letter-spacing: -.5px;
  }

  .crossfader-section {
    width: 85%;
  }

  .music-card {
    width: 100%;
  }
}

@media(prefers-reduced-motion:reduce) {
  .slide-me {
    animation: none;
    opacity: 1;
  }

  .fader-handle.returning {
    transition: none;
  }
}
</style>
</head>

<body>

<section class="music-hero">

  <div class="music-composition">
    <img
      class="skyline"
      src="images/frankfurt-skyline.png"
      alt=""
    >

    <img
      class="music-heading"
      src="images/music-schriftzug.png"
      alt="MUSIC – THE SOUND OF R.M.B."
    >
  </div>

  <div class="dj-setup">

    <p class="music-style-top">
      90s Eurodance · EDM · Trance
    </p>

    <!-- LINKER PLATTENSPIELER -->

    <div class="turntable single">
      <img
        class="turntable-image"
        src="images/2DC1E1DB-FFB5-42D1-88F9-EE3AD793EF8D.png"
        alt="Bausys-tem Turntable links"
      >
    </div>

    <!-- MISCHPULT -->

    <div class="mixer">

      <div class="mixer-header">
        <span>R.M.B. · 5 CHANNEL DJ MIXER</span>

        <span class="power-indicator">
          <span class="power-led"></span>
          POWER
        </span>
      </div>

      <div class="mixer-panel">

        <!-- EQ LINKS -->

        <div class="eq-panel">
          <span class="eq-title">CH A</span>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">GAIN</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">HIGH</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">MID</span>
          </div>

          <div class="eq-row">
            <span class="eq-knob"></span>
            <span class="eq-name">BASS</span>
          </div>
        </div>

        <!-- MENÜFADER -->

        <div class="mixer-center">

          <div
            class="vu-meter"
            id="vuLeft"
            aria-hidden="true"
          ></div>

          <nav
            class="mixer-channels"
            aria-label="DJ-Mischpult Navigation"
          >

            <div class="mixer-channel">
              <div class="fader-track">
                <button
                  type="button"
                  class="fader-handle"
                  data-url="index.html"
                  aria-label="HOME nach oben schieben"
                >HOME</button>
              </div>
            </div>

            <div class="mixer-channel">
              <div class="fader-track">
                <button
                  type="button"
                  class="fader-handle"
                  data-url="music-test.html"
                  aria-current="page"

<script>

/* =========================
   GEGENLÄUFIGE MENÜFADER
========================= */

const faders = [
  ...document.querySelectorAll(
    '.fader-handle'
  )
];

const activeFader =
  document.querySelector(
    '.fader-handle[aria-current="page"]'
  );

let dragging = null;
let navigationStarted = false;

const clamp = (n,low,high) =>
  Math.min(high,Math.max(low,n));

function maxTravel(handle) {
  return Math.max(
    0,
    handle.parentElement.clientHeight -
    handle.offsetHeight
  );
}

function faderPosition(handle,progress) {
  const travel = maxTravel(handle);

  handle.style.top =
    (
      travel *
      (1-clamp(progress,0,1))
    ) + 'px';
}

/* Grundstellung:
   MUSIC oben, alle anderen unten */

function initializeFaders() {
  if (dragging) return;

  faders.forEach(handle => {
    handle.classList.remove('returning');

    faderPosition(
      handle,
      handle === activeFader ? 1 : 0
    );
  });
}

/* Vorzeitig losgelassen:
   beide fahren wieder zurück */

function restoreFaders() {
  faders.forEach(handle =>
    handle.classList.add('returning')
  );

  faders.forEach(handle =>
    faderPosition(
      handle,
      handle === activeFader ? 1 : 0
    )
  );
}

/* Erst am vollständigen
   oberen Anschlag navigieren */

function finishNavigation(handle) {
  if (
    navigationStarted ||
    handle === activeFader
  ) return;

  navigationStarted = true;

  faderPosition(handle,1);
  faderPosition(activeFader,0);

  window.location.assign(
    handle.dataset.url
  );
}

/* Bewegungen koppeln */

function moveHandle(event) {
  if (
    !dragging ||
    dragging.pointerId !== event.pointerId
  ) return;

  const {handle,startY} = dragging;

  const travel = maxTravel(handle);

  if (travel <= 0) return;

  const delta =
    event.clientY-startY;

  const progress =
    handle === activeFader
      ? clamp(1-delta/travel,0,1)
      : clamp(-delta/travel,0,1);

  faderPosition(handle,progress);

  if (handle !== activeFader) {

    /* Aktiver Regler bewegt sich
       synchron nach unten */

    faderPosition(
      activeFader,
      1-progress
    );

    if (progress >= 1) {
      finishNavigation(handle);
    }
  }
}

/* Loslassen */

function releaseHandle(event) {
  if (
    !dragging ||
    dragging.pointerId !== event.pointerId
  ) return;

  const handle = dragging.handle;

  dragging = null;

  handle.classList.remove('dragging');

  if (!navigationStarted) {
    restoreFaders();
  }
}

/* Ereignisse an alle fünf Regler */

faders.forEach(handle => {

  handle.addEventListener(
    'pointerdown',
    event => {

      if (
        navigationStarted ||
        dragging ||
        (
          event.pointerType === 'mouse' &&
          event.button !== 0
        )
      ) return;

      event.preventDefault();

      faders.forEach(h =>
        h.classList.remove('returning')
      );

      dragging = {
        handle,
        pointerId: event.pointerId,
        startY: event.clientY
      };

      handle.classList.add('dragging');

      handle.setPointerCapture(
        event.pointerId
      );
    }
  );

  handle.addEventListener(
    'pointermove',
    moveHandle
  );

  handle.addEventListener(
    'pointerup',
    releaseHandle
  );

  handle.addEventListener(
    'pointercancel',
    releaseHandle
  );

  handle.addEventListener(
    'lostpointercapture',
    () => {
      if (
        dragging?.handle === handle
      ) {
        dragging = null;

        handle.classList.remove(
          'dragging'
        );

        if (!navigationStarted) {
          restoreFaders();
        }
      }
    }
  );

  handle.addEventListener(
    'keydown',
    event => {

      if (
        (
          event.key === 'Enter' ||
          event.key === 'ArrowUp'
        ) &&
        handle !== activeFader
      ) {
        event.preventDefault();
        finishNavigation(handle);
      }
    }
  );
});

window.addEventListener(
  'load',
  initializeFaders
);

window.addEventListener(
  'resize',
  initializeFaders
);

requestAnimationFrame(
  initializeFaders
);

/* =========================
   VU-METER
========================= */

function createMeter(id) {

  const meter =
    document.getElementById(id);

  return Array.from(
    {length:14},
    (_,i) => {

      const led =
        document.createElement('span');

      led.className =
        'vu-led ' +
        (
          i < 8
            ? 'green'
            : i < 11
              ? 'yellow'
              : 'red'
        );

      meter.appendChild(led);

      return led;
    }
  );
}

const leftLeds =
  createMeter('vuLeft');

const rightLeds =
  createMeter('vuRight');

let leftLevel = 6;
let rightLevel = 7;

function animateMeters() {
  if (document.hidden) return;

  leftLevel = clamp(
    leftLevel +
    Math.floor(Math.random()*7)-3,
    2,
    14
  );

  rightLevel = clamp(
    rightLevel +
    Math.floor(Math.random()*7)-3,
    2,
    14
  );

  leftLeds.forEach((led,i) =>
    led.classList.toggle(
      'on',
      i < leftLevel
    )
  );

  rightLeds.forEach((led,i) =>
    led.classList.toggle(
      'on',
      i < rightLevel
    )
  );
}

animateMeters();

const reduceMotion =
  window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

if (!reduceMotion) {
  setInterval(animateMeters,170);
}

/* =========================
   CROSSFADER
========================= */

const crossfader =
  document.getElementById('crossfader');

const singleLabel =
  document.getElementById('singleLabel');

const albumLabel =
  document.getElementById('albumLabel');

let activeCategory = 'single';
let allMusic = [];
let visibleCount = 10;

function chooseCategory(category) {

  if (category === activeCategory) {
    return;
  }

  activeCategory = category;
  visibleCount = 10;

  singleLabel.classList.toggle(
    'active',
    category === 'single'
  );

  albumLabel.classList.toggle(
    'active',
    category === 'album'
  );

  updateLEDMessage(category);
  renderMusic();
}

crossfader.addEventListener(
  'input',
  () => {
    chooseCategory(
      Number(crossfader.value) < 50
        ? 'single'
        : 'album'
    );
  }
);

crossfader.addEventListener(
  'change',
  () => {

    const isSingle =
      Number(crossfader.value) < 50;

    crossfader.value =
      isSingle ? '0' : '100';

    chooseCategory(
      isSingle ? 'single' : 'album'
    );
  }
);

/* =========================
   LED-MATRIX
========================= */

const ledCanvas =
  document.getElementById('ledCanvas');

const ctx =
  ledCanvas.getContext('2d');

const FONT = {

  A: [
    '01110','10001','10001',
    '11111','10001','10001','10001'
  ],

  B: [
    '11110','10001','10001',
    '11110','10001','10001','11110'
  ],

  C: [
    '01111','10000','10000',
    '10000','10000','10000','01111'
  ],

  D: [
    '11110','10001','10001',
    '10001','10001','10001','11110'
  ],

  E: [
    '11111','10000','10000',
    '11110','10000','10000','11111'
  ],

  G: [
    '01111','10000','10000',
    '10111','10001','10001','01111'
  ],

  H: [
    '10001','10001','10001',
    '11111','10001','10001','10001'
  ],

  I: [
    '11111','00100','00100',
    '00100','00100','00100','11111'
  ],

  L: [
    '10000','10000','10000',
    '10000','10000','10000','11111'
  ],

  M: [
    '10001','11011','10101',
    '10101','10001','10001','10001'
  ],

  N: [
    '10001','11001','10101',
    '10011','10001','10001','10001'
  ],

  O: [
    '01110','10001','10001',
    '10001','10001','10001','01110'
  ],

  P: [
    '11110','10001','10001',
    '11110','10000','10000','10000'
  ],

  R: [
    '11110','10001','10001',
    '11110','10100','10010','10001'
  ],

  S: [
    '01111','10000','10000',
    '01110','00001','00001','11110'
  ],

  T: [
    '11111','00100','00100',
    '00100','00100','00100','00100'
  ],

  U: [
    '10001','10001','10001',
    '10001','10001','10001','01110'
  ],

  Y: [
    '10001','10001','01010',
    '00100','00100','00100','00100'
  ],

  ' ': [
    '00000','00000','00000',
    '00000','00000','00000','00000'
  ],

  '·': [
    '00000','00000','00100',
    '00000','00100','00000','00000'
  ]
};

let ledColumns = [];
let ledPosition = 0;
let ledDirection = 1;
let ledLastTime = 0;
let ledPitch = 8;
let ledTextWidth = 0;

const LED_SPEED = 85;

/* Text in LED-Spalten */

function buildLEDText(text) {

  const cols = [];

  for (
    const ch of text.toUpperCase()
  ) {

    const pattern =
      FONT[ch] || FONT[' '];

    for (let c=0;c<5;c++) {

      cols.push(
        Array.from(
          {length:7},
          (_,r) =>
            pattern[r][c] === '1'
        )
      );
    }

    cols.push(
      [false,false,false,false,false,false,false]
    );
  }

  return cols;
}

/* Punktgröße anhand der Breite */

function calculateLEDLayout() {

  const width =
    ledCanvas.clientWidth;

  const height =
    ledCanvas.clientHeight;

  ledPitch = Math.min(
    9.4,
    (height-16)/7,
    Math.max(1,(width-24)*.75) /
      Math.max(1,ledColumns.length)
  );

  ledTextWidth =
    ledPitch * ledColumns.length;

  ledPosition = clamp(
    ledPosition,
    0,
    Math.max(
      0,
      width-24-ledTextWidth
    )
  );
}

/* SINGLE / ALBUM */

function updateLEDMessage(category) {

  const text =
    category === 'single'
      ? 'SINGLE · THE SINGLE COLLECTION'
      : 'ALBUM · THE ALBUM COLLECTION';

  ledCanvas.setAttribute(
    'aria-label',
    text
  );

  ledColumns =
    buildLEDText(text);

  ledPosition = 0;
  ledDirection = 1;

  calculateLEDLayout();
}

/* Canvas-Größe */

function resizeLEDCanvas() {

  const rect =
    ledCanvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  ledCanvas.width =
    Math.round(rect.width*dpr);

  ledCanvas.height =
    Math.round(rect.height*dpr);

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  calculateLEDLayout();
}

/* Einzelne LED */

function dot(x,y,r,color,glow=false) {

  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);

  ctx.fillStyle = color;

  if (glow) {
    ctx.shadowBlur =
      Math.max(3,ledPitch*1.1);

    ctx.shadowColor = '#65bdff';
  }

  ctx.fill();
  ctx.shadowBlur = 0;
}

/* Gesamte LED-Matrix zeichnen */

function drawLED(time) {

  const width =
    ledCanvas.clientWidth;

  const height =
    ledCanvas.clientHeight;

  ctx.clearRect(0,0,width,height);

  ctx.fillStyle = '#07111b';
  ctx.fillRect(0,0,width,height);

  const padding = 12;

  const startY =
    (height-7*ledPitch)/2;

  const radius =
    Math.max(.35,ledPitch*.29);

  const columnsVisible =
    Math.floor(
      (width-2*padding)/ledPitch
    );

  const startX =
    padding+ledPosition;

  /* Vollständiges Raster
     aus ausgeschalteten LEDs */

  for (
    let c=0;
    c<=columnsVisible;
    c++
  ) {

    const x =
      padding+(c+.5)*ledPitch;

    if (x>width-padding) break;

    for (let row=0;row<7;row++) {

      dot(
        x,
        startY+(row+.5)*ledPitch,
        radius,
        'rgba(125,165,205,0.15)'
      );
    }
  }

  /* Helle Buchstaben auf dem
     festen LED-Raster */

  const startColumn =
    Math.round(
      (startX-padding)/ledPitch
    );

  for (
    let c=0;
    c<ledColumns.length;
    c++
  ) {

    const displayColumn =
      startColumn+c;

    if (
      displayColumn<0 ||
      displayColumn>columnsVisible
    ) continue;

    const x =
      padding+
      (displayColumn+.5)*ledPitch;

    if (x>width-padding) continue;

    for (let row=0;row<7;row++) {

      if (ledColumns[c][row]) {

        dot(
          x,
          startY+(row+.5)*ledPitch,
          radius,
          '#d9f2ff',
          true
        );
      }
    }
  }

  /* Pendelbewegung */

  if (
    !reduceMotion &&
    !document.hidden &&
    ledLastTime
  ) {

    const delta = Math.min(
      .05,
      (time-ledLastTime)/1000
    );

    const maxPosition =
      Math.max(
        0,
        width-24-ledTextWidth
      );

    ledPosition +=
      LED_SPEED*
      delta*
      ledDirection;

    if (ledPosition>=maxPosition) {
      ledPosition = maxPosition;
      ledDirection = -1;
    }

    if (ledPosition<=0) {
      ledPosition = 0;
      ledDirection = 1;
    }
  }

  ledLastTime = time;

  requestAnimationFrame(drawLED);
}

updateLEDMessage('single');
resizeLEDCanvas();
requestAnimationFrame(drawLED);

window.addEventListener(
  'resize',
  resizeLEDCanvas
);

/* =========================
   SONGS.JSON UND GALERIE
========================= */

const gallery =
  document.getElementById('gallery');

const moreButton =
  document.getElementById('moreButton');

const videoModal =
  document.getElementById('videoModal');

const videoFrame =
  document.getElementById('videoFrame');

const closeVideo =
  document.getElementById('closeVideo');

function escapeHTML(value) {
  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function safeURL(value) {
  try {
    const u = new URL(
      value,
      location.href
    );

    return ['https:','http:']
      .includes(u.protocol)
      ? u.href
      : '';
  } catch {
    return '';
  }
}

function formatDate(value) {
  if (!value) return '';

  const date = new Date(
    String(value).slice(0,10)+
    'T12:00:00'
  );

  return isNaN(date.getTime())
    ? ''
    : date.toLocaleDateString(
        'de-DE',
        {
          day:'2-digit',
          month:'2-digit',
          year:'numeric'
        }
      );
}

function categoryOf(item) {
  const category = String(
    item.type ||
    item.category ||
    'single'
  ).toLowerCase();

  return [
    'album','albums','lp'
  ].includes(category)
    ? 'album'
    : 'single';
}

function getYoutubeId(item) {

  const value =
    String(item.youtube||'').trim();

  if (
    /^[A-Za-z0-9_-]{11}$/.test(value)
  ) return value;

  try {
    const url = new URL(value);
    const host =
      url.hostname.toLowerCase();

    if (
      ['youtu.be','www.youtu.be']
        .includes(host)
    ) {
      return url.pathname.split('/')[1]||'';
    }

    if (
      [
        'youtube.com',
        'www.youtube.com',
        'm.youtube.com'
      ].includes(host)
    ) {
      if (url.pathname==='/watch') {
        return url.searchParams.get('v')||'';
      }

      const parts =
        url.pathname.split('/');

      if (
        ['shorts','embed','live']
          .includes(parts[1])
      ) {
        return parts[2]||'';
      }
    }
  } catch {}

  return '';
}

/* VIDEOFENSTER */

function openVideo(id) {

  if (
    !/^[A-Za-z0-9_-]{11}$/.test(id)
  ) return;

  videoFrame.src =
    'https://www.youtube-nocookie.com/embed/' +
    id +
    '?autoplay=1';

  videoModal.classList.add('open');
}

function closeVideoPlayer() {
  videoModal.classList.remove('open');
  videoFrame.src = '';
}

closeVideo.addEventListener(
  'click',
  closeVideoPlayer
);

videoModal.addEventListener(
  'click',
  e => {
    if (e.target===videoModal) {
      closeVideoPlayer();
    }
  }
);

document.addEventListener(
  'keydown',
  e => {
    if (e.key==='Escape') {
      closeVideoPlayer();
    }
  }
);

/* MUSIKCOVER DARSTELLEN */

function renderMusic() {

  const isSingle =
    activeCategory==='single';

  const items = allMusic
    .filter(item =>
      categoryOf(item)===activeCategory
    )
    .sort((a,b) =>
      String(b.releaseDate||'')
        .localeCompare(
          String(a.releaseDate||'')
        )
    );

  gallery.innerHTML = '';

  if (!items.length) {

    gallery.innerHTML =
      '<div class="empty-message">' +
      (
        isSingle
          ? 'Hier erscheinen deine R.M.B.-Singles.'
          : 'Hier erscheinen deine R.M.B.-Alben.'
      ) +
      '</div>';

    moreButton.hidden = true;
    return;
  }

  items
    .slice(0,visibleCount)
    .forEach(item => {

      const id =
        getYoutubeId(item);

      const valid =
        /^[A-Za-z0-9_-]{11}$/.test(id)
          ? id
          : '';

      const cover =
        safeURL(item.cover) ||
        (
          valid
            ? 'https://img.youtube.com/vi/' +
              valid +
              '/hqdefault.jpg'
            : ''
        );

      const spotify =
        safeURL(item.spotify);

      const amazon =
        safeURL(item.amazon);

      const date =
        formatDate(item.releaseDate);

      const card =
        document.createElement('article');

      card.className = 'music-card';

      card.innerHTML = `
        <button
          type="button"
          class="cover-button"
          ${valid?'':'disabled'}
          aria-label="Video öffnen"
        >
          <img
            class="cover"
            src="${escapeHTML(cover)}"
            alt="${escapeHTML(item.title||'R.M.B.')}"
            loading="lazy"
          >
        </button>

        <div class="track-title">
          ${escapeHTML(item.title||'R.M.B.')}
        </div>

        <div class="track-version">
          ${escapeHTML(item.version||'')}
        </div>

        ${
          date
            ? `<div class="track-date">
                 ${escapeHTML(date)}
               </div>`
            : ''
        }

        <div class="music-links">
          ${
            valid
              ? `<a
                   href="https://www.youtube.com/watch?v=${valid}"
                   target="_blank"
                   rel="noopener noreferrer"
                 >YouTube</a>`
              : ''
          }

          ${
            spotify
              ? `<a
                   href="${escapeHTML(spotify)}"
                   target="_blank"
                   rel="noopener noreferrer"
                 >Spotify</a>`
              : ''
          }

          ${
            amazon
              ? `<a
                   href="${escapeHTML(amazon)}"
                   target="_blank"
                   rel="noopener noreferrer"
                 >Amazon</a>`
              : ''
          }
        </div>
      `;

      if (valid) {
        card.querySelector(
          '.cover-button'
        ).addEventListener(
          'click',
          () => openVideo(valid)
        );
      }

      gallery.appendChild(card);
    });

  moreButton.hidden =
    items.length<=visibleCount;

  moreButton.textContent =
    isSingle
      ? 'WEITERE SONGS ANZEIGEN'
      : 'WEITERE ALBEN ANZEIGEN';
}

moreButton.addEventListener(
  'click',
  () => {
    visibleCount+=10;
    renderMusic();
  }
);

/* MUSIKDATEN LADEN */

fetch('songs.json')
  .then(r => {
    if (!r.ok) {
      throw new Error(
        'songs.json nicht gefunden'
      );
    }

    return r.json();
  })
  .then(data => {
    allMusic =
      Array.isArray(data)
        ? data
        : [];

    renderMusic();
  })
  .catch(error => {
    gallery.innerHTML =
      '<div class="empty-message">' +
      'Die Musikdaten konnten nicht geladen werden.' +
      '</div>';

    console.error(error);
  });

</script>
</body>
</html>
