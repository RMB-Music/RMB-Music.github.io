
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.M.B. | MUSIC TEST</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>

/* GRUNDEINSTELLUNGEN */

:root {
  --background: #101720;
  --card: #1c2530;
  --silver: #b8c8db;
  --line: #304052;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--background);
}

body {
  color: #e6edf7;
  font-family: Arial, sans-serif;
}

/* MUSIKBEREICH */
/* KEIN WEISSER R.M.B.-BANNER */

.music-hero {
  position: relative;
  overflow: hidden;
  padding: 14px 0 35px;
  background: var(--background);
  text-align: center;
}

.music-hero::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 100%;
  height: 540px;
  pointer-events: none;

  background: radial-gradient(
    ellipse,
    rgba(56, 94, 135, .15) 0%,
    rgba(30, 52, 75, .07) 45%,
    transparent 75%
  );
}

/* SKYLINE UND MUSIC */

.music-composition {
  position: relative;
  width: 100%;
  height: clamp(325px, 37vw, 475px);
  isolation: isolate;
}

/* SKYLINE */
/* AUTOMATISCH VOLLE BILDSCHIRMBREITE */

.skyline {
  position: absolute;
  z-index: 0;
  left: 0;
  bottom: 0;

  display: block;
  width: 100%;
  max-width: none;
  height: auto;

  opacity: .28;

  filter:
    brightness(0)
    invert(1);

  pointer-events: none;
}

/* MUSIC-SCHRIFTZUG */
/* UM 50 PROZENT VERGROESSERT */
/* MAXIMAL 720 PIXEL */
/* SEITENVERHAELTNIS BLEIBT ERHALTEN */

.music-heading {
  position: absolute;
  z-index: 2;

  left: 50%;
  top: clamp(122px, 12vw, 158px);

  transform: translateX(-50%);

  display: block;

  width: min(720px, 92%);
  max-width: 720px;
  height: auto;

  mix-blend-mode: screen;

  filter: drop-shadow(
    0 0 8px rgba(95, 165, 255, .15)
  );

  pointer-events: none;
}

/* GEMEINSAMES FUENF-KANAL-MISCHPULT */

.mixer-nav {
  position: absolute;
  z-index: 5;

  top: 0;
  left: 50%;

  transform: translateX(-50%);

  width: min(446px, calc(100% - 20px));

  padding: 10px 11px 12px;

  border: 1px solid #546577;
  border-radius: 9px;

  background: linear-gradient(
    160deg,
    #354250 0%,
    #202c39 42%,
    #161f29 100%
  );

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.16),
    inset 0 -2px 5px #10151d,
    0 8px 25px rgba(0,0,0,.35);
}

/* OBERER MISCHPULTBEREICH */

.mixer-top {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 5px;
  padding: 0 3px 7px;

  font-family: "Michroma", Arial, sans-serif;
  font-size: 8px;
  letter-spacing: .6px;

  color: #91a5ba;
}

/* KLEINE KONTROLLLEUCHTE */

.mixer-light {
  display: inline-block;

  width: 6px;
  height: 6px;

  border-radius: 50%;
  margin-right: 5px;

  background: #78c5ff;

  box-shadow: 0 0 8px #3b9aff;

  vertical-align: middle;
}

/* FUENF KANAELE NEBENEINANDER */

.mixer-channels {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;
}

.mixer-channel {
  display: flex;
  justify-content: center;
  align-items: center;

  height: 95px;
  min-width: 0;

  padding: 6px 2px;

  border: 1px solid #354657;
  border-radius: 4px;

  background: linear-gradient(
    90deg,
    #1b2531,
    #263342 48%,
    #18222e
  );
}

/* FUEHRUNGSSCHIENE */
/* UNGEFAEHR DOPPELT SO LANG */
/* WIE DER BEWEGLICHE FADER */

.fader-track {
  position: relative;

  height: 76px;
  width: 100%;

  display: flex;
  justify-content: center;
  align-items: center;
}

.fader-track::before {
  content: "";

  position: absolute;

  top: 4px;
  bottom: 4px;

  width: 7px;

  border-radius: 5px;

  background: linear-gradient(
    90deg,
    #06090e,
    #17202b 45%,
    #080c12
  );

  box-shadow:
    inset 1px 0 2px #000,
    1px 0 1px rgba(255,255,255,.11);
}

/* BEWEGLICHER SILBERNER SCHIEBEREGLER */

.fader-handle {
  --travel: 36px;

  position: absolute;

  top: calc(4px + var(--travel));
  left: 50%;

  transform: translate(
    -50%,
    calc(-1 * var(--drag, 0px))
  );

  width: calc(100% - 2px);
  max-width: 72px;
  height: 36px;

  padding: 0 1px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 5px;

  border: 1px solid #e4ebf4;
  border-bottom-color: #61778b;
  border-radius: 4px;

  background: linear-gradient(
    180deg,
    #f0f4f8 0%,
    #b4c3d3 17%,
    #d0dce8 45%,
    #899caf 53%,
    #b9c8d7 78%,
    #8194a8 100%
  );

  color: #162333;

  box-shadow:
    0 3px 5px rgba(0,0,0,.7),
    inset 0 1px 1px white;

  cursor: grab;
  touch-action: none;

  user-select: none;
  -webkit-user-select: none;

  font-family: "Michroma", Arial, sans-serif;
  font-size: clamp(6px, .8vw, 8px);
  font-weight: bold;
  letter-spacing: -.3px;

  white-space: nowrap;
}

/* QUERRILLE AUF DEM FADER */

.fader-handle::after {
  content: "";

  display: block;

  width: 63%;
  height: 3px;

  border-top: 1px solid #3b5167;
  border-bottom: 1px solid #f4f7fc;

  background: #70879e;
}

/* FADER WAEHREND DES SCHIEBENS */

.fader-handle.dragging {
  cursor: grabbing;

  box-shadow:
    0 4px 9px rgba(0,0,0,.75),
    0 0 12px rgba(117,184,255,.22);
}

/* AUTOMATISCHES ZURUECKGLEITEN */

.fader-handle.returning {
  transition: transform .19s ease-out;
}

.fader-handle:focus-visible {
  outline: 2px solid #78c5ff;
  outline-offset: 3px;
}

/* AKTIVER MUSIC-KANAL */

.fader-handle[aria-current="page"] {
  border-color: #8ac8ff;

  box-shadow:
    0 3px 6px #000,
    0 0 7px rgba(109,177,255,.4);
}

/* MUSIKRICHTUNGEN */

.music-style {
  position: relative;
  z-index: 3;

  margin: 10px auto 28px;

  font-size: 11px;
  letter-spacing: 2px;

  color: #adc0d6;
  text-transform: uppercase;
}

/* VINYL-AUSWAHL */

.vinyl-selector {
  position: relative;
  z-index: 3;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 65px;
  margin: 0 auto;
}

.vinyl-button {
  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 12px;
  padding: 5px;

  border: 0;
  background: transparent;

  color: #dce7f3;
  cursor: pointer;

  opacity: .76;

  transition:
    opacity .25s,
    transform .25s;
}

.vinyl-button:hover {
  opacity: 1;
  transform: translateY(-4px);
}

.vinyl-button.active {
  opacity: 1;
}

/* SINGLE KLEINER ALS ALBUM */

.vinyl-button.single {
  width: 105px;
}

.vinyl-button.album {
  width: 130px;
}

/* VINYL-GRAFIKEN */

.disc-container {
  position: relative;

  width: 100%;
  aspect-ratio: 1;

  border-radius: 50%;
}

.disc-container img {
  position: relative;
  z-index: 2;

  display: block;

  width: 100%;
  height: 100%;

  object-fit: contain;
  border-radius: 50%;

  filter: drop-shadow(
    0 5px 10px rgba(0,0,0,.5)
  );
}

.vinyl-button.active img {
  filter:
    drop-shadow(
      0 0 10px rgba(91,169,255,.32)
    )
    drop-shadow(
      0 5px 10px rgba(0,0,0,.5)
    );
}

/* ERSATZPLATTE BEI LADEFEHLER */

.fallback-vinyl {
  position: absolute;
  inset: 0;

  display: grid;
  place-items: center;

  overflow: hidden;

  border-radius: 50%;
  border: 1px solid #8296aa;

  background:
    repeating-radial-gradient(
      circle,
      transparent 0px,
      transparent 5px,
      rgba(175,200,225,.13) 6px,
      #090d13 8px
    ),
    conic-gradient(
      #090e14,
      #64788c,
      #090e14,
      #27394a,
      #090e14
    );
}

.fallback-vinyl span {
  display: grid;
  place-items: center;

  width: 55%;
  aspect-ratio: 1;

  border-radius: 50%;
  border: 1px solid #b2c5d8;

  background: #192736;
  color: white;

  font-family: "Michroma", sans-serif;
  font-size: 7px;
}

/* TEXT UNTER VINYL */

.vinyl-label {
  color: #b6c9df;

  font-family: "Michroma", Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 1px;
}

.vinyl-button.active .vinyl-label {
  color: #e1f0ff;
  text-shadow: 0 0 10px #518ccc;
}

/* SONG- UND ALBUMGALERIE */

.content {

  max-width: 1400px;

  margin: 0 auto;
  padding: 45px 24px 90px;

  background: var(--background);
  text-align: center;
}

.section-heading {
  margin: 0 0 14px;

.section-subtitle {

.music-card {

  border: 1px solid var(--line);
  border-radius: 12px;

.music-card:hover {

}

.cover-button {

  border: 0;

}

.cover-button:disabled {

}

.cover {

  width: 100%;
  aspect-ratio: 1;

  background: #090d13;
  border-radius: 7px;
}

.track-title {
  margin: 14px 0 5px;

  font-size: 14px;

.track-version {
  margin-bottom: 8px;

  color: #9bafc5;
  font-size: 12px;
}

.track-date {
  margin-bottom: 10px;

  color: #8197ae;
  font-size: 11px;
}

.music-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;

  gap: 7px;
  margin-top: 12px;
}

.music-links a {
  padding: 8px 10px;

  background: #293d53;
  border-radius: 6px;

  color: #d6e9fc;
  text-decoration: none;
  font-size: 11px;
}

.music-links a:hover {

}

.empty-message {
  grid-column: 1 / -1;

  padding: 38px 18px;

  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;

  color: #aebfd2;
}

.more-button {
  margin-top: 35px;
  padding: 13px 22px;

  background: #263c52;

  border: 1px solid #6587aa;
  border-radius: 7px;

  color: white;

  font-family: "Michroma", Arial, sans-serif;
  font-size: 10px;

  cursor: pointer;
}

.more-button[hidden] {
  display: none;
}

/* YOUTUBE-VIDEOFENSTER */

.video-modal {
  display: none;

  position: fixed;
  inset: 0;
  z-index: 1000;

  padding: 25px;

  background: rgba(0,0,0,.94);

  align-items: center;
  justify-content: center;
}

.video-modal.open {
  display: flex;
}

.video-window {
  position: relative;
  width: min(900px, 100%);
}

.video-frame {
  width: 100%;
  aspect-ratio: 16 / 9;

  border: 0;
  background: black;
}

.close-video {
  position: absolute;

  right: 0;
  top: -48px;

  background: none;
  border: 0;

  color: white;
  font-size: 34px;

  cursor: pointer;

/* FUSSZEILE */

footer {

  background: var(--background);
  color: #7d91a7;

  text-align: center;
  font-size: 12px;

/* TABLET */

@media (max-width: 1050px) {

    grid-template-columns:

    width: min(690px, 92%);

/* SMARTPHONE */

@media (max-width: 600px) {

  }

  }

}

</style>

<script>

/* MISCHPULT-MECHANIK */
/* EINE FADERLAENGE HOCHSCHIEBEN */

for (
  const handle of
  document.querySelectorAll(".fader-handle")
) {

  let startY = null;
  let distance = 0;
  let pointerId = null;

  const travel = 36;

  const reset = () => {

    startY = null;
    pointerId = null;
    distance = 0;

    handle.classList.remove("dragging");
    handle.classList.add("returning");

    handle.style.setProperty(
      "--drag",
      "0px"
    );

  };

  /* SCHIEBEN BEGINNEN */

  handle.addEventListener(
    "pointerdown",
    event => {

      if (
        event.button !== 0 &&
        event.pointerType === "mouse"
      ) {
        return;
      }

      event.preventDefault();

      handle.classList.remove(
        "returning"
      );

      pointerId = event.pointerId;
      startY = event.clientY;
      distance = 0;

      handle.classList.add(
        "dragging"
      );

      handle.setPointerCapture(
        event.pointerId
      );

    }
  );

  /* REGLER BEWEGEN */

  handle.addEventListener(
    "pointermove",
    event => {

      if (
        startY === null ||
        event.pointerId !== pointerId
      ) {
        return;
      }

      distance = Math.min(
        travel,
        Math.max(
          0,
          startY - event.clientY
        )
      );

      handle.style.setProperty(
        "--drag",
        distance + "px"
      );

    }
  );

  /* REGLER LOSLASSEN */

  handle.addEventListener(
    "pointerup",
    event => {

      if (
        startY === null ||
        event.pointerId !== pointerId
      ) {
        return;
      }

      const reached =
        distance >= travel * 0.85;

      reset();

      if (reached) {

        window.location.assign(
          handle.dataset.url
        );

      }

    }
  );

  /* BEWEGUNG ABBRECHEN */

  handle.addEventListener(
    "pointercancel",
    reset
  );

  handle.addEventListener(
    "lostpointercapture",
    () => {

      if (startY !== null) {
        reset();
      }

    }
  );

  /* TASTATUR-ALTERNATIVE */

  handle.addEventListener(
    "keydown",
    event => {

      if (event.key === "ArrowUp") {

        event.preventDefault();

        window.location.assign(
          handle.dataset.url
        );

      }

    }
  );

}

  document.getElementById("sectionSubtitle");

const moreButton =
  document.getElementById("moreButton");

const videoModal =
  document.getElementById("videoModal");

const videoFrame =
  document.getElementById("videoFrame");

const closeVideo =
  document.getElementById("closeVideo");

/* MUSIKDATEN */

let allMusic = [];
let activeCategory = "single";
let visibleCount = 10;

/* HTML-TEXT ABSICHERN */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

/* LINKS PRÜFEN */

function safeURL(value) {

  try {

    const url = new URL(
      value,
      window.location.href
    );

    if (
      url.protocol === "https:" ||
      url.protocol === "http:"
    ) {
      return url.href;
    }

  } catch {}

  return "";

}

/* DATUM FORMATIEREN */

function formatDate(value) {

  if (!value) return "";

  const date = new Date(
    String(value).slice(0, 10) +
    "T12:00:00"
  );

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleDateString(
    "de-DE",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );

}

/* SINGLE ODER ALBUM */

function categoryOf(item) {

  const category = String(
    item.type ||
    item.category ||
    "single"
  ).toLowerCase();

  return [
    "album",
    "albums",
    "lp"
  ].includes(category)
    ? "album"
    : "single";

}

/* YOUTUBE-ID ERMITTELN */

function getYoutubeId(item) {

  const value = String(
    item.youtube || ""
  ).trim();

  if (
    /^[A-Za-z0-9_-]{11}$/.test(value)
  ) {
    return value;
  }

  try {

    const url = new URL(value);

    const hostname =
      url.hostname.toLowerCase();

    if (
      hostname === "youtu.be" ||
      hostname === "www.youtu.be"
    ) {

      return (
        url.pathname.split("/")[1] || ""
      );

    }

    if (
      hostname === "youtube.com" ||
      hostname === "www.youtube.com" ||
      hostname === "m.youtube.com"
    ) {

      if (url.pathname === "/watch") {

        return (
          url.searchParams.get("v") || ""
        );

      }

      const parts =
        url.pathname.split("/");

      if (
        [
          "shorts",
          "embed",
          "live"
        ].includes(parts[1])
      ) {

        return parts[2] || "";

      }

    }

  } catch {}

  return "";

}

/* VIDEO ÖFFNEN */

function openVideo(videoId) {

  if (
    !/^[A-Za-z0-9_-]{11}$/.test(videoId)
  ) {
    return;
  }

  videoFrame.src =
    "https://www.youtube-nocookie.com/embed/" +
    videoId +
    "?autoplay=1";

  videoModal.classList.add(
    "open"
  );

}

/* VIDEO SCHLIESSEN */

function closeVideoPlayer() {

  videoModal.classList.remove(
    "open"
  );

  videoFrame.src = "";

}

closeVideo.addEventListener(
  "click",
  closeVideoPlayer
);

videoModal.addEventListener(
  "click",
  event => {

    if (
      event.target === videoModal
    ) {
      closeVideoPlayer();
    }

  }
);

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {
      closeVideoPlayer();
    }

  }
);

/* GALERIE AUFBAUEN */

function renderMusic() {

  const isSingle =
    activeCategory === "single";

  sectionTitle.textContent =
    isSingle
      ? "SINGLES"
      : "ALBUMS";

  sectionSubtitle.textContent =
    isSingle
      ? "The Singles Collection"
      : "The Album Collection";

  singlesButton.classList.toggle(
    "active",
    isSingle
  );

  albumsButton.classList.toggle(
    "active",
    !isSingle
  );

  singlesButton.setAttribute(
    "aria-pressed",
    String(isSingle)
  );

  albumsButton.setAttribute(
    "aria-pressed",
    String(!isSingle)
  );

  const items = allMusic
    .filter(
      item =>
        categoryOf(item) === activeCategory
    )
    .sort(
      (a, b) =>
        String(
          b.releaseDate || ""
        ).localeCompare(
          String(
            a.releaseDate || ""
          )
        )
    );

  gallery.innerHTML = "";

  if (items.length === 0) {

    gallery.innerHTML = `
      <div class="empty-message">
        ${
          isSingle
            ? "Hier erscheinen deine R.M.B.-Singles."
            : "Hier erscheinen deine R.M.B.-Alben."
        }
      </div>
    `;

    moreButton.hidden = true;

    return;

  }

  items
    .slice(0, visibleCount)
    .forEach(item => {

      const videoId =
        getYoutubeId(item);

      const validVideoId =
        /^[A-Za-z0-9_-]{11}$/.test(videoId)
          ? videoId
          : "";

      const cover =
        safeURL(item.cover) ||
        (
          validVideoId
            ? "https://img.youtube.com/vi/" +
              validVideoId +
              "/hqdefault.jpg"
            : ""
        );

      const spotify =
        safeURL(item.spotify);

      const amazon =
        safeURL(item.amazon);

      const date =
        formatDate(item.releaseDate);

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "music-card";

      card.innerHTML = `

        <button
          type="button"
          class="cover-button"
          ${
            validVideoId
              ? ""
              : "disabled"
          }
          aria-label="Video öffnen"
        >

          <img
            class="cover"
            src="${escapeHTML(cover)}"
            alt="${escapeHTML(
              item.title || "R.M.B."
            )}"
            loading="lazy"
          >

        </button>

        <div class="track-title">
          ${escapeHTML(
            item.title || "R.M.B."
          )}
        </div>

        <div class="track-version">
          ${escapeHTML(
            item.version || ""
          )}
        </div>

        ${
          date
            ? `
              <div class="track-date">
                ${escapeHTML(date)}
              </div>
            `
            : ""
        }

        <div class="music-links">

          ${
            validVideoId
              ? `
                <a
                  href="https://www.youtube.com/watch?v=${validVideoId}"
                  target="_blank"
                  rel="noopener noreferrer"
                >YouTube</a>
              `
              : ""
          }

          ${
            spotify
              ? `
                <a
                  href="${escapeHTML(spotify)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >Spotify</a>
              `
              : ""
          }

          ${
            amazon
              ? `
                <a
                  href="${escapeHTML(amazon)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >Amazon</a>
              `
              : ""
          }

        </div>
      `;

      if (validVideoId) {

        card.querySelector(
          ".cover-button"
        ).addEventListener(
          "click",
          () => openVideo(validVideoId)
        );

      }

      gallery.appendChild(card);

    });

  moreButton.hidden =
    items.length <= visibleCount;

  moreButton.textContent =
    isSingle
      ? "WEITERE SONGS ANZEIGEN"
      : "WEITERE ALBEN ANZEIGEN";

}

/* SINGLE AUSWÄHLEN */

singlesButton.addEventListener(
  "click",
  () => {

    activeCategory = "single";
    visibleCount = 10;

    renderMusic();

  }
);

/* ALBUM AUSWÄHLEN */

albumsButton.addEventListener(
  "click",
  () => {

    activeCategory = "album";
    visibleCount = 10;

    renderMusic();

  }
);

/* WEITERE TITEL ANZEIGEN */

moreButton.addEventListener(
  "click",
  () => {

    visibleCount += 10;

    renderMusic();

  }
);

/* SONGS.JSON EINLESEN */

fetch("songs.json")

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "songs.json nicht gefunden"
      );

    }

    return response.json();

  })

  .then(data => {

    allMusic =
      Array.isArray(data)
        ? data
        : [];

    renderMusic();

  })

  .catch(error => {

    gallery.innerHTML = `
      <div class="empty-message">
        Die Musikdaten konnten
        nicht geladen werden.
      </div>
    `;

    console.error(error);

  });

</script>

</body>
</html>
